<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#071650">
<meta name="description" content="Q-Summit: Feel the Q Spirit. Ein Pixel-Art-Spiel: Du bist Chair der Q-Summit im Mannheimer Schloss.">
<title>Q-Summit: Feel the Q Spirit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=UnifrakturMaguntia&family=Old+Standard+TT:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #040b30;
    --navy: #071650;
    --panel: #0e1d63;
    --panel-2: #16297e;
    --panel-3: #22399c;
    --edge: #3557d8;
    --q: #2f6bff;
    --text: #f4f6ff;
    --muted: #a9b8e8;
    --fill: #6fb1ff;
    --good: #3ecf8e;
    --bad: #ff5d6c;
    --warn: #ffd166;
    --font: "Pixelify Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --pix: "Press Start 2P", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: var(--ink); color: var(--text); font-family: var(--font); font-size: 16px; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; }
  .pix { font-family: var(--pix); }
  .muted { color: var(--muted); }
  p { margin: 0; line-height: 1.4; }
  h1, h2, h3 { margin: 0; font-weight: 700; }

  #game { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
  #world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; cursor: pointer; transform-origin: 50% 50%; transition: transform .28s cubic-bezier(.5,0,.75,0), filter .28s; }
  #world.zoom { filter: brightness(1.15) blur(1px); }
  #labels { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; transition: opacity .2s; }
  #world.zoom + #labels { opacity: 0; }

  /* Pixel-Rahmen */
  .frame { background: var(--panel); border: 2px solid var(--ink); border-radius: 6px; box-shadow: inset 0 0 0 2px var(--edge), inset 0 -5px 0 2px rgba(0,0,0,.22), 0 4px 0 rgba(0,0,0,.45); }
  .glass { background: rgba(6, 16, 64, .74); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 2px solid rgba(160, 185, 255, .18); border-radius: 10px; box-shadow: 0 4px 0 rgba(0,0,0,.35); }

  /* ---------- HUD ---------- */
  #hud { position: absolute; left: 0; right: 0; top: 0; padding: max(8px, env(safe-area-inset-top)) 10px 0; display: grid; gap: 6px; z-index: 5; pointer-events: none; transition: opacity .3s, transform .3s; }
  #hud.off { opacity: 0; transform: translateY(-20px); }
  #hud > * { pointer-events: auto; }
  .hud-row { display: flex; gap: 8px; align-items: flex-start; }
  #clockcard { flex: 1; min-width: 0; padding: 7px 10px 8px; display: grid; gap: 5px; max-width: 420px; }
  .clk-top { display: flex; align-items: center; gap: 8px; }
  #clock { font-family: var(--pix); font-size: 11px; letter-spacing: 1px; white-space: nowrap; }
  #sun { font-size: 15px; line-height: 1; }
  #energy { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
  #energy .eb { width: 38px; height: 7px; border-radius: 2px; background: #00000066; overflow: hidden; box-shadow: inset 0 0 0 1px #ffffff22; }
  #energy .eb div { height: 100%; background: #c98a4a; transition: width .5s; }
  #energy.low { color: var(--bad); animation: pulseTxt 1s infinite; }
  @keyframes pulseTxt { 50% { opacity: .5; } }
  .dayprog { height: 4px; border-radius: 2px; background: #00000055; overflow: hidden; }
  #dayfill { height: 100%; background: linear-gradient(90deg, #ffd166, #ff8a3d, #7b5bd0); transition: width 1s linear; }
  #nextup { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #nextup b { color: var(--text); font-weight: 600; }
  .hud-btns { display: flex; gap: 6px; }
  .hbtn { appearance: none; border: 0; cursor: pointer; width: 44px; height: 44px; border-radius: 10px; font-size: 19px; position: relative; display: grid; place-items: center; }
  .hbtn:active { transform: translateY(2px); }
  #pausedot { position: absolute; top: -3px; right: -3px; width: 12px; height: 12px; border-radius: 50%; background: var(--bad); border: 2px solid var(--ink); }

  .stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; max-width: 560px; }
  .stat { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 3px 5px; padding: 4px 6px 5px; border-radius: 8px; transition: box-shadow .3s, transform .2s; }
  .stat .ic { font-size: 13px; line-height: 1; }
  .stat .v { font-family: var(--pix); font-size: 9px; text-align: right; }
  .stat .bar { grid-column: 1 / -1; height: 5px; background: #00000066; border-radius: 2px; overflow: hidden; }
  .stat .fill { height: 100%; background: var(--fill); transition: width .45s; }
  .stat.mid .fill { background: var(--warn); }
  .stat.low .fill { background: var(--bad); }
  .stat.low { animation: pulse 1s infinite; }
  .stat.up { box-shadow: 0 0 0 2px var(--good); transform: translateY(-2px); }
  .stat.down { box-shadow: 0 0 0 2px var(--bad); transform: translateY(2px); }
  @keyframes pulse { 50% { background: rgba(110, 20, 45, .8); } }

  #minimap { position: absolute; right: 10px; top: calc(max(8px, env(safe-area-inset-top)) + 104px); width: 132px; image-rendering: pixelated; border-radius: 8px; z-index: 4; cursor: pointer; border: 2px solid rgba(160,185,255,.25); box-shadow: 0 4px 0 rgba(0,0,0,.35); background: var(--ink); }

  #bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 10px max(10px, env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: 10px; z-index: 5; pointer-events: none; transition: opacity .3s, transform .3s; }
  #bottom.off { opacity: 0; transform: translateY(30px); }
  #bottom > * { pointer-events: auto; }
  #taskbtn { appearance: none; border: 0; flex: 1; min-width: 0; max-width: 420px; padding: 9px 12px; display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer; }
  #taskbtn .tb-count { font-family: var(--pix); font-size: 10px; background: var(--warn); color: #3a2600; border-radius: 6px; padding: 6px 7px; flex-shrink: 0; box-shadow: 0 2px 0 #a07a1a; }
  #taskbtn .tb-count.zero { background: var(--panel-3); color: var(--muted); box-shadow: none; }
  #taskbtn .tb-text { font-size: 15px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #taskbtn .tb-text small { display: block; color: var(--muted); font-size: 13px; }
  #taskbtn.crit { animation: critGlow 1s infinite; }
  @keyframes critGlow { 50% { box-shadow: 0 0 0 2px var(--bad), 0 4px 0 rgba(0,0,0,.35); } }
  #phonebtn { appearance: none; border: 0; position: relative; width: 60px; height: 60px; border-radius: 18px; font-size: 28px; cursor: pointer; flex-shrink: 0; margin-left: auto; background: linear-gradient(180deg, #f2f5f7, #cfd8dd); box-shadow: inset 0 -4px 0 #9fb0b8, 0 4px 0 rgba(0,0,0,.45); }
  #phonebtn.ring { animation: ring .5s 2; }
  @keyframes ring { 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
  #phonebadge { position: absolute; top: -6px; right: -6px; background: #25d366; color: #04210f; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 1px 7px; border: 2px solid var(--ink); }
  #phonebadge:empty { display: none; }
  #talkbtn { position: absolute; left: 50%; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 76px); transform: translateX(-50%); appearance: none; border: 0; background: #fff; color: var(--navy); border-radius: 10px; padding: 12px 18px; font-family: var(--pix); font-size: 10px; cursor: pointer; z-index: 6; animation: bob 1s infinite; white-space: nowrap; box-shadow: inset 0 -4px 0 #b9c7f5, 0 4px 0 rgba(0,0,0,.45); }
  #talkbtn .key { background: var(--navy); color: #fff; border-radius: 4px; padding: 3px 5px; margin-right: 8px; font-size: 8px; }
  @keyframes bob { 50% { transform: translate(-50%, -3px); } }

  .toasts { position: absolute; left: 50%; top: calc(max(8px, env(safe-area-inset-top)) + 106px); transform: translateX(-50%); display: flex; gap: 6px; pointer-events: none; z-index: 7; flex-wrap: wrap; justify-content: center; width: 92%; max-width: 560px; }
  .toast { padding: 7px 12px; border-radius: 8px; font-weight: 700; font-size: 15px; animation: toast 1.8s ease forwards; box-shadow: 0 3px 0 rgba(0,0,0,.4); }
  .toast.up { background: var(--good); color: #062b1b; }
  .toast.down { background: var(--bad); color: #2b0609; }
  .toast.info { background: var(--warn); color: #3a2600; animation-duration: 2.6s; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(8px) scale(.9); } 10% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-12px); } }

  /* ---------- First Person ---------- */
  #fp { position: absolute; inset: 0; z-index: 6; background: #000; animation: fpIn .25s ease; }
  @keyframes fpIn { from { opacity: 0; } }
  #fpc { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #fpui { position: absolute; inset: 0; pointer-events: none; }
  #fpui > * { pointer-events: auto; }
  .fp-place { position: absolute; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%); font-family: var(--pix); font-size: 9px; letter-spacing: 1px; padding: 7px 10px; border-radius: 6px; white-space: nowrap; }
  .fp-skip { position: absolute; right: 12px; top: max(12px, env(safe-area-inset-top)); appearance: none; border: 0; cursor: pointer; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
  .letterbox::before, .letterbox::after { content: ""; position: absolute; left: 0; right: 0; height: 7vh; background: #000; z-index: 1; }
  .letterbox::before { top: 0; } .letterbox::after { bottom: 0; }

  /* ---------- Dialog ---------- */
  #dialog { position: absolute; left: 10px; right: 10px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 8; max-width: 720px; margin: 0 auto; padding: 18px 16px 14px; display: grid; gap: 12px; animation: dlgIn .22s ease; }
  @keyframes dlgIn { from { transform: translateY(24px); opacity: 0; } }
  .dlg-name { position: absolute; left: 14px; top: -16px; display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 6px; background: var(--q); box-shadow: 0 3px 0 #0b1a5c, inset 0 -3px 0 #1d49c4; }
  .dlg-name b { font-family: var(--pix); font-size: 10px; letter-spacing: .5px; }
  .dlg-name span { font-size: 13px; opacity: .85; }
  .dlg-timer { position: absolute; right: 14px; top: -14px; font-family: var(--pix); font-size: 9px; padding: 6px 8px; border-radius: 6px; background: var(--warn); color: #3a2600; box-shadow: 0 3px 0 #a07a1a; }
  .dlg-timer.crit { background: var(--bad); color: #fff; box-shadow: 0 3px 0 #8f1f2c; animation: pulseTxt .8s infinite; }
  .dlg-text { font-size: 21px; line-height: 1.3; min-height: 56px; cursor: pointer; }
  .dlg-text .cur { display: inline-block; width: 10px; height: 4px; background: var(--text); margin-left: 4px; animation: pulseTxt .6s infinite; }
  .dlg-opts { display: grid; gap: 8px; }
  .dlg-opt { appearance: none; border: 0; background: var(--panel-2); border-radius: 8px; padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px; align-items: center; text-align: left; cursor: pointer; font-size: 17px; line-height: 1.25; box-shadow: inset 0 0 0 2px #ffffff22, 0 3px 0 rgba(0,0,0,.4); transition: transform .08s, background .15s, box-shadow .15s; }
  .dlg-opt:hover, .dlg-opt:focus-visible { background: var(--panel-3); box-shadow: inset 0 0 0 2px #fff, 0 3px 0 rgba(0,0,0,.4); outline: none; }
  .dlg-opt:active { transform: translateY(2px); }
  .dlg-opt .k { font-family: var(--pix); font-size: 9px; color: var(--warn); margin-right: 10px; }
  .dlg-opt .hint { font-size: 13px; opacity: .85; white-space: nowrap; letter-spacing: 1px; }
  .dlg-opt.next { justify-content: flex-end; background: transparent; box-shadow: none; padding: 4px 6px; font-size: 15px; color: var(--muted); }
  .dlg-opt.next:hover { box-shadow: none; color: var(--text); }
  .dlg-later { appearance: none; background: none; border: 0; color: var(--muted); font-size: 14px; justify-self: end; cursor: pointer; padding: 2px 4px; }
  .reaction { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; z-index: 9; pointer-events: none; animation: popIn .3s ease; }
  .reaction .fx { font-size: 18px; padding: 8px 12px; }
  @keyframes popIn { from { transform: translate(-50%, -30%) scale(.7); opacity: 0; } }

  /* ---------- Handy ---------- */
  #phone { position: absolute; inset: 0; z-index: 9; display: flex; justify-content: center; align-items: center; background: rgba(2, 6, 30, .55); animation: fpIn .2s ease; }
  .device { position: relative; width: 100%; height: 100%; background: #0b141a; display: flex; flex-direction: column; color: #e9edef; overflow: hidden; animation: slideup .25s ease; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  @media (min-width: 700px) and (min-height: 640px) {
    .device { width: 390px; height: min(800px, 92vh); border-radius: 46px; border: 12px solid #15171c; box-shadow: 0 0 0 2px #3a3f4a, 0 30px 80px rgba(0,0,0,.6); }
    .device::before { content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 110px; height: 30px; background: #000; border-radius: 20px; z-index: 3; }
    .ph-status { padding-top: 16px !important; }
  }
  @keyframes slideup { from { transform: translateY(40px); opacity: 0; } }
  .ph-status { display: flex; justify-content: space-between; padding: max(10px, env(safe-area-inset-top)) 22px 6px; font-size: 14px; font-weight: 700; background: inherit; position: relative; z-index: 2; }
  .ph-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #202c33; min-height: 58px; }
  .ph-head .ph-title { font-weight: 700; font-size: 18px; flex: 1; min-width: 0; }
  .ph-head .ph-sub { font-size: 12px; color: #8696a0; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ph-back, .ph-close { appearance: none; border: 0; background: none; color: #e9edef; font-size: 26px; cursor: pointer; padding: 0 6px; }
  .ph-list { flex: 1; overflow-y: auto; }
  .ph-row { display: flex; gap: 12px; padding: 11px 14px; align-items: center; border-bottom: 1px solid #1f2a30; cursor: pointer; }
  .ph-row:active { background: #202c33; }
  .ph-av { width: 46px; height: 46px; border-radius: 50%; background: #2a3942; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
  .ph-main { flex: 1; min-width: 0; }
  .ph-name { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; font-size: 16px; }
  .ph-time { font-size: 12px; color: #8696a0; font-weight: 400; flex-shrink: 0; }
  .ph-time.new { color: #25d366; }
  .ph-prev { font-size: 14px; color: #8696a0; display: flex; justify-content: space-between; gap: 8px; margin-top: 3px; }
  .ph-prev span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ph-unread { background: #25d366; color: #0b141a; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 1px 7px; flex-shrink: 0; }
  .ph-msgs { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; background-color: #0b141a; background-image: radial-gradient(#ffffff08 1px, transparent 1px); background-size: 18px 18px; }
  .ph-day { align-self: center; background: #182229; color: #8696a0; font-size: 12px; padding: 4px 10px; border-radius: 8px; margin: 6px 0; }
  .bub { max-width: 82%; padding: 6px 9px 4px; border-radius: 9px; font-size: 15px; line-height: 1.35; animation: bubIn .2s ease; }
  @keyframes bubIn { from { transform: scale(.92); opacity: 0; } }
  .bub.in { background: #202c33; align-self: flex-start; border-top-left-radius: 2px; }
  .bub.out { background: #005c4b; align-self: flex-end; border-top-right-radius: 2px; }
  .bub .from { font-size: 13px; font-weight: 700; margin-bottom: 1px; }
  .bub .t { font-size: 11px; color: #ffffff80; text-align: right; margin-top: 1px; }
  .bub.urgent { box-shadow: 0 0 0 2px var(--warn); }
  .bub.big { font-size: 40px; background: none; padding: 0; }
  .ph-replies { padding: 8px 8px max(10px, env(safe-area-inset-bottom)); display: grid; gap: 6px; background: #202c33; }
  .ph-replies .lbl { font-size: 12px; color: #8696a0; padding: 0 4px; display: flex; justify-content: space-between; }
  .ph-reply { appearance: none; border: 0; background: #2a3942; border-radius: 18px; padding: 11px 14px; text-align: left; display: flex; justify-content: space-between; gap: 10px; cursor: pointer; font-size: 15px; }
  .ph-reply:hover { background: #33454f; }
  .ph-reply:active { background: #005c4b; }
  .ph-reply .hint { opacity: .75; font-size: 12px; letter-spacing: 1px; white-space: nowrap; }
  .ph-input { display: flex; gap: 8px; padding: 8px 10px max(10px, env(safe-area-inset-bottom)); background: #202c33; align-items: center; }
  .ph-input div { flex: 1; background: #2a3942; border-radius: 20px; padding: 10px 14px; color: #8696a0; font-size: 15px; }
  .home { flex: 1; display: flex; flex-direction: column; padding: 10px 22px max(18px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, #0b1d6e 0%, #2a3aa8 45%, #f08a5d 100%); position: relative; }
  .home-clock { text-align: center; font-size: 64px; font-weight: 200; letter-spacing: -2px; margin-top: 18px; }
  .home-date { text-align: center; font-size: 15px; opacity: .85; margin-bottom: 26px; }
  .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 10px; }
  .app { appearance: none; border: 0; background: none; cursor: pointer; display: grid; justify-items: center; gap: 6px; font-size: 12px; position: relative; color: #fff; }
  .app .ico { width: 60px; height: 60px; border-radius: 15px; display: grid; place-items: center; font-size: 30px; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  .app .bd { position: absolute; top: -5px; right: 2px; background: #ff3b30; color: #fff; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 6px; }
  .dock { margin-top: auto; background: rgba(255,255,255,.18); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-radius: 26px; padding: 12px; display: flex; justify-content: space-around; }
  .wall-art { position: absolute; left: 0; right: 0; bottom: 96px; height: 90px; image-rendering: pixelated; opacity: .9; pointer-events: none; }
  .ph-page { flex: 1; overflow-y: auto; padding: 12px; display: grid; gap: 10px; align-content: start; background: #0b141a; }
  .album { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .polaroid { background: #f6f3ea; color: #222; border-radius: 3px; padding: 6px 6px 8px; display: grid; gap: 4px; box-shadow: 0 3px 8px rgba(0,0,0,.4); transform: rotate(var(--r, 0deg)); }
  .polaroid canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; background: #9fb6d8; }
  .polaroid b { font-size: 11px; line-height: 1.1; }
  .polaroid small { font-size: 10px; color: #666; line-height: 1.1; }
  .polaroid.missing { background: #1f2a30; color: #8696a0; box-shadow: none; }
  .polaroid.missing canvas { background: #2a3942; }
  .ach { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; background: #1f2a30; border-radius: 12px; padding: 10px; }
  .ach .ai { font-size: 26px; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: #2a3942; }
  .ach b { font-size: 15px; display: block; }
  .ach small { font-size: 12px; color: #8696a0; }
  .ach.locked { opacity: .45; }
  .ach.locked .ai { filter: grayscale(1); }
  .ag-phone { display: grid; grid-template-columns: 52px 1fr; gap: 10px; background: #1f2a30; border-radius: 12px; padding: 10px 12px; }
  .ag-phone .t { font-weight: 700; color: #53bdeb; font-size: 14px; }
  .ag-phone b { display: block; font-size: 15px; }
  .ag-phone small { color: #8696a0; font-size: 12px; }
  .ag-phone.now { box-shadow: inset 3px 0 0 #25d366; }
  .ag-phone.past { opacity: .45; }

  #notif { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px; z-index: 11; background: rgba(30, 40, 48, .96); border-radius: 16px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; transform: translateY(-160%); transition: transform .3s ease; cursor: pointer; color: #e9edef; box-shadow: 0 8px 24px rgba(0,0,0,.5); max-width: 460px; margin: 0 auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #notif.show { transform: none; }
  #notif .n-av { width: 38px; height: 38px; border-radius: 10px; background: #25d366; display: grid; place-items: center; font-size: 19px; flex-shrink: 0; }
  #notif .n-title { font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; }
  #notif .n-title span { font-weight: 400; color: #8696a0; }
  #notif .n-text { font-size: 14px; color: #c7d0d6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #notif .n-body { min-width: 0; flex: 1; }

  #achv { position: absolute; left: 50%; top: max(10px, env(safe-area-inset-top)); transform: translate(-50%, -180%); z-index: 12; display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 999px; background: #10183f; border: 2px solid var(--warn); box-shadow: 0 8px 24px rgba(0,0,0,.5); transition: transform .45s cubic-bezier(.2, 1.4, .4, 1); white-space: nowrap; pointer-events: none; }
  #achv.show { transform: translate(-50%, 0); }
  #achv .ai { width: 40px; height: 40px; border-radius: 50%; background: var(--warn); display: grid; place-items: center; font-size: 22px; }
  #achv small { display: block; font-family: var(--pix); font-size: 8px; color: var(--warn); margin-bottom: 4px; }
  #achv b { font-size: 16px; }

  #flash { position: absolute; inset: 0; background: #fff; z-index: 13; opacity: 0; pointer-events: none; }
  #flash.go { animation: flash .5s ease; }
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
  #fade { position: absolute; inset: 0; background: #000; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .45s; }
  #fade.on { opacity: 1; pointer-events: auto; }

  /* Coach marks */
  #coach { position: absolute; inset: 0; z-index: 14; }
  .coach-ring { position: absolute; border-radius: 12px; box-shadow: 0 0 0 4px var(--warn), 0 0 0 9999px rgba(2, 6, 30, .7); transition: all .3s ease; pointer-events: none; }
  .coach-tip { position: absolute; left: 16px; right: 16px; max-width: 380px; margin: 0 auto; padding: 14px 14px 12px; display: grid; gap: 10px; transition: top .3s ease; }
  .coach-tip p { font-size: 17px; line-height: 1.3; }
  .coach-tip .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .coach-tip .row small { color: var(--muted); font-size: 13px; }

  /* ---------- Aufgabenliste ---------- */
  #sheet { position: absolute; left: 10px; right: 10px; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 72px); z-index: 7; max-width: 520px; padding: 12px; max-height: 60%; overflow-y: auto; display: grid; gap: 8px; animation: slideup .2s ease; }
  .sh-head { display: flex; justify-content: space-between; align-items: center; }
  .sh-row { background: var(--panel-2); border-radius: 8px; padding: 9px 10px; display: flex; gap: 10px; align-items: center; box-shadow: inset 0 0 0 2px #ffffff14; }
  .sh-row .sh-av { font-size: 22px; }
  .sh-row .sh-main { flex: 1; min-width: 0; }
  .sh-row .sh-main b { display: block; font-size: 15px; }
  .sh-row .sh-main small { color: var(--muted); font-size: 13px; }
  .sh-row .sh-time { font-family: var(--pix); font-size: 9px; color: var(--warn); }
  .sh-row .sh-time.crit { color: var(--bad); }
  .sh-go { appearance: none; border: 0; background: #fff; color: var(--navy); font-weight: 700; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 14px; box-shadow: inset 0 -3px 0 #b9c7f5; }

  /* ---------- Overlays ---------- */
  #overlay { position: absolute; inset: 0; z-index: 10; background: rgba(4, 11, 48, .94); overflow-y: auto; display: flex; justify-content: center; }
  #overlay.title { background: linear-gradient(180deg, rgba(4,11,48,0) 30%, rgba(4,11,48,.55) 55%, rgba(4,11,48,.92) 80%); }
  #overlay.clear { background: transparent; pointer-events: none; }
  #overlay.clear .ov > * { pointer-events: auto; }
  .ov { width: 100%; max-width: 500px; padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
  .ov > * { flex-shrink: 0; }
  .ov.center { justify-content: center; }
  .ov.bottom { justify-content: flex-end; }
  .ov.wide { max-width: 760px; }
  .btn { appearance: none; border: 0; border-radius: 10px; cursor: pointer; background: #fff; color: var(--navy); font-weight: 700; font-size: 18px; padding: 15px 18px; width: 100%; box-shadow: inset 0 -5px 0 #b9c7f5, 0 4px 0 rgba(0,0,0,.45); transition: transform .08s, filter .15s; }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: translateY(3px); box-shadow: inset 0 -2px 0 #b9c7f5, 0 1px 0 rgba(0,0,0,.45); }
  .btn.secondary { background: var(--panel-2); color: #fff; box-shadow: inset 0 0 0 2px #ffffff22, inset 0 -5px 0 rgba(0,0,0,.25), 0 4px 0 rgba(0,0,0,.45); }
  .btn.gold { background: var(--warn); color: #3a2600; box-shadow: inset 0 -5px 0 #c9971f, 0 4px 0 rgba(0,0,0,.45); }
  .btn.small { font-size: 15px; padding: 11px 14px; }
  .tagline { font-family: var(--pix); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); line-height: 1.6; }
  .panel { padding: 14px; display: grid; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fxlist { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .fx { padding: 6px 10px; border-radius: 8px; font-weight: 700; font-size: 15px; }
  .fx.up { background: rgba(62, 207, 142, .22); color: var(--good); box-shadow: inset 0 0 0 2px rgba(62,207,142,.35); }
  .fx.down { background: rgba(255, 93, 108, .22); color: var(--bad); box-shadow: inset 0 0 0 2px rgba(255,93,108,.35); }
  .summary { padding: 14px; display: grid; gap: 9px; }
  .summary .row { display: grid; grid-template-columns: 24px 1fr 34px; align-items: center; gap: 10px; }
  .summary .track { height: 8px; background: #00000055; border-radius: 3px; overflow: hidden; }
  .summary .track div { height: 100%; background: var(--fill); }
  .summary .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; }

  /* Titel */
  .title-wrap { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
  .logo { text-align: center; display: grid; gap: 10px; justify-items: center; margin-bottom: 4px; }
  .logo .q { font-family: var(--pix); font-size: clamp(34px, 9vw, 54px); line-height: 1; color: #fff; text-shadow: 0 4px 0 var(--q), 0 8px 0 #0b1a5c, 0 0 30px rgba(47,107,255,.7); letter-spacing: 2px; }
  .logo .sub { font-family: var(--pix); font-size: 10px; letter-spacing: 3px; color: var(--warn); text-shadow: 0 2px 0 #000; }
  .menu { display: grid; gap: 10px; }
  .daymod { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; margin: 8px 0; text-align: left; }
  .daymod .dm-ic { font-size: 24px; line-height: 1; }
  .daymod b { display: block; font-size: 15px; margin-bottom: 2px; }
  .daymod small { color: var(--muted); font-size: 13px; line-height: 1.35; display: block; }
  #briefing { position: absolute; left: 50%; top: 120px; transform: translateX(-50%); width: min(440px, calc(100% - 32px)); padding: 12px 14px; z-index: 7; cursor: pointer; animation: brIn .35s ease-out; transition: opacity .3s, transform .3s; }
  #briefing.out { opacity: 0; transform: translate(-50%, -12px); }
  #briefing .daymod { background: rgba(255,255,255,.06); }
  @keyframes brIn { from { opacity: 0; transform: translate(-50%, -16px); } }
  .mode-panel { width: min(520px, calc(100vw - 32px)); }
  .modes { display: grid; gap: 10px; margin: 12px 0; }
  .mode { appearance: none; border: 0; cursor: pointer; color: #fff; display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; gap: 2px 12px; align-items: center; padding: 12px 14px; text-align: left; position: relative; transition: transform .1s, box-shadow .15s; }
  .mode:hover { transform: translateY(-1px); box-shadow: inset 0 0 0 2px #6fb1ff88; }
  .mode.sel { box-shadow: inset 0 0 0 2px #ffd166; }
  .mode .m-ic { font-size: 30px; grid-row: span 2; }
  .mode .m-txt b { display: block; font-size: 17px; }
  .mode .m-txt small { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; margin-top: 2px; }
  .mode .m-best { grid-column: 2; font-size: 12px; color: #ffd166; font-weight: 700; }
  .mode .k { position: absolute; right: 10px; top: 10px; font-size: 11px; opacity: .5; }
  .menu-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .menu-row .btn { font-size: 14px; padding: 12px 6px; }
  .title-foot { text-align: center; font-size: 13px; color: var(--muted); text-shadow: 0 1px 0 #000; }
  .best { display: flex; justify-content: center; gap: 14px; font-size: 14px; color: var(--muted); }
  .best b { color: var(--warn); font-family: var(--pix); font-size: 11px; }
  .how { display: grid; gap: 8px; }
  .how div { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; font-size: 15px; line-height: 1.3; }
  .how div span:first-child { font-size: 22px; text-align: center; }

  /* ---------- Minigames ---------- */
  .mg { display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .mg-title { font-family: var(--pix); font-size: 12px; text-align: center; color: var(--warn); }
  .mg-hud { display: flex; justify-content: space-between; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 20px; }
  .result { padding: 22px 18px; display: grid; gap: 12px; text-align: center; }
  .result .big { font-size: 52px; }
  .result h2 { font-size: 22px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cell { appearance: none; border: 0; border-radius: 10px; background: var(--panel-2); cursor: pointer; transition: background .15s, transform .08s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; aspect-ratio: 1; padding: 6px; box-shadow: inset 0 0 0 2px #ffffff18, 0 3px 0 rgba(0,0,0,.4); }
  .cell .e { font-size: 32px; }
  .cell .l { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.1; }
  .cell:active { transform: scale(.95); }
  .cell.hit { background: var(--good); }
  .cell.miss { background: var(--bad); }
  .cell.done { opacity: .25; pointer-events: none; }
  .checklist { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .checklist span { background: var(--panel-2); padding: 6px 10px; border-radius: 8px; font-size: 15px; }
  .checklist span.ok { background: var(--good); color: #062b1b; }
  .meter { position: relative; height: 56px; background: var(--panel-2); border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 2px #ffffff22; }
  .zone { position: absolute; top: 0; bottom: 0; background: rgba(62, 207, 142, .35); border-left: 2px solid var(--good); border-right: 2px solid var(--good); }
  .marker { position: absolute; top: 4px; bottom: 4px; width: 6px; margin-left: -3px; background: #fff; border-radius: 3px; }
  .rounds { display: flex; gap: 8px; justify-content: center; font-size: 28px; }
  .guest { padding: 16px; text-align: center; display: grid; gap: 6px; }
  .guest .face { font-size: 42px; }
  .guest .gname { font-size: 24px; font-weight: 700; }
  .guest .grole { font-size: 16px; color: var(--muted); }
  .badges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .badge { appearance: none; border: 0; cursor: pointer; color: #0b1640; background: #fff; border-radius: 10px; overflow: hidden; padding: 0; text-align: center; transition: transform .08s; box-shadow: 0 4px 0 rgba(0,0,0,.4); }
  .badge:active { transform: scale(.96); }
  .badge .stripe { color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 6px 4px; }
  .badge .bq { font-size: 11px; color: #5a6aa0; padding-top: 8px; font-weight: 700; font-family: var(--pix); font-size: 7px; }
  .badge .bname { font-weight: 700; font-size: 17px; padding: 4px 6px 12px; }
  .badge.wrong { animation: shake .3s; outline: 3px solid var(--bad); }
  .ask { padding: 16px; display: grid; gap: 8px; text-align: center; position: relative; }
  .ask .face { font-size: 40px; }
  .ask .q { font-size: 24px; line-height: 1.15; }
  .qbar { height: 8px; background: #00000055; border-radius: 4px; overflow: hidden; }
  .qbar div { height: 100%; background: var(--warn); }
  .places { display: grid; gap: 10px; }
  .place { appearance: none; border: 0; background: var(--panel-2); border-radius: 10px; padding: 14px; font-size: 18px; font-weight: 700; display: flex; gap: 12px; align-items: center; cursor: pointer; transition: transform .08s; box-shadow: inset 0 0 0 2px #ffffff22, 0 3px 0 rgba(0,0,0,.4); }
  .place:active { transform: scale(.97); }
  .place .pi { font-size: 26px; }
  .place.right { box-shadow: inset 0 0 0 3px var(--good); background: #1c5a4a; }
  .place.wrongp { box-shadow: inset 0 0 0 3px var(--bad); animation: shake .3s; }
  .streak { font-family: var(--pix); font-size: 10px; color: var(--warn); text-align: center; min-height: 14px; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  /* Rede, Tanz, Umschlag (First-Person-Minigames) */
  .fp-hud { position: absolute; left: 12px; right: 12px; top: max(12px, env(safe-area-inset-top)); display: grid; gap: 8px; max-width: 620px; margin: 0 auto; }
  .hype { height: 16px; border-radius: 4px; background: #00000088; overflow: hidden; box-shadow: inset 0 0 0 2px #ffffff33; position: relative; }
  .hype div { height: 100%; width: 0; background: linear-gradient(90deg, #6fb1ff, #c792ea, #ffd166); transition: width .35s; }
  .hype span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--pix); font-size: 8px; color: #fff; text-shadow: 0 1px 0 #000; }
  .fp-row { display: flex; justify-content: space-between; align-items: center; font-family: var(--pix); font-size: 9px; text-shadow: 0 2px 0 #000; }
  .speech { position: absolute; left: 10px; right: 10px; bottom: max(12px, env(safe-area-inset-bottom)); max-width: 680px; margin: 0 auto; padding: 14px; display: grid; gap: 8px; }
  .speech .prompt { font-size: 15px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
  .speech .tbar { height: 5px; border-radius: 2px; background: #00000066; overflow: hidden; }
  .speech .tbar div { height: 100%; background: var(--warn); }
  .line { appearance: none; border: 0; text-align: left; cursor: pointer; padding: 12px 14px; border-radius: 8px; background: var(--panel-2); font-size: 17px; line-height: 1.25; box-shadow: inset 0 0 0 2px #ffffff22, 0 3px 0 rgba(0,0,0,.4); }
  .line:hover { box-shadow: inset 0 0 0 2px #fff, 0 3px 0 rgba(0,0,0,.4); }
  .line .k { font-family: var(--pix); font-size: 9px; color: var(--warn); margin-right: 8px; }
  .subtitle { position: absolute; left: 50%; bottom: 46%; transform: translateX(-50%); max-width: 90%; text-align: center; font-size: 22px; line-height: 1.25; padding: 8px 14px; border-radius: 8px; background: rgba(0,0,0,.65); text-shadow: 0 2px 0 #000; animation: popIn2 .25s ease; }
  .subtitle small { display: block; font-family: var(--pix); font-size: 8px; color: var(--warn); margin-bottom: 6px; }
  @keyframes popIn2 { from { opacity: 0; transform: translate(-50%, 10px); } }
  .mash { position: absolute; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(360px, 86vw); }
  .lanes { position: absolute; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: min(420px, 94vw); }
  .lane { appearance: none; border: 0; height: 64px; border-radius: 10px; font-size: 26px; cursor: pointer; background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); color: #fff; }
  .lane.hit { background: rgba(255,255,255,.45); }
  .judge { position: absolute; left: 50%; top: 32%; transform: translateX(-50%); font-family: var(--pix); font-size: 16px; text-shadow: 0 3px 0 #000; pointer-events: none; }

  /* ---------- Karte ---------- */
  .map-wrap { position: relative; width: 100%; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--edge); }
  .map-wrap canvas { width: 100%; display: block; image-rendering: pixelated; }
  .pin { position: absolute; transform: translate(-50%, -50%); appearance: none; border: 0; cursor: pointer; padding: 3px 7px; border-radius: 6px; font-size: 12px; font-weight: 700; background: rgba(4, 11, 48, .82); color: #fff; white-space: nowrap; box-shadow: 0 2px 0 rgba(0,0,0,.5); }
  .pin:hover { background: var(--q); }
  .pin.task { background: var(--warn); color: #3a2600; }

  /* ---------- Pause & Dashboard ---------- */
  #overlay.pause { background: rgba(4, 11, 48, .96); }
  .ps-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .ps-title { font-family: var(--pix); font-size: 13px; line-height: 1.5; }
  .ps-time { font-size: 14px; color: var(--muted); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 6px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { appearance: none; border: 0; background: var(--panel-2); border-radius: 8px; padding: 9px 12px; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; position: relative; box-shadow: 0 3px 0 rgba(0,0,0,.4); }
  .tab.on { background: #fff; color: var(--navy); }
  .tab .warn { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-left: 6px; vertical-align: middle; }
  .ps-body { display: grid; gap: 10px; }
  .card { background: var(--panel); border-radius: 10px; box-shadow: inset 0 0 0 2px #ffffff14; }
  .score-card { padding: 14px; display: flex; align-items: center; gap: 14px; }
  .score-card .big { font-family: var(--pix); font-size: 26px; }
  .score-card small { color: var(--muted); display: block; font-size: 14px; margin-top: 4px; line-height: 1.3; }
  .stat-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-card { padding: 10px 12px; display: grid; gap: 4px; }
  .stat-card .sc-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--muted); }
  .stat-card .sc-val { font-family: var(--pix); font-size: 16px; color: #fff; }
  .stat-card .sc-val.low { color: var(--bad); }
  .stat-card .tr { font-size: 13px; font-weight: 700; }
  .stat-card .tr.up { color: var(--good); } .stat-card .tr.down { color: var(--bad); } .stat-card .tr.flat { color: var(--muted); }
  .stat-card svg { width: 100%; height: 28px; display: block; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fact { padding: 10px; text-align: center; }
  .fact b { display: block; font-family: var(--pix); font-size: 13px; margin-bottom: 6px; }
  .fact span { font-size: 13px; color: var(--muted); }
  .note { font-size: 14px; color: var(--muted); line-height: 1.4; }
  .station { padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
  .station.bad { box-shadow: inset 3px 0 0 var(--bad), inset 0 0 0 2px #ffffff14; }
  .station.ok { box-shadow: inset 3px 0 0 var(--good), inset 0 0 0 2px #ffffff14; }
  .station .st-name { font-weight: 700; font-size: 15px; }
  .station .st-info { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
  .station .st-info .bad { color: var(--bad); font-weight: 700; }
  .station .st-info .ok { color: var(--good); font-weight: 700; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button { appearance: none; border: 0; width: 36px; height: 36px; border-radius: 8px; background: var(--panel-3); font-size: 18px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.4); }
  .stepper button:disabled { opacity: .3; cursor: default; }
  .stepper .pips { display: flex; gap: 3px; min-width: 74px; justify-content: center; }
  .pip { width: 9px; height: 14px; border-radius: 2px; background: #00000055; }
  .pip.on { background: var(--fill); }
  .pip.need { outline: 1px dashed var(--warn); }
  .pool { display: flex; justify-content: space-between; align-items: center; background: var(--panel-2); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
  .pool b { font-family: var(--pix); font-size: 12px; }
  .action { padding: 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; }
  .action .ac-ic { font-size: 26px; grid-row: span 2; }
  .action .ac-name { font-weight: 700; font-size: 15px; }
  .action .ac-desc { font-size: 13px; color: var(--muted); grid-column: 2; }
  .action .fxlist { grid-column: 2; justify-content: flex-start; gap: 4px; }
  .action .fx { font-size: 13px; padding: 3px 7px; }
  .action button { grid-row: 1 / span 3; grid-column: 3; appearance: none; border: 0; background: #fff; color: var(--navy); font-weight: 700; border-radius: 8px; padding: 9px 12px; cursor: pointer; font-size: 14px; box-shadow: inset 0 -3px 0 #b9c7f5; }
  .action button:disabled { background: var(--panel-3); color: var(--muted); cursor: default; box-shadow: none; }
  .agenda { display: grid; gap: 6px; }
  .ag { display: grid; grid-template-columns: 50px 1fr; gap: 10px; padding: 9px 12px; align-items: center; }
  .ag .ag-t { font-family: var(--pix); font-size: 9px; color: var(--muted); }
  .ag b { font-size: 15px; display: block; }
  .ag small { font-size: 13px; color: var(--muted); }
  .ag.past { opacity: .45; }
  .ag.now { background: var(--panel-3); box-shadow: inset 3px 0 0 var(--warn); }
  .ag.now .ag-t { color: var(--warn); }
  .log { display: grid; gap: 6px; }
  .lg { padding: 9px 12px; display: grid; gap: 4px; }
  .lg .lg-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); gap: 8px; }
  .lg .lg-top b { color: #fff; }

const WALK = new Set([",", "g", "-", "B", ":", ".", "_", "c", "s", "S", "D", "w", "o", "d", "G", "E"]);
const isWalk = (i, j) => i >= 0 && j >= 0 && i < W && j < H && WALK.has(grid[j][i]);

function nearestWalkable(i, j) {
  if (isWalk(i, j)) return [i, j];
  for (let r = 1; r < 8; r++)
    for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++)
      if (Math.max(Math.abs(di), Math.abs(dj)) === r && isWalk(i + di, j + dj)) return [i + di, j + dj];
  return [29, 46];
}
for (const L of Object.values(LOCS)) [L.x, L.y] = nearestWalkable(L.x, L.y);

function findPath(from, to) {
  from = nearestWalkable(from[0], from[1]);
  to = nearestWalkable(to[0], to[1]);
  const key = (i, j) => j * W + i;
  const prev = new Int32Array(W * H).fill(-1);
  const start = key(from[0], from[1]), goal = key(to[0], to[1]);
  if (start === goal) return [];
  const q = [start]; prev[start] = start;
  for (let qi = 0; qi < q.length; qi++) {
    const cur = q[qi];
    if (cur === goal) break;
    const ci = cur % W, cj = (cur / W) | 0;
    for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const ni = ci + di, nj = cj + dj;
      if (!isWalk(ni, nj)) continue;
      const k = key(ni, nj);
      if (prev[k] !== -1) continue;
      prev[k] = cur; q.push(k);
    }
    const pt = PORTALS.get(cur);
    if (pt) { const k = key(pt[0], pt[1]); if (prev[k] === -1) { prev[k] = cur; q.push(k); } }
  }
  if (prev[goal] === -1) return [];
  const path = [];
  for (let k = goal; k !== start; k = prev[k]) path.push([k % W, (k / W) | 0]);
  return path.reverse();
}

      }
    }
    return;
  }
  if (c === "D") {
    const inFacade = isFacade(grid[j][i - 1]) || isFacade(grid[j][i + 1]) || grid[j][i - 1] === "D" && isFacade(grid[j][i - 2]);
    if (inFacade && (grid[j - 1]?.[i] !== "D")) { // Bogen oben
      px(ctx, X, Y, 16, 16, PAL.plaster); px(ctx, X, Y, 16, 3, PAL.sand); px(ctx, X, Y, 16, 1, PAL.sandL);

      return;
    }
    if (inFacade) {
      px(ctx, X, Y, 16, 16, PAL.plaster); px(ctx, X + 1, Y, 14, 16, PAL.sand);
      px(ctx, X + 3, Y, 10, 16, "#3b2d20"); px(ctx, X + 3, Y + 12, 10, 4, "#4b3a2a");
      px(ctx, X + 3, Y, 2, 14, "#6e4a2f"); px(ctx, X + 11, Y, 2, 14, "#6e4a2f");
      return;
    }
    // Tür in einer Innenwand
    const fl = [grid[j + 1]?.[i], grid[j - 1]?.[i], grid[j][i + 1], grid[j][i - 1]].map((n, k) => n && WALK.has(n) && n !== "D" ? [[i, j + 1], [i, j - 1], [i + 1, j], [i - 1, j]][k] : null).find(Boolean);
    drawGround(ctx, fl ? floor[fl[1]][fl[0]] : ":", X, Y, i, j);
    const vertical = isWallish(grid[j - 1]?.[i]) || grid[j - 1]?.[i] === "D";
    if (vertical && !(isWallish(grid[j][i - 1]))) { px(ctx, X, Y, 16, 2, "#00000033"); }
    else { px(ctx, X, Y, 2, 16, "#8a5a3a"); px(ctx, X + 14, Y, 2, 16, "#8a5a3a"); }
    px(ctx, X + 3, Y + 5, 10, 6, "#7a6a5a33");
  }
}

const SKINS = ["#f1c7a5", "#e8b48f", "#d9a27a", "#c98e66", "#9c6a48", "#6e4a33"];

function drawPersonRaw(ctx, x, y, L, dir, frame) {
  const skin = L.skin, hair = L.hair, shirt = L.shirt, pants = L.pants || "#2d3142";
  const side = dir === "left" || dir === "right";
  const s1 = frame ? 1 : 0, dk = shade(shirt, .78), sk = shade(skin, .86);
  // Beine und Schuhe
  if (side) { px(ctx, x + 3, y + 11, 2, 4 - s1, pants); px(ctx, x + 5, y + 11, 2, 3 + s1, shade(pants, .8)); px(ctx, x + 3, y + 15 - s1, 2, 1, "#1b1b22"); px(ctx, x + 5, y + 14 + s1, 2, 1, "#1b1b22"); }
  else { px(ctx, x + 2, y + 11, 2, 4 - s1, pants); px(ctx, x + 6, y + 11, 2, 3 + s1, pants); px(ctx, x + 2, y + 15 - s1, 2, 1, "#1b1b22"); px(ctx, x + 6, y + 14 + s1, 2, 1, "#1b1b22"); }
  // Lange Haare hinten
  if (L.long && dir !== "up") { px(ctx, x + 1, y + 2, 8, 6, hair); }
  // Körper
  if (side) { px(ctx, x + 2, y + 6, 6, 6, shirt); px(ctx, x + (dir === "left" ? 2 : 7), y + 6, 1, 6, dk); }
  else { px(ctx, x + 1, y + 6, 8, 6, shirt); px(ctx, x + 8, y + 6, 1, 6, dk); px(ctx, x + 1, y + 11, 8, 1, dk); }
  if (L.suit && dir !== "up") { px(ctx, x + 4, y + 6, 2, 3, "#f4f4f4"); px(ctx, x + 4, y + 7, 1, 3, "#c33"); }
  // Arme
  if (side) { px(ctx, x + (dir === "left" ? 4 : 5), y + 7 + s1, 1, 3, dk); px(ctx, x + (dir === "left" ? 4 : 5), y + 10 + s1, 1, 1, skin); }
  else { px(ctx, x, y + 7 + s1, 1, 3, dk); px(ctx, x, y + 10 + s1, 1, 1, skin); px(ctx, x + 9, y + 8 - s1, 1, 3, dk); px(ctx, x + 9, y + 11 - s1, 1, 1, skin); }
  if (dir !== "up") {
    if (L.team) { px(ctx, x + 3, y + 7, 2, 2, "#ffffff"); px(ctx, x + 4, y + 8, 1, 1, shirt); }
    if (L.lanyard) { px(ctx, x + 4, y + 6, 1, 3, L.lanyard); px(ctx, x + 4, y + 9, 2, 2, "#fff"); }
  }
  // Kopf
  px(ctx, x + 2, y + 1, 6, 5, skin); px(ctx, x + 7, y + 1, 1, 5, sk);
  const st = L.style || 0;
  if (dir === "up") {
    px(ctx, x + 2, y, 6, 5, hair);
    if (L.long) px(ctx, x + 2, y + 5, 6, st === 1 ? 2 : 3, hair);
    if (L.long && st === 1) px(ctx, x + 4, y + 7, 2, 3, hair);
  } else {
    px(ctx, x + 2, y, 6, 2, hair); px(ctx, x + 2, y - 1, 6, 1, shade(hair, .85));
    if (st === 2) { px(ctx, x + 1, y, 1, 3, hair); px(ctx, x + 8, y, 1, 3, hair); px(ctx, x + 3, y - 2, 4, 1, hair); }
    if (st === 3 && L.long) px(ctx, x + 4, y - 3, 2, 2, hair);
    if (dir === "down") {
      if (st === 1) px(ctx, x + 2, y + 2, 2, 1, hair); else { px(ctx, x + 2, y + 2, 1, 1, hair); px(ctx, x + 7, y + 2, 1, 1, hair); }
      if (L.long) { px(ctx, x + 1, y + 1, 1, 7, hair); px(ctx, x + 8, y + 1, 1, 7, hair); }
      px(ctx, x + 3, y + 3, 1, 1, "#222"); px(ctx, x + 6, y + 3, 1, 1, "#222");
      if (L.glasses) { px(ctx, x + 3, y + 3, 4, 1, "#222"); }
      px(ctx, x + 4, y + 5, 2, 1, sk);
    } else {
      const back = dir === "left" ? x + 6 : x + 2;
      px(ctx, back, y + 1, 2, 3, hair);
      if (L.long) px(ctx, back, y + 4, 2, 4, hair);
      if (L.long && st === 1) px(ctx, dir === "left" ? x + 8 : x + 1, y + 3, 1, 4, hair);
      const ex = dir === "left" ? x + 3 : x + 6;
      px(ctx, ex, y + 3, 1, 1, "#222");
      if (L.glasses) px(ctx, dir === "left" ? x + 2 : x + 5, y + 3, 3, 1, "#222");
    }
  }
  if (L.chair) { px(ctx, x + 3, y - 4, 4, 1, "#ffd166"); px(ctx, x + 3, y - 5, 1, 1, "#ffd166"); px(ctx, x + 5, y - 5, 1, 1, "#ffd166"); px(ctx, x + 6, y - 5, 1, 1, "#ffd166"); px(ctx, x + 4, y - 4, 2, 1, "#ff9f1c"); }
}

// Sprites werden mit Umriss vorgerendert und gecacht
const spriteCache = new Map();
let lookSeq = 1;
function spriteFor(L, dir, frame) {
  if (!L.id) L.id = lookSeq++;
  const key = `${L.id}|${dir}|${frame}`;
  let c = spriteCache.get(key);
  if (c) return c;
  const raw = document.createElement("canvas"); raw.width = 14; raw.height = 24;
  drawPersonRaw(raw.getContext("2d"), 2, 6, L, dir, frame);
  c = document.createElement("canvas"); c.width = 14; c.height = 24;
  const cx = c.getContext("2d");
  for (const [a, b] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) cx.drawImage(raw, a, b);
  cx.globalCompositeOperation = "source-in"; cx.fillStyle = "rgba(12, 14, 40, .85)"; cx.fillRect(0, 0, 14, 24);
  cx.globalCompositeOperation = "source-over"; cx.drawImage(raw, 0, 0);
  spriteCache.set(key, c);
  return c;
}
function drawPerson(ctx, x, y, L, dir, frame, bob = 0) {
  x = Math.round(x); y = Math.round(y);
  ellipse(ctx, x, y, 4, 1, "rgba(0,0,0,.28)");
  ctx.drawImage(spriteFor(L, dir, frame), x - 7, y - 22 + bob);
}

function drawBang(ctx, x, y, t, kind, crit) {
  const b = Math.round(Math.sin(t * 6) * 1.5);
  x = Math.round(x) - 5; y = Math.round(y) - 34 + b;
  const fill = kind === "mg" ? "#ffd166" : kind === "selfie" ? "#9fe3ff" : (crit && Math.floor(t * 4) % 2 ? "#ff5d6c" : "#ffffff");
  px(ctx, x - 1, y - 1, 12, 12, "#0b1640"); px(ctx, x + 3, y + 11, 4, 2, "#0b1640");
  px(ctx, x, y, 10, 10, fill); px(ctx, x + 4, y + 10, 2, 2, fill);
  if (kind === "mg") { px(ctx, x + 2, y + 3, 6, 4, "#0b1640"); px(ctx, x + 3, y + 2, 1, 1, "#0b1640"); px(ctx, x + 6, y + 2, 1, 1, "#0b1640"); px(ctx, x + 3, y + 4, 1, 1, "#ffd166"); px(ctx, x + 6, y + 4, 1, 1, "#ffd166"); }
  else if (kind === "selfie") { px(ctx, x + 2, y + 3, 6, 5, "#0b1640"); px(ctx, x + 3, y + 2, 2, 1, "#0b1640"); circ(ctx, x + 5, y + 5, 1, "#9fe3ff"); }
  else { px(ctx, x + 4, y + 2, 2, 4, "#e63946"); px(ctx, x + 4, y + 7, 2, 2, "#e63946"); }
}

function drawPigeon(ctx, p, t) {
  const x = Math.round(p.x), y = Math.round(p.y);
  if (p.fly) {
    const f = Math.floor(t * 14 + p.seed) % 2;
    ellipse(ctx, x, Math.round(p.gy), 3, 1, "rgba(0,0,0,.15)");
    px(ctx, x - 2, y - 2, 5, 3, "#8d939b"); px(ctx, x + (p.vx > 0 ? 2 : -3), y - 3, 2, 2, "#6b7280");
    if (f) { px(ctx, x - 5, y - 5, 4, 2, "#a3a9b1"); px(ctx, x + 2, y - 5, 4, 2, "#a3a9b1"); }
    else { px(ctx, x - 5, y - 1, 4, 2, "#a3a9b1"); px(ctx, x + 2, y - 1, 4, 2, "#a3a9b1"); }
    return;
  }
  const peck = Math.sin(t * 3 + p.seed) > .7 ? 1 : 0, d = p.dir;
  ellipse(ctx, x, y, 3, 1, "rgba(0,0,0,.2)");
  px(ctx, x - 3, y - 4, 6, 3, "#8d939b"); px(ctx, x - 3, y - 4, 6, 1, "#a3a9b1"); px(ctx, x - 3 * d - (d > 0 ? 1 : 0), y - 3, 2, 1, "#5d636b");
  px(ctx, x + (d > 0 ? 2 : -4), y - 6 + peck * 2, 2, 2, "#6b7280"); px(ctx, x + (d > 0 ? 2 : -3), y - 4 + peck * 2, 1, 1, "#4fa07a");
  px(ctx, x + (d > 0 ? 4 : -5), y - 5 + peck * 2, 1, 1, "#d9a66b");
  px(ctx, x - 1, y - 1, 1, 1, "#d77f86"); px(ctx, x + 1, y - 1, 1, 1, "#d77f86");
}

function drawTram(ctx, tr) {
  const x = Math.round(tr.x), y = 51 * TS + 6, L = 7 * TS;

// Tanzfläche bei der Afterparty
function drawDance(ctx, w, h, t, d) {
  drawPlace(ctx, w, h, "party", t);
  if (!d) return;
  const laneW = Math.min(30, Math.floor(w / 8)), x0 = Math.round(w / 2 - laneW * 2), hitY = Math.round(h * .78), top = Math.round(h * .14);
  px(ctx, x0 - 4, top, laneW * 4 + 8, hitY - top + 14, "rgba(0,0,0,.45)");
  for (let k = 0; k < 4; k++) {
    px(ctx, x0 + k * laneW + 1, top, laneW - 2, hitY - top + 10, "rgba(255,255,255,.05)");
    const flash = d.flash[k] > t ? .6 : .25;
    px(ctx, x0 + k * laneW + 2, hitY - 4, laneW - 4, 8, `rgba(255,255,255,${flash})`);
  }
  const ARW = ["◀", "▲", "▼", "▶"], cols = ["#ff5d9e", "#6fb1ff", "#3ecf8e", "#ffd166"];
  for (const n of d.notes) {
    if (n.hit || n.miss) continue;
    const dtn = n.time - d.time, y = Math.round(hitY - dtn * d.speed);
    if (y < top - 10 || y > h) continue;

let noiseBuf = null;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  if (actx && actx.state === "suspended") actx.resume();
  if (actx && !noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1;
  }
}
function beep(f = 660, d = .06, type = "square", v = .035, when = 0) {
  if (muted || !actx) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + when;
  o.type = type; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.start(t); o.stop(t + d + .02);
}
function noise(d = .3, v = .05, freq = 1200, q = .8, when = 0) {
  if (muted || !actx || !noiseBuf) return;
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(), t = actx.currentTime + when;
  src.buffer = noiseBuf; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
  src.connect(f); f.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .04); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  src.start(t, Math.random() * .5); src.stop(t + d + .05);
}
const sfx = {
  msg: () => { beep(880, .08, "sine", .05); beep(1320, .1, "sine", .05, .09); },
  bang: () => { beep(520, .08); beep(780, .1, "square", .035, .08); },
  pick: () => beep(700, .05),
  good: () => { beep(660, .08); beep(990, .1, "square", .035, .08); },
  bad: () => beep(220, .18, "sawtooth", .03),
  type: () => beep(1400, .012, "square", .012),
  late: () => { beep(400, .12, "square", .03); beep(300, .16, "square", .03, .12); },
  ding: () => { beep(1568, .5, "sine", .04); beep(1175, .7, "sine", .035, .18); },
  coffee: () => { noise(.35, .05, 600, 2); beep(520, .1, "sine", .03, .3); beep(780, .12, "sine", .03, .4); },
  camera: () => { noise(.06, .12, 3000, 1); noise(.1, .08, 1500, 1, .07); },
  flap: () => { for (let k = 0; k < 4; k++) noise(.05, .04, 900, 1.5, k * .06); },
  cheer: () => { noise(1.6, .09, 1100, .5); for (let k = 0; k < 8; k++) noise(.25, .04, 1600 + Math.random() * 1200, 3, Math.random() * 1.2); },
  clap: () => { for (let k = 0; k < 18; k++) noise(.05, .06, 2200, 1.2, k * .07 + Math.random() * .03); },
  laugh: () => { for (let k = 0; k < 6; k++) noise(.12, .05, 700 + (k % 2) * 200, 4, k * .13); },
  cough: () => { noise(.15, .06, 500, 2); noise(.2, .05, 450, 2, .5); },
  silence: () => { for (let k = 0; k < 3; k++) beep(4200, .03, "sine", .02, k * .35); },
  drum: () => { for (let k = 0; k < 24; k++) noise(.04, .05, 300, 1.5, k * .05); },
  whoosh: () => noise(.4, .06, 700, .6),
  ach: () => { [784, 988, 1175, 1568].forEach((f, k) => beep(f, .14, "square", .03, k * .09)); },
  hit: () => beep(1046, .05, "triangle", .05),
  miss: () => beep(180, .08, "sawtooth", .02),

const TRACKS = {
  title: { bpm: 92, chords: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], arp: 2, bass: true, vol: .05 },
  day:   { bpm: 108, chords: [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]], arp: 4, bass: true, vol: .022 },
  night: { bpm: 84, chords: [[57, 60, 64, 67], [50, 53, 57, 60], [55, 59, 62, 65], [52, 55, 59, 62]], pad: true, bass: true, arp: 4, vol: .03 },
  party: { bpm: 124, chords: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], arp: 1, bass: true, kick: true, hat: true, vol: .05 },
};
const music = { cur: null, next: 0, step: 0, gain: null, timer: null };
const mfreq = n => 440 * Math.pow(2, (n - 69) / 12);
function setMusic(name) {
  if (SIM() || music.cur === name) return;
  music.cur = name;
  if (!actx) return;
  if (!music.gain) { music.gain = actx.createGain(); music.gain.connect(actx.destination); }
  music.gain.gain.setTargetAtTime(name && musicOn && !muted ? TRACKS[name].vol : 0, actx.currentTime, .4);
  music.step = 0; music.next = actx.currentTime + .1;
  if (!music.timer) music.timer = setInterval(musicTick, 25);
}
function musicVolume() { if (music.gain && actx) music.gain.gain.setTargetAtTime(music.cur && musicOn && !muted ? TRACKS[music.cur].vol : 0, actx.currentTime, .2); }
function note(f, t, d, type, v) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f; o.connect(g); g.connect(music.gain);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.start(t); o.stop(t + d + .05);
}
function musicTick() {
  if (!actx || !music.cur || !music.gain) return;
  const tr = TRACKS[music.cur], sixteenth = 60 / tr.bpm / 4;
  while (music.next < actx.currentTime + .15) {
    const st = music.step, t = music.next, ch = tr.chords[Math.floor(st / 16) % tr.chords.length];
    if (tr.arp && st % tr.arp === 0) note(mfreq(ch[(st / tr.arp) % ch.length] + 12), t, sixteenth * 1.8, "square", .35);
    if (tr.bass && st % 4 === 0) note(mfreq(ch[0] - 12), t, sixteenth * 3.5, "triangle", .9);
    if (tr.pad && st % 16 === 0) ch.forEach(n => note(mfreq(n), t, sixteenth * 15, "triangle", .25));
    if (tr.kick && st % 4 === 0) { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + .12); o.connect(g); g.connect(music.gain); g.gain.setValueAtTime(1.4, t); g.gain.exponentialRampToValueAtTime(.001, t + .18); o.start(t); o.stop(t + .2); }
    if (tr.hat && st % 4 === 2 && noiseBuf) { const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(); src.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = 7000; src.connect(f); f.connect(g); g.connect(music.gain); g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.001, t + .05); src.start(t); src.stop(t + .06); }
    music.step++; music.next += sixteenth;
  }
}

let statFlashTimer;
function applyFx(fx, quiet) {
  const floor = MODE().free ? 5 : 0;
  for (const [k, d] of Object.entries(fx)) s.stats[k] = clamp(s.stats[k] + d, Math.min(floor, s.stats[k]), 100);
  s.erstiMin = Math.min(s.erstiMin, s.stats.erstis);

  clearTimeout(statFlashTimer); statFlashTimer = setTimeout(() => s && renderStats(), 1200);

}

// ---------------- Aufgaben ----------------
function pickEvent() {
  const h = s.min / 60;
  const today = e => !e.day || e.day === s.day + 1;
  const worldFull = s.tasks.filter(t => t.kind !== "chat").length >= MODE().maxWorld;
  const busy = e => !e.chat && TEAM[e.who] && npcByName(e.who)?.task;
  const ok = e => !s.used.has(e.id) && today(e) && (!e.requires || s.flags.has(e.requires)) && !busy(e) && !(worldFull && !e.chat);
  const followUps = EVENTS.filter(e => ok(e) && e.requires);
  if (followUps.length && Math.random() < .5) return followUps[0];
  let pool = EVENTS.filter(e => ok(e) && !e.requires && (e.from ?? 0) <= h && h < (e.to ?? 24));
  if (!pool.length) pool = EVENTS.filter(e => ok(e) && !e.requires && (e.from ?? 0) <= h);
  return pool.length ? pick(pool) : null;
}

function spawnEvent() {
  const ev = pickEvent();
  if (!ev) return;
  s.used.add(ev.id);
  if (ev.chat) {
    const task = { kind: "chat", ev, chat: ev.chat, deadline: s.min + Math.round(CHAT_TIME * MODE().time * modFactor("chatTime")), who: ev.who };
    s.tasks.push(task);
    pushMsg(ev.chat, { from: ev.who, text: ev.text, task });
  } else {
    let npc = TEAM[ev.who] ? npcByName(ev.who) : null;
    const loc = LOCS[ev.loc];
    if (!npc) {
      npc = makeNPC({ kind: "temp", name: ev.who, role: ev.role, speed: 50,
        look: ev.who === "Hausmeister" ? { hair: "#8d8d8d", skin: pick(SKINS), shirt: "#5c6b73", pants: "#3b3b3b", style: 3 }
          : ev.who === "Speaker" ? { hair: pick(HAIRS), skin: pick(SKINS), shirt: "#3d405b", pants: "#1b1b24", lanyard: "#9b51e0", suit: true, style: rand(0, 3) }
          : { hair: pick(HAIRS), skin: pick(SKINS), shirt: "#1f4fd8", team: true, long: Math.random() < .5, style: rand(0, 3) } });
      placeAt(npc, ...randomNear(loc, 4));
      s.npcs.push(npc);
    }
    const task = { kind: "world", ev, npc, loc: ev.loc, deadline: s.min + Math.round(TASK_TIME * MODE().time), who: ev.who };
    npc.task = task;
    npc.path = findPath(tileOf(npc), [loc.x, loc.y]);
    npc.speed = Math.max(npc.speed, 55);
    s.tasks.push(task);
    sfx.bang();
    infoToast(`❗ ${ev.who} braucht dich · ${loc.label}`);
  }
  updateTaskBar();
}

function spawnMgQuest(q) {
  const npc = npcByName(q.who);
  const loc = LOCS[q.loc];
  const task = { kind: "mg", q, npc, loc: q.loc, deadline: s.min + 70, who: q.who };
  if (npc.task) { // Minigame hat Vorrang, die alte Aufgabe kommt später wieder
    s.tasks = s.tasks.filter(t => t !== npc.task);
    if (npc.task.ev) s.used.delete(npc.task.ev.id);
    if (dialogTask === npc.task) { closeDialog(); fpHide(); }
  }
  npc.task = task;
  npc.path = findPath(tileOf(npc), [loc.x, loc.y]);
  s.tasks.push(task);
  sfx.bang();
  infoToast(`🎮 ${q.who} braucht Hilfe · ${loc.label}`);
  updateTaskBar();
}

function releaseNPC(npc) {
  if (!npc) return;
  npc.task = null; npc.path = []; npc.wait = 1 + Math.random() * 2;
  if (npc.kind === "temp") npc.leaveAt = s.min + 25;
  if (npc.kind === "team") npc.speed = 46;
}

function resolveTask(task, opt, late) {
  s.tasks = s.tasks.filter(t => t !== task);
  s.decisions++;
  if (s.decisions === 1) unlock("erste");
  if (opt.sets) s.flags.add(opt.sets);
  if (opt.sets === "mama") unlock("mama");
  releaseNPC(task.npc);
  if (task.kind === "chat") {
    const m = s.chat[task.chat].msgs.find(m => m.task === task);
    if (m) m.answered = true;
    if (late) {
      pushMsg(task.chat, { from: task.who, text: task.chat === "mama" ? "Naja, du hast bestimmt viel zu tun ❤️" : pick(["Hab's jetzt selbst entschieden 🙄", "Okay, keine Antwort, ich mach einfach 🫠", "Hallo?? Naja, hab entschieden."]) });
    } else {
      pushMsg(task.chat, { me: true, text: opt.label });
      const happy = fxSum(opt.fx) >= 0;
      setTimeout(() => s && s.chat[task.chat] && pushMsg(task.chat, { from: task.who, text: task.chat === "mama" ? pick(["❤️", "Mein Schatz 🥹", "Okay! Pass auf dich auf ❤️"]) : happy ? pick(["👍", "Top, danke! 🙏", "Perfekt 💙", "Alles klar, mach ich!", "🔥🔥"]) : pick(["Okay… 😬", "Hm, okay 😅", "Wenn du meinst 🙃", "Na gut."]), silent: true }), 1400);
    }
  }
  // Wer zu spät kommt, kriegt die schlechtere Option und zusätzlich Frust im Team
  const base = scaleFx(opt.fx, "task");
  const fx = late ? { ...base, team: (base.team || 0) - MODE().late } : base;
  s.lastFx = fx;
  applyFx(fx);
  addLog(task.who, opt.label, fx, late);
  if (late) { s.missed++; s.missedDay[s.day]++; sfx.late(); setTimeout(() => s && infoToast(`⏰ Zu spät! ${task.who} hat ohne dich entschieden`), 50); }
  updateTaskBar();
  checkGameOver();
}

function expireTasks() {
  for (const task of [...s.tasks]) {
    if (s.min < task.deadline) continue;
    if (dialogTask === task) { closeDialog(); fpHide(); }
    if (task.kind === "mg") {
      s.tasks = s.tasks.filter(t => t !== task);
      releaseNPC(task.npc);
      s.missed++; s.missedDay[s.day]++; sfx.late();
      applyFx(task.q.bad, true);
      addLog(task.who, "Minigame verpasst", task.q.bad, true);
      infoToast(`⏰ ${task.who} musste es ohne dich machen`);
      updateTaskBar();
      if (checkGameOver()) return;
      continue;
    }
    const worst = fxSum(task.ev.a.fx) <= fxSum(task.ev.b.fx) ? task.ev.a : task.ev.b;
    resolveTask(task, worst, true);
    if (s.mode === "screen") return;
  }
}

function taskLabel(task) {
  if (task.kind === "chat") return { av: "💬", title: `${task.who} schreibt dir`, place: CHATS.find(c => c.id === task.chat).name };
  return { av: task.kind === "mg" ? "🎮" : "❗", title: task.who, place: LOCS[task.loc].label };
}
function updateTaskBar() {
  if (!s) return;
  const n = s.tasks.length;
  const cnt = $("taskcount");
  cnt.textContent = n; cnt.classList.toggle("zero", !n);
  if (!n) { $("tasktext").innerHTML = "Keine offenen Aufgaben<small>Lauf rum, sag Speakern Hallo 📸</small>"; $("taskbtn").classList.remove("crit"); return; }
  const t = [...s.tasks].sort((a, b) => a.deadline - b.deadline)[0];
  const L = taskLabel(t), left = Math.max(0, Math.ceil(t.deadline - s.min));
  $("tasktext").innerHTML = `${L.av} ${L.title} · ${L.place}<small>noch ${left} min${n > 1 ? ` · +${n - 1} weitere` : ""}</small>`;
  $("taskbtn").classList.toggle("crit", left < 30);
}

function renderSheet() {
  const sh = $("sheet");
  const tasks = [...s.tasks].sort((a, b) => a.deadline - b.deadline);

function ambientTick() {
  const h = s.min / 60;
  const pool = AMBIENT.filter((m, i) => !s.ambientUsed.has(i) && (!m.day || m.day === s.day + 1) && (m.from_ ?? 0) <= h && h < (m.to ?? 24) && (!m.requires || s.flags.has(m.requires)));
  // Reaktionen auf Entscheidungen kommen bevorzugt
  const reactions = pool.filter(m => m.requires);
  if (reactions.length && Math.random() < .6) { const m = reactions[0]; s.ambientUsed.add(AMBIENT.indexOf(m)); return pushMsg(m.chat, { from: m.from, text: m.text }); }
  if (!pool.length) return;
  const m = pick(pool);
  s.ambientUsed.add(AMBIENT.indexOf(m));
  pushMsg(m.chat, { from: m.from, text: m.text });
}

let sceneQueue = [];
function runScene(scene) {
  s.scenesDone.add(scene.id);
  s.mode = "scene";
  closePhone(); $("sheet").hidden = true; closeDialog(true);
  keys.clear(); s.player.path = []; s.pendingTalk = null; s.fpPlace = null;
  sceneQueue = [...scene.steps];

}
function sceneDone() {
  fpHide(); closeDialog(true);
  s.mode = "play"; s.camTarget = null; s.camPan = null;
  for (const n of s.npcs) if (n.task) n.path = findPath(tileOf(n), [LOCS[n.task.loc].x, LOCS[n.task.loc].y]);
}
function waitFor(cond) { s.sceneWait = cond; }
function nextSceneStep() {
  if (!s || s.mode !== "scene") return;
  const st = sceneQueue.shift();
  if (!st) return sceneDone();
  if (st.place) {
    const ent = st.place === "player" ? s.player : npcByName(st.place);
    if (ent) { placeAt(ent, st.x, st.y); ent.dir = st.dir || "down"; ent.wait = 6; ent.hidden = !!st.hidden; }
    return nextSceneStep();
  }
  if (st.cam) {
    const L = LOCS[st.cam]; s.camTarget = { x: L.x * TS + 8, y: L.y * TS };
    if (st.snap) { cam.x = s.camTarget.x - canvas.width / 2; cam.y = s.camTarget.y - canvas.height / 2; }
    return SIM() ? nextSceneStep() : setTimeout(nextSceneStep, st.snap ? 50 : 500);
  }
  if (st.hud !== undefined) { showHud(st.hud); return nextSceneStep(); }
  if (st.fp) { s.fpPlace = st.fp; return nextSceneStep(); }
  if (st.tram) {
    if (SIM()) { s.player.hidden = false; return nextSceneStep(); }
    s.tram = { x: -8 * TS, vx: 120, stopAt: 23 * TS, state: "in", t: 0 };
    sfx.ding();
    return waitFor(() => !s.tram || (s.tram.state === "out" && s.tram.t > .4));
  }
  if (st.pan) {
    if (SIM()) return nextSceneStep();
    s.camPan = { pts: [[s.camTarget.x, s.camTarget.y], ...st.pan.map(([x, y]) => [x * TS + 8, y * TS])], t0: performance.now(), ms: st.ms };
    return waitFor(() => !s.camPan);
  }
  if (st.titlecard) {
    if (SIM()) return nextSceneStep();
    setMusic("title");
    showOverlay(`<div class="ov center" style="pointer-events:none"><div class="logo" style="animation:popIn2 .6s ease"><div class="sub">DONNERSTAG · 9. APRIL 2026</div><div class="q">Q-SUMMIT</div><div class="sub">FEEL THE Q SPIRIT</div></div></div>`, "clear");
    return setTimeout(() => { hideOverlay(); setMusic("day"); nextSceneStep(); }, 2600);
  }
  if (st.walk) {
    const [who, x, y] = st.walk, ent = who === "player" ? s.player : npcByName(who);
    if (SIM() || !ent) { if (ent) placeAt(ent, x, y); return nextSceneStep(); }
    ent.path = findPath(tileOf(ent), [x, y]);
    return waitFor(() => !ent.path.length);
  }
  if (st.coach) { return SIM() ? nextSceneStep() : setTimeout(() => runCoach(() => nextSceneStep()), 400); }
  if (st.seat) {
    const seats = shuffle(ZONES.so108);
    s.npcs.filter(n => n.kind === "crowd").forEach((n, k) => { placeAt(n, ...seats[k % seats.length]); n.dir = "up"; n.wait = 8 + Math.random() * 6; });
    return nextSceneStep();
  }
  if (st.party) {
    s.party = true;
    s.npcs.filter(n => n.kind !== "static").forEach(n => { n.task = null; placeAt(n, ...pick(ZONES.abend)); n.wait = 99; });
    s.tasks = []; updateTaskBar();
    setMusic("party");
    return nextSceneStep();
  }
  if (st.lights) { s.stageLights = 4; return nextSceneStep(); }
  if (st.confetti) { spawnConfetti(); sfx.good(); if (st.fx) applyFx(st.fx, true); return nextSceneStep(); }
  if (st.wait) return SIM() ? nextSceneStep() : setTimeout(nextSceneStep, st.wait);
  if (st.speech) return runSpeech(st.speech, nextSceneStep);
  if (st.reveal) return runReveal(nextSceneStep);
  if (st.dance) return runDance(nextSceneStep);
  if (st.snapshot) { if (!SIM()) { try { s.snap = canvas.toDataURL("image/png"); } catch {} } return nextSceneStep(); }
  if (st.say) {
    const [who, text] = st.say;
    const npc = who === "Du" ? null : npcByName(who);
    const place = s.fpPlace || (s.camTarget ? PLACE_OF[nearestLocKey(s.camTarget.x, s.camTarget.y)] : "ehrenhof");
    return openDialog({ name: who, role: who === "Du" ? "Chair" : TEAM[who]?.role, look: npc?.look, text, onNext: nextSceneStep, place: s.party ? "party" : place, mood: "happy" });
  }
  if (st.end) { fpHide(); return renderEnd(); }
  nextSceneStep();
}

function countdown(ms, el, onEnd) {

}

function playMic(title, text, baseSpeed) { mgIntro(title, text, () => runMic(baseSpeed), "🎙️"); }
function runMic(baseSpeed) {
  const ROUNDS = 3;
  let round = 0, hits = 0, pos = 0, dir = 1, speed = baseSpeed, zone, timer, last, locked = false;
  const results = [];
  showOverlay(`<div class="ov center"><div class="mg" style="flex:0"><div class="mg-title">MIC-CHECK</div>
    <div class="mg-hud"><span id="r">Mikro 1/3</span><span id="h">0 Treffer</span></div>

    <div class="meter"><div class="zone" id="zone"></div><div class="marker" id="marker"></div></div>
    <button class="btn" id="stop">Stopp!</button></div></div>`);
  const zEl = $("zone"), mEl = $("marker");
  function newZone() { const w = 16 - round * 2; zone = { start: rand(10, 90 - w), w }; zEl.style.left = zone.start + "%"; zEl.style.width = zone.w + "%"; }
  function loop() {
    const t = performance.now(), dt = last ? (t - last) / 1000 : 0; last = t;
    pos += dir * speed * dt;
    if (pos >= 100) { pos = 100; dir = -1; }
    if (pos <= 0) { pos = 0; dir = 1; }
    mEl.style.left = pos + "%";
  }
  function stop() {
    if (locked) return;
    locked = true; clearInterval(timer);
    const hit = pos >= zone.start && pos <= zone.start + zone.w;
    if (hit) { hits++; sfx.good(); } else sfx.bad();
    results.push(hit ? "✅" : "❌");
    $("rounds").textContent = results.concat(Array(ROUNDS - results.length).fill("🎤")).join(" ");
    $("h").textContent = `${hits} Treffer`;
    round++;
    setTimeout(() => {
      if (round >= ROUNDS) return finish();
      $("r").textContent = `Mikro ${round + 1}/3`;
      speed *= 1.45; last = null; locked = false;
      newZone(); timer = setInterval(loop, 16);
    }, 600);
  }
  function finish() {
    mgKeys = null;
    if (hits === 3) mgResult("🎙️", "Perfekter Sound!", "Alle Mikros laufen, SO108 bebt.", { speaker: 15 });
    else if (hits === 2) mgResult("🔊", "Läuft größtenteils", "Ein Mikro rauscht ein bisschen, aber passt schon.", { speaker: 5 });
    else if (hits === 1) mgResult("📢", "Fiepen im Saal", "Rückkopplung. Ganz SO108 hält sich die Ohren zu.", { speaker: -5, participants: -5 });
    else mgResult("🔇", "Totalausfall", "Auf der Mainstage wird ein einziges Handmikro herumgereicht.", { speaker: -15, participants: -5 });
  }
  $("stop").onclick = stop;
  mgKeys = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); stop(); } };
  newZone(); timer = setInterval(loop, 16);
}

function playInfopoint() {
  mgIntro("Infopoint", "Participants fragen dich nach dem Weg. Tippe schnell den richtigen Ort an. Jede Frage hat nur ein paar Sekunden, und Serien geben Extrapunkte.", runInfopoint, "🧭");
}
function runInfopoint() {
  mgKeys = null;
  const PER_Q = 4000;
  let score = 0, streak = 0, best = 0, ended = false, qTimer, qStart, locked = false, lastQ = -1;
  showOverlay(`<div class="ov"><div class="mg"><div class="mg-title">INFOPOINT</div>
    <div class="mg-hud"><span id="t">25.0 s</span><span id="sc">0 Punkte</span></div>
    <div class="ask frame"><div class="face" id="face"></div><div class="q" id="q"></div><div class="qbar"><div id="qbar"></div></div></div>
    <div class="streak" id="streak"></div><div class="places" id="places"></div></div></div>`);
  countdown(25000, $("t"), finish);
  function nextQ() {
    if (ended) return;
    locked = false;
    let i; do { i = Math.floor(Math.random() * INFO_QUESTIONS.length); } while (i === lastQ);
    lastQ = i;
    const [q, answer] = INFO_QUESTIONS[i];
    const wrong = shuffle(Object.keys(INFO_PLACES).filter(p => p !== answer)).slice(0, 2);
    $("face").textContent = pick(["🧑", "👩", "👨", "🧑‍💼", "👩‍💼", "👨‍💼", "🧑‍🎓", "👩‍🎓"]);
    $("q").textContent = `„${q}“`;
    $("places").innerHTML = shuffle([answer, ...wrong]).map(p => `<button class="place" data-p="${p}" data-ok="${p === answer}"><span class="pi">${INFO_PLACES[p]}</span>${p}</button>`).join("");
    $("places").querySelectorAll(".place").forEach(b => b.onclick = () => answerQ(b));
    qStart = performance.now();
    clearInterval(qTimer);
    qTimer = setInterval(() => {
      const left = Math.max(0, 1 - (performance.now() - qStart) / PER_Q);
      const bar = $("qbar"); if (bar) bar.style.width = left * 100 + "%";
      if (left <= 0 && !locked) { locked = true; streak = 0; sfx.bad(); $("streak").textContent = "⏰ Zu langsam!"; setTimeout(nextQ, 350); }
    }, 50);
  }
  function answerQ(b) {
    if (ended || locked) return;
    locked = true;
    if (b.dataset.ok === "true") {
      streak++; best = Math.max(best, streak);
      score += streak >= 3 ? 2 : 1;
      b.classList.add("right"); sfx.good();
      $("streak").textContent = streak >= 3 ? `🔥 ${streak}er-Serie · doppelte Punkte` : "";
    } else {
      streak = 0; b.classList.add("wrongp"); sfx.bad();
      $("places").querySelector('[data-ok="true"]').classList.add("right");
      $("streak").textContent = "";
    }
    $("sc").textContent = `${score} Punkte`;
    setTimeout(nextQ, 350);
  }
  function finish() {
    ended = true; clearInterval(qTimer);
    if (score >= 12) mgResult("🧭", `${score} Punkte am Infopoint!`, `Beste Serie: ${best}. Niemand irrt mehr durchs Schloss.`, { participants: 15, erstis: 5 });
    else if (score >= 7) mgResult("🗺️", `${score} Punkte`, `Beste Serie: ${best}. Die meisten haben ihren Weg gefunden.`, { participants: 5 });
    else mgResult("😵‍💫", `Nur ${score} Punkte`, "Ein Speaker sucht SO108 immer noch in der Mensa.", { participants: -10, speaker: -5 });
  }
  nextQ();
}

// ---------------- Rede auf der Mainstage (First Person) ----------------
function speechFx(def, hype) {
  const base = hype >= .9 ? 10 : hype >= .65 ? 5 : hype >= .4 ? 0 : -7, fx = {};
  for (const [k, w] of Object.entries(def.stat)) { const v = Math.round(base * w); if (v) fx[k] = v; }
  return fx;
}
function runSpeech(id, done) {
  const def = SPEECHES[id];
  if (SIM()) { applyFx(speechFx(def, .7), true); addLog("Du", `🎤 ${def.title}`, speechFx(def, .7)); return done(); }
  setMusic(null);
  const d = { hype: .3, react: null, reactT: -9, card: true };
  fpShow({ view: "speech", data: d, label: false });

  const setHype = v => { d.hype = clamp(v, 0, 1); const f = $("hypefill"); if (f) f.style.width = d.hype * 100 + "%"; };
  const react = r => { d.react = r; d.reactT = fp.t; (sfx[r] || sfx.clap)(); };

  }
  function choose(line) {
    if (locked) return;

    const fast = performance.now() - tStart < 2500;
    const v = line ? line.v : 0;
    setHype(d.hype + [-.12, .1, .22][v] + (line && fast ? .05 : 0));

    $("fpui").innerHTML = `${hud()}<div class="subtitle"><small>DU</small>${line ? line.t : "…"}</div>`;

    let taps = 0, ended = false;

      <div class="mash"><button class="btn gold" id="mash" style="font-size:20px;padding:22px">💙 Tippen, tippen, tippen!</button></div>`;
    const tap = () => { if (ended) return; taps++; setHype(d.hype + .03); if (taps % 3 === 0) beep(600 + taps * 20, .05, "square", .02); d.react = "cheer"; d.reactT = fp.t; };
    $("mash").onclick = tap;

    setTimeout(() => {

      const fx = speechFx(def, d.hype);
      if (d.hype >= .95) unlock("rede");
      s.hype[id] = d.hype;
      applyFx(fx, true); addLog("Du", `🎤 ${def.title} · Hype ${Math.round(d.hype * 100)} %`, fx);
      const verdict = d.hype >= .9 ? ["🤩", "Standing Ovations!"] : d.hype >= .65 ? ["👏", "Starke Rede"] : d.hype >= .4 ? ["🙂", "Solide"] : ["😬", "Eher holprig"];
