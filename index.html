<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#071650">
<title>Q-Summit: Feel the Q Spirit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #071650;
    --card: #0f2470;
    --card-2: #1a3389;
    --card-3: #22409e;
    --text: #ffffff;
    --muted: #a9b8e8;
    --fill: #6fb1ff;
    --good: #3ecf8e;
    --bad: #ff5d6c;
    --warn: #ffd166;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: #040c30; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; }
  .pix { font-family: "Press Start 2P", monospace; }
  .muted { color: var(--muted); }
  p { margin: 0; line-height: 1.5; }
  h1, h2 { margin: 0; }

  #game { position: fixed; inset: 0; margin: 0 auto; max-width: 960px; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }

  /* ---------- HUD ---------- */
  #hud { padding: max(8px, env(safe-area-inset-top)) 10px 8px; display: grid; gap: 7px; border-bottom: 3px solid #020a2c; z-index: 5; background: var(--bg); }
  .hud-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #clock { font-size: 11px; letter-spacing: 1px; white-space: nowrap; }
  .iconbtn { appearance: none; border: 0; background: var(--card); border-radius: 8px; font-size: 15px; width: 34px; height: 28px; cursor: pointer; }
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .stat { display: flex; align-items: center; gap: 4px; background: var(--card); border-radius: 6px; padding: 4px; transition: box-shadow .3s; }
  .stat .ic { font-size: 13px; line-height: 1; }
  .stat .bar { flex: 1; height: 7px; background: #00000066; border-radius: 3px; overflow: hidden; }
  .stat .fill { height: 100%; background: var(--fill); transition: width .45s; }
  .stat.low .fill { background: var(--bad); }
  .stat.low { animation: pulse 1s infinite; }
  .stat.up { box-shadow: 0 0 0 2px var(--good); }
  .stat.down { box-shadow: 0 0 0 2px var(--bad); }
  @keyframes pulse { 50% { background: #5a1830; } }

  /* ---------- Welt ---------- */
  #view { position: relative; flex: 1; min-height: 0; }
  #world { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; cursor: pointer; }

  #bottombar { display: flex; gap: 8px; padding: 8px 10px max(8px, env(safe-area-inset-bottom)); border-top: 3px solid #020a2c; z-index: 5; background: var(--bg); }
  #taskbtn { appearance: none; border: 0; flex: 1; min-width: 0; background: var(--card); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer; }
  #taskbtn .tb-count { font-family: "Press Start 2P", monospace; font-size: 10px; background: var(--warn); color: #3a2600; border-radius: 6px; padding: 5px 6px; flex-shrink: 0; }
  #taskbtn .tb-count.zero { background: var(--card-3); color: var(--muted); }
  #taskbtn .tb-text { font-size: 14px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #taskbtn .tb-text small { display: block; color: var(--muted); font-size: 12px; }
  #phonebtn { appearance: none; border: 0; position: relative; width: 58px; background: #e9edef; border-radius: 12px; font-size: 26px; cursor: pointer; flex-shrink: 0; }
  #phonebtn.ring { animation: ring .5s 2; }
  @keyframes ring { 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
  #phonebadge { position: absolute; top: -6px; right: -6px; background: #25d366; color: #04210f; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 2px 7px; border: 2px solid var(--bg); }
  #phonebadge:empty { display: none; }

  #talkbtn { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); appearance: none; border: 3px solid #fff; background: #0b1a5c; box-shadow: 0 0 0 3px #0b1a5c, 0 6px 0 #0007; border-radius: 6px; padding: 12px 16px; font-family: "Press Start 2P", monospace; font-size: 10px; cursor: pointer; z-index: 4; animation: bob 1s infinite; white-space: nowrap; }
  @keyframes bob { 50% { transform: translate(-50%, -3px); } }

  .toasts { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: none; z-index: 7; flex-wrap: wrap; justify-content: center; width: 92%; }
  .toast { padding: 6px 10px; border-radius: 999px; font-weight: 800; font-size: 14px; animation: toast 1.6s ease forwards; box-shadow: 0 3px 0 #0005; }
  .toast.up { background: var(--good); color: #062b1b; }
  .toast.down { background: var(--bad); color: #2b0609; }
  .toast.info { background: var(--warn); color: #3a2600; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(8px); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-12px); } }

  /* ---------- Dialog ---------- */
  #dialog { position: absolute; left: 8px; right: 8px; bottom: 10px; background: #0b1a5c; border: 3px solid #fff; box-shadow: 0 0 0 3px #0b1a5c, 0 8px 0 #0007; border-radius: 6px; padding: 12px; display: grid; gap: 10px; z-index: 6; max-width: 620px; margin: 0 auto; animation: dlgIn .18s ease; }
  @keyframes dlgIn { from { transform: translateY(20px); opacity: 0; } }
  .dlg-head { display: flex; gap: 10px; align-items: center; }
  .dlg-portrait { width: 44px; height: 60px; background: var(--card-2); border-radius: 6px; flex-shrink: 0; display: grid; place-items: center; font-size: 28px; overflow: hidden; }
  .dlg-portrait canvas { width: 40px; height: 60px; image-rendering: pixelated; }
  .dlg-name { font-family: "Press Start 2P", monospace; font-size: 10px; line-height: 1.4; }
  .dlg-role { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .dlg-timer { margin-left: auto; font-family: "Press Start 2P", monospace; font-size: 9px; color: var(--warn); white-space: nowrap; }
  .dlg-text { font-family: "VT323", monospace; font-size: 23px; line-height: 1.15; min-height: 52px; cursor: pointer; }
  .dlg-opts { display: grid; gap: 8px; }
  .dlg-opt { appearance: none; border: 2px solid #ffffff55; background: var(--card-2); border-radius: 8px; padding: 11px 12px; display: flex; justify-content: space-between; gap: 10px; align-items: center; text-align: left; cursor: pointer; font-weight: 600; font-size: 15px; line-height: 1.3; transition: transform .08s, border-color .15s; }
  .dlg-opt:hover { border-color: #fff; }
  .dlg-opt:active { transform: scale(.98); }
  .dlg-opt .k { font-family: "Press Start 2P", monospace; font-size: 9px; color: var(--warn); margin-right: 8px; }
  .dlg-opt .hint { font-size: 12px; opacity: .8; white-space: nowrap; letter-spacing: 1px; }
  .dlg-later { appearance: none; background: none; border: 0; color: var(--muted); font-size: 13px; justify-self: end; cursor: pointer; padding: 2px 4px; }

  /* ---------- Handy ---------- */
  #phone { position: absolute; inset: 0; z-index: 8; background: #0b141a; display: flex; flex-direction: column; color: #e9edef; animation: slideup .22s ease; }
  @keyframes slideup { from { transform: translateY(40px); opacity: 0; } }
  .ph-status { display: flex; justify-content: space-between; padding: max(8px, env(safe-area-inset-top)) 16px 6px; font-size: 13px; font-weight: 700; background: #111b21; }
  .ph-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #202c33; min-height: 58px; }
  .ph-head .ph-title { font-weight: 700; font-size: 18px; flex: 1; min-width: 0; }
  .ph-head .ph-sub { font-size: 12px; color: #8696a0; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ph-back, .ph-close { appearance: none; border: 0; background: none; color: #e9edef; font-size: 24px; cursor: pointer; padding: 0 6px; }
  .ph-list { flex: 1; overflow-y: auto; }
  .ph-row { display: flex; gap: 12px; padding: 11px 14px; align-items: center; border-bottom: 1px solid #1f2a30; cursor: pointer; }
  .ph-row:active { background: #202c33; }
  .ph-av { width: 46px; height: 46px; border-radius: 50%; background: #2a3942; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
  .ph-main { flex: 1; min-width: 0; }
  .ph-name { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; font-size: 16px; }
  .ph-time { font-size: 12px; color: #8696a0; font-weight: 400; flex-shrink: 0; }
  .ph-time.new { color: #25d366; }
  .ph-prev { font-size: 14px; color: #8696a0; display: flex; justify-content: space-between; gap: 8px; margin-top: 3px; }
  .ph-prev span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ph-unread { background: #25d366; color: #0b141a; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 1px 7px; flex-shrink: 0; }
  .ph-msgs { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px;
    background-color: #0b141a; background-image: radial-gradient(#ffffff08 1px, transparent 1px); background-size: 18px 18px; }
  .ph-day { align-self: center; background: #182229; color: #8696a0; font-size: 12px; padding: 4px 10px; border-radius: 8px; margin: 6px 0; }
  .bub { max-width: 82%; padding: 6px 9px 4px; border-radius: 9px; font-size: 15px; line-height: 1.35; animation: bubIn .2s ease; }
  @keyframes bubIn { from { transform: scale(.92); opacity: 0; } }
  .bub.in { background: #202c33; align-self: flex-start; border-top-left-radius: 2px; }
  .bub.out { background: #005c4b; align-self: flex-end; border-top-right-radius: 2px; }
  .bub .from { font-size: 13px; font-weight: 700; margin-bottom: 1px; }
  .bub .t { font-size: 11px; color: #ffffff80; text-align: right; margin-top: 1px; }
  .bub.urgent { box-shadow: 0 0 0 2px var(--warn); }
  .bub.big { font-size: 40px; background: none; padding: 0; }
  .ph-replies { padding: 8px 8px max(8px, env(safe-area-inset-bottom)); display: grid; gap: 6px; background: #202c33; }
  .ph-replies .lbl { font-size: 12px; color: #8696a0; padding: 0 4px; display: flex; justify-content: space-between; }
  .ph-reply { appearance: none; border: 0; background: #2a3942; border-radius: 18px; padding: 10px 14px; text-align: left; display: flex; justify-content: space-between; gap: 10px; cursor: pointer; font-size: 15px; }
  .ph-reply:active { background: #005c4b; }
  .ph-reply .hint { opacity: .75; font-size: 12px; letter-spacing: 1px; white-space: nowrap; }
  .ph-input { display: flex; gap: 8px; padding: 8px 10px max(8px, env(safe-area-inset-bottom)); background: #202c33; align-items: center; }
  .ph-input div { flex: 1; background: #2a3942; border-radius: 20px; padding: 10px 14px; color: #8696a0; font-size: 15px; }

  #notif { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 9; background: #1f2c34f2; border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; transform: translateY(-140%); transition: transform .3s ease; cursor: pointer; color: #e9edef; box-shadow: 0 6px 20px #0008; max-width: 560px; margin: 0 auto; }
  #notif.show { transform: none; }
  #notif .n-av { width: 36px; height: 36px; border-radius: 50%; background: #2a3942; display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
  #notif .n-title { font-size: 13px; font-weight: 700; }
  #notif .n-text { font-size: 14px; color: #c7d0d6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #notif .n-body { min-width: 0; flex: 1; }

  /* ---------- Aufgabenliste ---------- */
  #sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; background: #0b1a5c; border-top: 3px solid #fff; border-radius: 14px 14px 0 0; padding: 14px; max-height: 70%; overflow-y: auto; display: grid; gap: 10px; animation: slideup .2s ease; }
  .sh-head { display: flex; justify-content: space-between; align-items: center; }
  .sh-row { background: var(--card); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
  .sh-row .sh-av { font-size: 22px; }
  .sh-row .sh-main { flex: 1; min-width: 0; }
  .sh-row .sh-main b { display: block; font-size: 14px; }
  .sh-row .sh-main small { color: var(--muted); font-size: 12px; }
  .sh-row .sh-time { font-family: "Press Start 2P", monospace; font-size: 9px; color: var(--warn); }
  .sh-row .sh-time.crit { color: var(--bad); }
  .sh-go { appearance: none; border: 0; background: #fff; color: var(--bg); font-weight: 800; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 13px; }

  /* ---------- Overlays ---------- */
  #overlay { position: absolute; inset: 0; z-index: 10; background: rgba(7, 22, 80, .94); overflow-y: auto; display: flex; justify-content: center; }
  #overlay.title { background: linear-gradient(180deg, rgba(7,22,80,.1) 0%, rgba(7,22,80,.5) 30%, rgba(7,22,80,.97) 58%); }
  .ov { width: 100%; max-width: 480px; padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
  .ov > * { flex-shrink: 0; }
  .ov.center { justify-content: center; }
  .ov.bottom { justify-content: flex-end; }
  .btn { appearance: none; border: 0; border-radius: 12px; cursor: pointer; background: #fff; color: var(--bg); font-weight: 800; font-size: 17px; padding: 16px 18px; width: 100%; box-shadow: 0 5px 0 #8ea3e6; transition: transform .08s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #8ea3e6; }
  .btn.secondary { background: var(--card-2); color: #fff; box-shadow: 0 5px 0 #050f3a; }
  .title-logo { font-family: "Press Start 2P", monospace; font-size: 32px; line-height: 1.2; text-shadow: 4px 4px 0 #1f4fd8, 8px 8px 0 #020a2c; }
  .tagline { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .panel { background: var(--card); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 14px; }
  .grid2 div { display: flex; gap: 8px; align-items: center; }
  .controls { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .summary { background: var(--card); border-radius: 14px; padding: 14px; display: grid; gap: 9px; }
  .summary .row { display: grid; grid-template-columns: 24px 1fr 34px; align-items: center; gap: 10px; }
  .summary .track { height: 8px; background: var(--card-2); border-radius: 4px; overflow: hidden; }
  .summary .track div { height: 100%; background: var(--fill); }
  .summary .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
  .fxlist { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .fx { padding: 6px 10px; border-radius: 999px; font-weight: 800; font-size: 14px; }
  .fx.up { background: rgba(62, 207, 142, .2); color: var(--good); }
  .fx.down { background: rgba(255, 93, 108, .2); color: var(--bad); }

  /* ---------- Minigames ---------- */
  .mg { display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .mg-title { font-family: "Press Start 2P", monospace; font-size: 12px; text-align: center; color: var(--warn); }
  .mg-hud { display: flex; justify-content: space-between; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 18px; }
  .result { background: var(--card); border-radius: 18px; padding: 20px; display: grid; gap: 12px; text-align: center; }
  .result .big { font-size: 48px; }
  .result h2 { font-size: 20px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cell { appearance: none; border: 0; border-radius: 14px; background: var(--card); cursor: pointer; transition: background .15s, transform .08s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; aspect-ratio: 1; padding: 6px; }
  .cell .e { font-size: 32px; }
  .cell .l { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.2; }
  .cell:active { transform: scale(.95); }
  .cell.hit { background: var(--good); }
  .cell.miss { background: var(--bad); }
  .cell.done { opacity: .25; pointer-events: none; }
  .checklist { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .checklist span { background: var(--card); padding: 6px 10px; border-radius: 999px; font-size: 14px; }
  .checklist span.ok { background: var(--good); color: #062b1b; }
  .meter { position: relative; height: 56px; background: var(--card); border-radius: 14px; overflow: hidden; }
  .zone { position: absolute; top: 0; bottom: 0; background: rgba(62, 207, 142, .35); border-left: 2px solid var(--good); border-right: 2px solid var(--good); }
  .marker { position: absolute; top: 4px; bottom: 4px; width: 6px; margin-left: -3px; background: #fff; border-radius: 3px; }
  .rounds { display: flex; gap: 8px; justify-content: center; font-size: 28px; }
  .guest { background: var(--card); border-radius: 18px; padding: 16px; text-align: center; display: grid; gap: 6px; }
  .guest .face { font-size: 42px; }
  .guest .gname { font-size: 22px; font-weight: 800; }
  .guest .grole { font-size: 15px; color: var(--muted); }
  .badges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .badge { appearance: none; border: 0; cursor: pointer; color: #0b1640; background: #fff; border-radius: 12px; overflow: hidden; padding: 0; text-align: center; transition: transform .08s; }
  .badge:active { transform: scale(.96); }
  .badge .stripe { color: #fff; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 6px 4px; }
  .badge .bq { font-size: 11px; color: #5a6aa0; padding-top: 8px; font-weight: 700; }
  .badge .bname { font-weight: 800; font-size: 16px; padding: 2px 6px 12px; }
  .badge.wrong { animation: shake .3s; outline: 3px solid var(--bad); }

  /* ---------- Infopoint ---------- */
  .ask { background: var(--card); border-radius: 18px; padding: 16px; display: grid; gap: 8px; text-align: center; position: relative; }
  .ask .face { font-size: 40px; }
  .ask .q { font-family: "VT323", monospace; font-size: 26px; line-height: 1.1; }
  .qbar { height: 8px; background: #00000055; border-radius: 4px; overflow: hidden; }
  .qbar div { height: 100%; background: var(--warn); }
  .places { display: grid; gap: 10px; }
  .place { appearance: none; border: 3px solid transparent; background: var(--card-2); border-radius: 14px; padding: 14px; font-size: 17px; font-weight: 800; display: flex; gap: 12px; align-items: center; cursor: pointer; transition: transform .08s; }
  .place:active { transform: scale(.97); }
  .place .pi { font-size: 26px; }
  .place.right { border-color: var(--good); background: #1c5a4a; }
  .place.wrongp { border-color: var(--bad); animation: shake .3s; }
  .streak { font-family: "Press Start 2P", monospace; font-size: 10px; color: var(--warn); text-align: center; min-height: 14px; }

  /* ---------- Pause & Dashboard ---------- */
  #pausebtn { position: relative; }
  #pausedot { position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); border: 2px solid var(--bg); }
  #pausedot:empty { display: block; }
  #overlay.pause { background: #071650; }
  .ps-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .ps-title { font-family: "Press Start 2P", monospace; font-size: 13px; line-height: 1.5; }
  .ps-time { font-size: 13px; color: var(--muted); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { appearance: none; border: 0; background: var(--card); border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; position: relative; }
  .tab.on { background: #fff; color: var(--bg); }
  .tab .warn { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); margin-left: 5px; vertical-align: middle; }
  .ps-body { display: grid; gap: 10px; }
  .score-card { background: var(--card); border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 14px; }
  .score-card .big { font-family: "Press Start 2P", monospace; font-size: 26px; }
  .score-card small { color: var(--muted); display: block; font-size: 12px; margin-top: 4px; }
  .stat-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-card { background: var(--card); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; }
  .stat-card .sc-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
  .stat-card .sc-val { font-family: "Press Start 2P", monospace; font-size: 16px; color: #fff; }
  .stat-card .sc-val.low { color: var(--bad); }
  .stat-card .tr { font-size: 12px; font-weight: 800; }
  .stat-card .tr.up { color: var(--good); } .stat-card .tr.down { color: var(--bad); } .stat-card .tr.flat { color: var(--muted); }
  .stat-card svg { width: 100%; height: 28px; display: block; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fact { background: var(--card); border-radius: 12px; padding: 10px; text-align: center; }
  .fact b { display: block; font-family: "Press Start 2P", monospace; font-size: 13px; margin-bottom: 6px; }
  .fact span { font-size: 11px; color: var(--muted); }

const WALK = new Set([",", ".", "B", "S", "_", "D", "h", "o", "w", "s"]);

function nearestWalkable(i, j) {
  if (isWalk(i, j)) return [i, j];
  for (let r = 1; r < 6; r++)
    for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++)
      if (Math.max(Math.abs(di), Math.abs(dj)) === r && isWalk(i + di, j + dj)) return [i + di, j + dj];
  return [22, 33];
}
for (const L of Object.values(LOCS)) [L.x, L.y] = nearestWalkable(L.x, L.y);

function findPath(from, to) {
  from = nearestWalkable(from[0], from[1]);
  to = nearestWalkable(to[0], to[1]);
  const key = (i, j) => j * W + i;
  const prev = new Int32Array(W * H).fill(-1);
  const start = key(from[0], from[1]), goal = key(to[0], to[1]);
  if (start === goal) return [];
  const q = [start]; prev[start] = start;
  for (let qi = 0; qi < q.length; qi++) {
    const cur = q[qi];
    if (cur === goal) break;
    const ci = cur % W, cj = (cur / W) | 0;
    for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const ni = ci + di, nj = cj + dj;
      if (!isWalk(ni, nj)) continue;
      const k = key(ni, nj);
      if (prev[k] !== -1) continue;
      prev[k] = cur; q.push(k);
    }
  }
  if (prev[goal] === -1) return [];
  const path = [];
  for (let k = goal; k !== start; k = prev[k]) path.push([k % W, (k / W) | 0]);
  return path.reverse();
}

function drawGround(ctx, c, X, Y, i, j) {
  if (c === ",") {

  } else if (c === "." || c === "D") {

      px(ctx, X, Y + r * 4 + 3, 16, 1, "#b3824f");

    if (hash(i, j) > .6) px(ctx, X + 4, Y + 6, 1, 1, "#7b5bd0");
  } else if (c === "B") {
    px(ctx, X, Y, 16, 16, "#1e4fd6");
    if (grid[j][i - 1] !== "B") px(ctx, X, Y, 2, 16, "#173fae");
    if (grid[j][i + 1] !== "B") px(ctx, X + 14, Y, 2, 16, "#173fae");

  } else if (c === "o") {
    px(ctx, X, Y, 16, 16, "#3fa34d"); px(ctx, X, Y + 15, 16, 1, "#2f8a3c");

}

function drawObject(ctx, c, X, Y, i, j) {

function drawPerson(ctx, x, y, L, dir, frame, bob = 0) {
  x = Math.round(x) - 5; y = Math.round(y) - 16 + bob;
  const skin = L.skin, hair = L.hair, shirt = L.shirt, pants = L.pants || "#2d3142";
  const side = dir === "left" || dir === "right";
  px(ctx, x + 1, y + 15 - bob, 8, 2, "rgba(0,0,0,.25)");
  const s1 = frame ? 1 : 0;
  if (side) { px(ctx, x + 3, y + 11, 2, 4 - s1, pants); px(ctx, x + 5, y + 11, 2, 3 + s1, pants); }
  else { px(ctx, x + 2, y + 11, 2, 4 - s1, pants); px(ctx, x + 6, y + 11, 2, 3 + s1, pants); }
  if (side) px(ctx, x + 2, y + 6, 6, 6, shirt); else px(ctx, x + 1, y + 6, 8, 6, shirt);
  if (side) px(ctx, x + (dir === "left" ? 4 : 5), y + 7 + s1, 1, 4, skin);
  else { px(ctx, x, y + 7 + s1, 1, 4, skin); px(ctx, x + 9, y + 8 - s1, 1, 4, skin); }
  if (dir !== "up") {
    if (L.team) px(ctx, x + 4, y + 8, 2, 2, "#ffffff");
    if (L.lanyard) { px(ctx, x + 4, y + 6, 1, 3, L.lanyard); px(ctx, x + 4, y + 9, 2, 2, "#fff"); }
    if (L.suit) { px(ctx, x + 4, y + 6, 2, 2, "#fff"); px(ctx, x + 4, y + 7, 1, 2, "#c33"); }
  }
  px(ctx, x + 2, y + 1, 6, 5, skin);
  if (dir === "up") {
    px(ctx, x + 2, y, 6, 5, hair);
    if (L.long) px(ctx, x + 2, y + 5, 6, 3, hair);
  } else {
    px(ctx, x + 2, y, 6, 2, hair);
    if (dir === "down") {
      px(ctx, x + 2, y + 2, 1, 1, hair); px(ctx, x + 7, y + 2, 1, 1, hair);
      if (L.long) { px(ctx, x + 1, y + 1, 1, 7, hair); px(ctx, x + 8, y + 1, 1, 7, hair); }
      px(ctx, x + 3, y + 3, 1, 1, "#222"); px(ctx, x + 6, y + 3, 1, 1, "#222");
      if (L.glasses) px(ctx, x + 3, y + 3, 4, 1, "#222");
    } else {
      const back = dir === "left" ? x + 6 : x + 2;
      px(ctx, back, y + 1, 2, 3, hair);
      if (L.long) px(ctx, back, y + 4, 2, 4, hair);
      const ex = dir === "left" ? x + 3 : x + 6;
      px(ctx, ex, y + 3, 1, 1, "#222");
      if (L.glasses) px(ctx, dir === "left" ? x + 2 : x + 5, y + 3, 3, 1, "#222");
    }
  }
  if (L.chair) { px(ctx, x + 3, y - 3, 4, 1, "#ffd166"); px(ctx, x + 3, y - 4, 1, 1, "#ffd166"); px(ctx, x + 5, y - 4, 1, 1, "#ffd166"); px(ctx, x + 6, y - 4, 1, 1, "#ffd166"); }
}

function drawBang(ctx, x, y, t, kind, crit) {
  const b = Math.round(Math.sin(t * 6) * 1.5);
  x = Math.round(x) - 5; y = Math.round(y) - 31 + b;
  const fill = kind === "mg" ? "#ffd166" : (crit && Math.floor(t * 4) % 2 ? "#ff5d6c" : "#ffffff");
  px(ctx, x - 1, y - 1, 12, 12, "#0b1640"); px(ctx, x + 3, y + 11, 4, 2, "#0b1640");
  px(ctx, x, y, 10, 10, fill); px(ctx, x + 4, y + 10, 2, 2, fill);
  if (kind === "mg") { px(ctx, x + 2, y + 3, 6, 4, "#0b1640"); px(ctx, x + 3, y + 2, 1, 1, "#0b1640"); px(ctx, x + 6, y + 2, 1, 1, "#0b1640"); px(ctx, x + 3, y + 4, 1, 1, "#ffd166"); px(ctx, x + 6, y + 4, 1, 1, "#ffd166"); }
  else { px(ctx, x + 4, y + 2, 2, 4, "#e63946"); px(ctx, x + 4, y + 7, 2, 2, "#e63946"); }
}

// ---------------- Audio ----------------
function beep(f = 660, d = .06, type = "square", v = .035) {
  if (muted || !actx) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = type; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.start(t); o.stop(t + d + .02);
}
const sfx = {
  msg: () => { beep(880, .08, "sine", .05); setTimeout(() => beep(1320, .1, "sine", .05), 90); },
  bang: () => { beep(520, .08); setTimeout(() => beep(780, .1), 80); },
  pick: () => beep(700, .05),
  good: () => { beep(660, .08); setTimeout(() => beep(990, .1), 80); },
  bad: () => beep(220, .18, "sawtooth", .03),
  type: () => beep(1400, .012, "square", .012),
  late: () => { beep(400, .12, "square", .03); setTimeout(() => beep(300, .16, "square", .03), 120); },
};

}
let statFlashTimer;
function applyFx(fx, quiet) {
  for (const [k, d] of Object.entries(fx)) s.stats[k] = Math.max(0, Math.min(100, s.stats[k] + d));

function checkGameOver() {

// ---------------- Aufgaben ----------------
function pickEvent() {
  const h = s.min / 60;
  const today = e => !e.day || e.day === s.day + 1;
  const worldFull = s.tasks.filter(t => t.kind !== "chat").length >= MAX_WORLD_TASKS;
  const busy = e => !e.chat && TEAM[e.who] && npcByName(e.who)?.task;
  const ok = e => !s.used.has(e.id) && today(e) && (!e.requires || s.flags.has(e.requires)) && !busy(e) && !(worldFull && !e.chat);
  const followUps = EVENTS.filter(e => ok(e) && e.requires);
  if (followUps.length && Math.random() < .5) return followUps[0];
  let pool = EVENTS.filter(e => ok(e) && !e.requires && (e.from ?? 0) <= h && h < (e.to ?? 24));
  if (!pool.length) pool = EVENTS.filter(e => ok(e) && !e.requires && (e.from ?? 0) <= h);
  return pool.length ? pick(pool) : null;
}

function spawnEvent() {
  const ev = pickEvent();
  if (!ev) return;
  s.used.add(ev.id);
  if (ev.chat) {
    const task = { kind: "chat", ev, chat: ev.chat, deadline: s.min + CHAT_TIME, who: ev.who };
    s.tasks.push(task);
    pushMsg(ev.chat, { from: ev.who, text: ev.text, task });
  } else {
    let npc = TEAM[ev.who] ? npcByName(ev.who) : null;
    const loc = LOCS[ev.loc];
    if (!npc) {
      npc = makeNPC({ kind: "temp", name: ev.who, role: ev.role, speed: 50,
        look: ev.who === "Hausmeister" ? { hair: "#8d8d8d", skin: pick(SKINS), shirt: "#5c6b73", pants: "#3b3b3b" }
          : ev.who === "Speaker" ? { hair: pick(HAIRS), skin: pick(SKINS), shirt: "#9b51e0", pants: "#1b1b24", lanyard: "#9b51e0" }
          : { hair: pick(HAIRS), skin: pick(SKINS), shirt: "#1f4fd8", team: true, long: Math.random() < .5 } });
      placeAt(npc, ...randomNear(loc, 4));
      s.npcs.push(npc);
    }
    const task = { kind: "world", ev, npc, loc: ev.loc, deadline: s.min + TASK_TIME, who: ev.who };
    npc.task = task;
    npc.path = findPath(tileOf(npc), [loc.x, loc.y]);
    npc.speed = Math.max(npc.speed, 55);
    s.tasks.push(task);
    sfx.bang();
    infoToast(`❗ ${ev.who} braucht dich · ${loc.label}`);
  }
  updateTaskBar();
}

function spawnMgQuest(q) {
  const npc = npcByName(q.who);
  const loc = LOCS[q.loc];
  const task = { kind: "mg", q, npc, loc: q.loc, deadline: s.min + 70, who: q.who };
  if (npc.task) { // Minigame hat Vorrang, die alte Aufgabe kommt später wieder
    s.tasks = s.tasks.filter(t => t !== npc.task);
    if (npc.task.ev) s.used.delete(npc.task.ev.id);
    if (dialogTask === npc.task) closeDialog();
  }
  npc.task = task;
  npc.path = findPath(tileOf(npc), [loc.x, loc.y]);
  s.tasks.push(task);
  sfx.bang();
  infoToast(`🎮 ${q.who} braucht Hilfe · ${loc.label}`);
  updateTaskBar();
}

function releaseNPC(npc) {
  if (!npc) return;
  npc.task = null; npc.path = []; npc.wait = 1 + Math.random() * 2;
  if (npc.kind === "temp") npc.leaveAt = s.min + 25;
  if (npc.kind === "team") npc.speed = 46;
}

function resolveTask(task, opt, late) {
  s.tasks = s.tasks.filter(t => t !== task);
  s.decisions++;
  if (opt.sets) s.flags.add(opt.sets);
  releaseNPC(task.npc);
  if (task.kind === "chat") {
    const m = s.chat[task.chat].msgs.find(m => m.task === task);
    if (m) m.answered = true;
    if (late) {
      pushMsg(task.chat, { from: task.who, text: pick(["Hab's jetzt selbst entschieden 🙄", "Okay, keine Antwort, ich mach einfach 🫠", "Hallo?? Naja, hab entschieden."]) });
    } else {
      pushMsg(task.chat, { me: true, text: opt.label });
      const happy = fxSum(opt.fx) >= 0;
      setTimeout(() => s && s.chat[task.chat] && pushMsg(task.chat, { from: task.who, text: happy ? pick(["👍", "Top, danke! 🙏", "Perfekt 💙", "Alles klar, mach ich!", "🔥🔥"]) : pick(["Okay… 😬", "Hm, okay 😅", "Wenn du meinst 🙃", "Na gut."]), silent: true }), 1400);
    }
  }
  // Wer zu spät kommt, kriegt die schlechtere Option und zusätzlich Frust im Team
  const fx = late ? { ...opt.fx, team: (opt.fx.team || 0) - LATE_TEAM_PENALTY } : opt.fx;
  applyFx(fx);
  addLog(task.who, opt.label, fx, late);
  if (late) { s.missed++; sfx.late(); setTimeout(() => s && infoToast(`⏰ Zu spät! ${task.who} hat ohne dich entschieden`), 50); }
  updateTaskBar();
  checkGameOver();
}

function expireTasks() {
  for (const task of [...s.tasks]) {
    if (s.min < task.deadline) continue;
    if (dialogTask === task) closeDialog();
    if (task.kind === "mg") {
      s.tasks = s.tasks.filter(t => t !== task);
      releaseNPC(task.npc);
      s.missed++; sfx.late();
      applyFx(task.q.bad, true);
      addLog(task.who, "Minigame verpasst", task.q.bad, true);
      infoToast(`⏰ ${task.who} musste es ohne dich machen`);
      updateTaskBar();
      if (checkGameOver()) return;
      continue;
    }
    const worst = fxSum(task.ev.a.fx) <= fxSum(task.ev.b.fx) ? task.ev.a : task.ev.b;
    resolveTask(task, worst, true);
    if (s.mode === "screen") return;
  }
}

function taskLabel(task) {
  if (task.kind === "chat") return { av: "💬", title: `${task.who} schreibt dir`, place: CHATS.find(c => c.id === task.chat).name };
  return { av: task.kind === "mg" ? "🎮" : "❗", title: task.who, place: LOCS[task.loc].label };
}
function updateTaskBar() {

function renderSheet() {

// ---------------- Dialog ----------------
let dialogTask = null, typeTimer = null, dialogKeys = null;
function openDialog({ name, role, look, avatar, text, options, later, onNext, timer }) {
  if (s.mode === "play") s.mode = "dialog";
  const d = $("dialog");
  d.hidden = false;
  d.innerHTML = `
    <div class="dlg-head">
      <div class="dlg-portrait" id="portrait">${look ? "" : (avatar || "💬")}</div>
      <div><div class="dlg-name">${name}</div>${role ? `<div class="dlg-role">${role}</div>` : ""}</div>
      ${timer ? `<div class="dlg-timer">⏰ ${timer} min</div>` : ""}
    </div>
    <div class="dlg-text" id="dtext"></div>
    <div class="dlg-opts" id="dopts" hidden>
      ${options ? options.map((o, i) => `<button class="dlg-opt" data-i="${i}"><span><span class="k">${i + 1}</span>${o.label}</span><span class="hint">${o.hint || ""}</span></button>`).join("")
        : `<button class="dlg-opt" data-next="1"><span>Weiter ▸</span></button>`}
    </div>
    ${later ? `<button class="dlg-later" id="dlater">Später</button>` : ""}`;
  if (look) {
    const c = document.createElement("canvas"); c.width = 12; c.height = 18;
    drawPerson(c.getContext("2d"), 6, 17, look, "down", 0);
    $("portrait").appendChild(c);
  }
  const full = typeof text === "function" ? text() : text;
  let n = 0;
  const textEl = $("dtext"), optsEl = $("dopts");
  const finish = () => { clearInterval(typeTimer); textEl.textContent = full; optsEl.hidden = false; };
  clearInterval(typeTimer);
  typeTimer = setInterval(() => {
    n += 2; textEl.textContent = full.slice(0, n);
    if (n % 6 === 0) sfx.type();
    if (n >= full.length) finish();
  }, 22);
  textEl.onclick = finish;
  optsEl.querySelectorAll(".dlg-opt").forEach(b => b.onclick = () => {
    sfx.pick();
    if (b.dataset.next) { closeDialog(true); onNext && onNext(); }
    else { const o = options[+b.dataset.i]; closeDialog(); o.onPick(); }
  });
  if (later) $("dlater").onclick = () => { closeDialog(); later(); };
  dialogKeys = e => {
    if (optsEl.hidden) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); finish(); } return; }
    if (!options && (e.key === "Enter" || e.key === " " || e.key === "e")) { e.preventDefault(); closeDialog(true); onNext && onNext(); }
    if (options && (e.key === "1" || e.key === "2")) { const o = options[+e.key - 1]; if (o) { sfx.pick(); closeDialog(); o.onPick(); } }
    if (later && e.key === "Escape") { closeDialog(); later(); }
  };
}
function closeDialog(keepMode) {
  clearInterval(typeTimer);
  $("dialog").hidden = true;
  dialogTask = null; dialogKeys = null;
  if (!keepMode && s && s.mode === "dialog") s.mode = "play";
}

function openTaskDialog(task) {
  if (!task || !s.tasks.includes(task)) return;
  keys.clear();
  const npc = task.npc;
  npc.dir = facing(npc, s.player);
  const left = Math.max(0, Math.ceil(task.deadline - s.min));
  const role = TEAM[task.who]?.role || task.ev?.role || npc.role;
  if (task.kind === "mg") {
    openDialog({ name: task.who, role, look: npc.look, text: task.q.text, timer: left, later: () => {},
      options: [
        { label: "Los geht's! 🎮", onPick: () => startMg(task) },
        { label: "Keine Zeit, sorry.", hint: hint({ fx: task.q.bad }), onPick: () => {
          s.tasks = s.tasks.filter(t => t !== task); releaseNPC(npc); applyFx(task.q.bad); addLog(task.who, "Keine Zeit für das Minigame", task.q.bad); updateTaskBar(); checkGameOver(); } },
      ] });
  } else {
    const ev = task.ev;
    openDialog({ name: task.who, role, look: npc.look, text: ev.text, timer: left, later: () => {},
      options: [ev.a, ev.b].map(o => ({ label: o.label, hint: hint(o), onPick: () => resolveTask(task, o) })) });
  }
  dialogTask = task;
}
function facing(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
}

const nameColor = name => ["#53bdeb", "#ff8a65", "#25d366", "#ffd279", "#c792ea", "#ff6b9a", "#7fdbca", "#f78c6c"][strHash(name) % 8];

function battery() { const d = DAYS[s.day]; return Math.max(4, Math.round(100 - ((s.min - d.start) / (d.end - d.start)) * 85)); }

function ambientTick() {
  const h = s.min / 60;
  const pool = AMBIENT.filter((m, i) => !s.ambientUsed.has(i) && (!m.day || m.day === s.day + 1) && (m.from_ ?? 0) <= h && h < (m.to ?? 24) && (!m.requires || s.flags.has(m.requires)));
  // Reaktionen auf Entscheidungen kommen bevorzugt
  const reactions = pool.filter(m => m.requires);
  if (reactions.length && Math.random() < .6) { const m = reactions[0]; s.ambientUsed.add(AMBIENT.indexOf(m)); return pushMsg(m.chat, { from: m.from, text: m.text }); }
  if (!pool.length) return;
  const m = pick(pool);
  s.ambientUsed.add(AMBIENT.indexOf(m));
  pushMsg(m.chat, { from: m.from, text: m.text });
}

let sceneQueue = [];
function runScene(scene) {
  s.scenesDone.add(scene.id);
  s.mode = "scene";
  closePhone(); $("sheet").hidden = true; closeDialog(true);
  keys.clear(); s.player.path = []; s.pendingTalk = null;
  sceneQueue = [...scene.steps];
  nextSceneStep();
}
function nextSceneStep() {
  if (!s || s.mode !== "scene") return;
  const st = sceneQueue.shift();
  if (!st) {
    s.mode = "play"; s.camTarget = null;
    for (const n of s.npcs) if (n.task) n.path = findPath(tileOf(n), [LOCS[n.task.loc].x, LOCS[n.task.loc].y]);
    return;
  }
  if (st.place) {
    const ent = st.place === "player" ? s.player : npcByName(st.place);
    if (ent) { placeAt(ent, st.x, st.y); ent.dir = st.dir || "down"; ent.wait = 6; }
    return nextSceneStep();
  }
  if (st.cam) { const L = LOCS[st.cam]; s.camTarget = { x: L.x * TS + 8, y: L.y * TS }; return setTimeout(nextSceneStep, 500); }
  if (st.seat) {
    const seats = shuffle(ZONES.so108);
    s.npcs.filter(n => n.kind === "crowd").forEach((n, k) => { placeAt(n, ...seats[k % seats.length]); n.dir = "up"; n.wait = 8 + Math.random() * 6; });
    return nextSceneStep();
  }
  if (st.party) {
    s.party = true;
    s.npcs.filter(n => n.kind !== "static").forEach(n => { n.task = null; placeAt(n, ...pick(ZONES.abend)); n.wait = 99; });
    s.tasks = []; updateTaskBar();
    return nextSceneStep();
  }
  if (st.lights) { s.stageLights = 4; return nextSceneStep(); }
  if (st.confetti) { spawnConfetti(); sfx.good(); if (st.fx) applyFx(st.fx, true); return nextSceneStep(); }
  if (st.wait) return setTimeout(nextSceneStep, st.wait);
  if (st.say) {
    const [who, text] = st.say;
    const npc = who === "Du" ? s.player : npcByName(who);
    return openDialog({ name: who, role: who === "Du" ? "Chair" : TEAM[who]?.role, look: npc?.look, avatar: who === "Tipp" ? "💡" : null, text, onNext: nextSceneStep });
  }
  if (st.end) return renderEnd();
  nextSceneStep();
}
function spawnConfetti() {
  const cols = ["#ffd166", "#ff5d6c", "#6fb1ff", "#3ecf8e", "#ffffff", "#c792ea"];
  for (let k = 0; k < 140; k++) s.confetti.push({ x: Math.random() * canvas.width, y: -Math.random() * canvas.height * .6, vx: (Math.random() - .5) * 30, vy: 30 + Math.random() * 50, c: pick(cols), r: Math.random() * 6 });
}

function countdown(ms, el, onEnd) {

    el.textContent = `${(left / 1000).toFixed(1)} s`;
    if (left <= 0) { clearInterval(iv); onEnd(); }
  }, 100);
  return { penalty: sec => { ms -= sec * 1000; } };
}

function playMic(title, text, baseSpeed) { mgIntro(title, text, () => runMic(baseSpeed)); }
function runMic(baseSpeed) {
  const ROUNDS = 3;
  let round = 0, hits = 0, pos = 0, dir = 1, speed = baseSpeed, zone, timer, last, locked = false;
  const results = [];
  showOverlay(`<div class="ov center"><div class="mg" style="flex:0"><div class="mg-title">MIC-CHECK</div>
    <div class="mg-hud"><span id="r">Mikro 1/3</span><span id="h">0 Treffer</span></div>
    <div class="rounds" id="rounds">🎤 🎤 🎤</div>
    <div class="meter"><div class="zone" id="zone"></div><div class="marker" id="marker"></div></div>
    <button class="btn" id="stop">Stopp!</button></div></div>`);
  const zEl = $("zone"), mEl = $("marker");
  function newZone() { const w = 16 - round * 2; zone = { start: rand(10, 90 - w), w }; zEl.style.left = zone.start + "%"; zEl.style.width = zone.w + "%"; }
  function loop() {
    const t = performance.now(), dt = last ? (t - last) / 1000 : 0; last = t;
    pos += dir * speed * dt;
    if (pos >= 100) { pos = 100; dir = -1; }
    if (pos <= 0) { pos = 0; dir = 1; }
    mEl.style.left = pos + "%";
  }
  function stop() {
    if (locked) return;
    locked = true; clearInterval(timer);
    const hit = pos >= zone.start && pos <= zone.start + zone.w;
    if (hit) { hits++; sfx.good(); } else sfx.bad();
    results.push(hit ? "✅" : "❌");
    $("rounds").textContent = results.concat(Array(ROUNDS - results.length).fill("🎤")).join(" ");
    $("h").textContent = `${hits} Treffer`;
    round++;
    setTimeout(() => {
      if (round >= ROUNDS) return finish();
      $("r").textContent = `Mikro ${round + 1}/3`;
      speed *= 1.45; last = null; locked = false;
      newZone(); timer = setInterval(loop, 16);
    }, 600);
  }
  function finish() {
    mgKeys = null;
    if (hits === 3) mgResult("🎙️", "Perfekter Sound!", "Alle Mikros laufen, SO108 bebt.", { speaker: 15 });
    else if (hits === 2) mgResult("🔊", "Läuft größtenteils", "Ein Mikro rauscht ein bisschen, aber passt schon.", { speaker: 5 });
    else if (hits === 1) mgResult("📢", "Fiepen im Saal", "Rückkopplung. Ganz SO108 hält sich die Ohren zu.", { speaker: -5, participants: -5 });
    else mgResult("🔇", "Totalausfall", "Auf der Mainstage wird ein einziges Handmikro herumgereicht.", { speaker: -15, participants: -5 });
  }
  $("stop").onclick = stop;
  mgKeys = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); stop(); } };
  newZone(); timer = setInterval(loop, 16);
}

function playInfopoint() {

function runInfopoint() {
  mgKeys = null;
  const PER_Q = 4000;
  let score = 0, streak = 0, best = 0, ended = false, qTimer, qStart, locked = false, lastQ = -1;
  showOverlay(`<div class="ov"><div class="mg"><div class="mg-title">INFOPOINT</div>
    <div class="mg-hud"><span id="t">25.0 s</span><span id="sc">0 Punkte</span></div>
    <div class="ask"><div class="face" id="face"></div><div class="q" id="q"></div><div class="qbar"><div id="qbar"></div></div></div>
    <div class="streak" id="streak"></div><div class="places" id="places"></div></div></div>`);
  countdown(25000, $("t"), finish);
  function nextQ() {
    if (ended) return;
    locked = false;
    let i; do { i = Math.floor(Math.random() * INFO_QUESTIONS.length); } while (i === lastQ);
    lastQ = i;
    const [q, answer] = INFO_QUESTIONS[i];
    const wrong = shuffle(Object.keys(INFO_PLACES).filter(p => p !== answer)).slice(0, 2);
    $("face").textContent = pick(["🧑", "👩", "👨", "🧑‍💼", "👩‍💼", "👨‍💼", "🧑‍🎓", "👩‍🎓"]);
    $("q").textContent = `„${q}“`;
    $("places").innerHTML = shuffle([answer, ...wrong]).map(p => `<button class="place" data-p="${p}" data-ok="${p === answer}"><span class="pi">${INFO_PLACES[p]}</span>${p}</button>`).join("");
    $("places").querySelectorAll(".place").forEach(b => b.onclick = () => answerQ(b));
    qStart = performance.now();
    clearInterval(qTimer);
    qTimer = setInterval(() => {
      const left = Math.max(0, 1 - (performance.now() - qStart) / PER_Q);
      const bar = $("qbar"); if (bar) bar.style.width = left * 100 + "%";
      if (left <= 0 && !locked) { locked = true; streak = 0; sfx.bad(); $("streak").textContent = "⏰ Zu langsam!"; setTimeout(nextQ, 350); }
    }, 50);
  }
  function answerQ(b) {
    if (ended || locked) return;
    locked = true;
    if (b.dataset.ok === "true") {
      streak++; best = Math.max(best, streak);
      score += streak >= 3 ? 2 : 1;
      b.classList.add("right"); sfx.good();
      $("streak").textContent = streak >= 3 ? `🔥 ${streak}er-Serie · doppelte Punkte` : "";
    } else {
      streak = 0; b.classList.add("wrongp"); sfx.bad();
      $("places").querySelector('[data-ok="true"]').classList.add("right");
      $("streak").textContent = "";
    }
    $("sc").textContent = `${score} Punkte`;
    setTimeout(nextQ, 350);
  }
  function finish() {
    ended = true; clearInterval(qTimer);
    if (score >= 12) mgResult("🧭", `${score} Punkte am Infopoint!`, `Beste Serie: ${best}. Niemand irrt mehr durchs Schloss.`, { participants: 15, erstis: 5 });
    else if (score >= 7) mgResult("🗺️", `${score} Punkte`, `Beste Serie: ${best}. Die meisten haben ihren Weg gefunden.`, { participants: 5 });
    else mgResult("😵‍💫", `Nur ${score} Punkte`, "Ein Speaker sucht SO108 immer noch in der Mensa.", { participants: -10, speaker: -5 });
  }
  nextQ();
}

  s.hist.push({ day: s.day, min: s.min, stats: { ...s.stats } });
}

// Bewertet eine Station: Wie viele Gruppen fehlen gerade?
function stationStatus(st) {
  const need = st.demand(s.day, s.min), have = s.alloc[st.id];
  return { need, have, missing: Math.max(0, need - have) };
}
function pauseEffect() {
  const p = s.alloc.pause;
  return p === 0 ? -3 : p === 1 ? 1 : 3;
}
function freeGroups() {
  return ERSTI_GROUPS - Object.values(s.alloc).reduce((a, b) => a + b, 0);
}
function understaffed() {
  return STATIONS.filter(st => stationStatus(st).missing > 0);
}

function shiftTick() {
  const fx = {};
  const add = (k, d) => { if (d) fx[k] = (fx[k] || 0) + d; };
  for (const st of STATIONS) add(st.stat, -2 * stationStatus(st).missing);
  add("erstis", pauseEffect());
  for (const k of Object.keys(fx)) if (!fx[k]) delete fx[k];
  if (!Object.keys(fx).length) return;
  applyFx(fx, true);
  const bad = understaffed();
  if (bad.length) {
    addLog("Schichtplan", `Unterbesetzt: ${bad.map(st => st.name).join(", ")}`, fx);
    infoToast(`⚠️ Unterbesetzt: ${bad.map(st => st.icon).join(" ")} · ⏸ Schichtplan`);
  } else if (s.alloc.pause === 0) {
    addLog("Schichtplan", "Erstis ohne Pause", fx);
  }
  checkGameOver();
}

function openPause(tab) {
  if (!s || !["play", "dialog"].includes(s.mode)) return;
  if (s.mode === "dialog") closeDialog();

}
function closePause() {
  screenKeys = null;

}

function sparkline(key) {
  const pts = s.hist.filter(h => h.day === s.day).map(h => h.stats[key]).concat(s.stats[key]);
  if (pts.length < 2) pts.unshift(pts[0]);
  const step = 100 / (pts.length - 1);
  const line = pts.map((v, i) => `${(i * step).toFixed(1)},${(28 - v / 100 * 26 - 1).toFixed(1)}`).join(" ");
  const col = s.stats[key] < 25 ? "#ff5d6c" : "#6fb1ff";
  return `<svg viewBox="0 0 100 28" preserveAspectRatio="none"><line x1="0" x2="100" y1="${28 - 25 / 100 * 26 - 1}" y2="${28 - 25 / 100 * 26 - 1}" stroke="#ff5d6c55" stroke-dasharray="2 2" stroke-width="1" vector-effect="non-scaling-stroke"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function trend(key) {
  const past = [...s.hist].reverse().find(h => h.day === s.day && s.min - h.min >= 55);
  if (!past) return `<span class="tr flat">·</span>`;
  const d = s.stats[key] - past.stats[key];
  return d > 0 ? `<span class="tr up">▲ ${d}</span>` : d < 0 ? `<span class="tr down">▼ ${-d}</span>` : `<span class="tr flat">± 0</span>`;
}

// ---------------- Bewegung ----------------
function moveAlong(ent, dt) {
  const [ti, tj] = ent.path[0];
  const tx = ti * TS + 8, ty = tj * TS + 13;
  const dx = tx - ent.x, dy = ty - ent.y, d = Math.hypot(dx, dy), step = ent.speed * dt;
  if (d <= step) { ent.x = tx; ent.y = ty; ent.path.shift(); }
  else { ent.x += dx / d * step; ent.y += dy / d * step; }
  if (d > .01) ent.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
  ent.walkT += step; ent.frame = Math.floor(ent.walkT / 5) % 2;
}
function canStand(x, y) {
  for (const ox of [-3, 3]) if (!isWalk(Math.floor((x + ox) / TS), Math.floor((y - 1) / TS))) return false;
  return true;
}
function walkToNPC(npc) {
  s.pendingTalk = npc;
  s.player.path = findPath(tileOf(s.player), tileOf(npc));
}

function updatePlayer(dt) {
  const p = s.player;
  let vx = 0, vy = 0;
  if (keys.has("arrowleft") || keys.has("a")) vx -= 1;
  if (keys.has("arrowright") || keys.has("d")) vx += 1;
  if (keys.has("arrowup") || keys.has("w")) vy -= 1;
  if (keys.has("arrowdown") || keys.has("s")) vy += 1;
  if (vx || vy) {
    p.path = []; s.pendingTalk = null;
    const l = Math.hypot(vx, vy), step = p.speed * dt;
    const nx = p.x + vx / l * step, ny = p.y + vy / l * step;
    if (canStand(nx, p.y)) p.x = nx;
    if (canStand(p.x, ny)) p.y = ny;
    p.dir = Math.abs(vx) > Math.abs(vy) ? (vx > 0 ? "right" : "left") : (vy > 0 ? "down" : "up");
    p.walkT += step; p.frame = Math.floor(p.walkT / 5) % 2;
  } else if (p.path.length) {
    moveAlong(p, dt);
  } else p.frame = 0;
  if (s.pendingTalk) {
    const n = s.pendingTalk;
    if (!n.task) s.pendingTalk = null;
    else if (Math.hypot(n.x - p.x, n.y - p.y) < 20) { p.path = []; s.pendingTalk = null; openTaskDialog(n.task); }
    else if (!p.path.length) p.path = findPath(tileOf(p), tileOf(n));
  }
}

function updateNPC(n, dt) {
  if (n.kind === "static") return;
  if (n.path.length) { moveAlong(n, dt); return; }
  n.frame = 0;
  if (n.task) { if (s.mode === "play") n.dir = facing(n, s.player); return; }
  const [ti, tj] = tileOf(n);
  if (grid[tj]?.[ti] === "s") n.dir = "up";
  n.wait -= dt;
  if (n.wait > 0) return;
  if (n.leaveAt && s.min > n.leaveAt) { n.remove = true; return; }
  const target = n.kind === "team" ? randomNear(LOCS[n.home], 3) : pick(ZONES[pickWeighted(crowdWeights())]);
  n.path = findPath([ti, tj], target);
  n.wait = 2 + Math.random() * 6;
}

// ---------------- Update-Schleife ----------------
function update(dt) {
  if (!s) return;
  s.t += dt;
  if (s.stageLights > 0) s.stageLights -= dt * .25;
  for (const c of s.confetti) { c.x += c.vx * dt; c.y += c.vy * dt; c.r += dt * 6; }
  s.confetti = s.confetti.filter(c => c.y < canvas.height + 10);

  if (s.mode === "title") {
    s.titleT += dt;
    s.camTarget = { x: 352 + Math.sin(s.titleT * .12) * 230, y: 230 + Math.cos(s.titleT * .09) * 200 };
    for (const n of s.npcs) updateNPC(n, dt);
    return;
  }
  if (s.mode === "play") {
    s.min += dt * 1000 / MS_PER_MIN;
    updatePlayer(dt);

    const phase = JSON.stringify(crowdWeights());
    if (phase !== s.phaseKey) { s.phaseKey = phase; for (const n of s.npcs) if (n.kind === "crowd") n.wait = Math.min(n.wait, Math.random() * 3); }

    const scene = SCENES.find(sc => sc.day === s.day && s.min >= sc.at && !s.scenesDone.has(sc.id));
    if (scene) { runScene(scene); return; }
    const q = MG_QUESTS.find(q => q.day === s.day && s.min >= q.at && !s.mgDone.has(q.id));
    if (q) { s.mgDone.add(q.id); spawnMgQuest(q); }
    if (s.min >= s.nextSpawn) { s.nextSpawn = s.min + rand(28, 42); spawnEvent(); }
    s.nextAmbient -= dt;
    if (s.nextAmbient <= 0) { s.nextAmbient = 9 + Math.random() * 12; ambientTick(); }
    if (s.min >= s.nextHist) { s.nextHist = s.min + 15; recordHist(); }
    if (s.min >= s.nextShift) { s.nextShift = s.min + SHIFT_EVERY; shiftTick(); if (s.mode !== "play") return; }
    expireTasks();
    if (s.mode === "play" && s.day === 0 && s.min >= DAYS[0].end) { endDay(); return; }
  }
  if (["play", "dialog", "scene"].includes(s.mode)) {
    for (const n of s.npcs) updateNPC(n, dt);
    s.npcs = s.npcs.filter(n => !n.remove);
  }
}

// ---------------- Rendern ----------------
function nightAlpha() {
  if (!s || s.mode === "title") return 0;
  const m = s.min;
  if (s.party) return .62;
  if (s.day === 0) {
    if (m < 8 * 60) return .22 * (8 * 60 - m) / 30;
    if (m > 18 * 60) return Math.min(.58, (m - 18 * 60) / 150 * .58);
  } else if (m > 18 * 60 + 30) return Math.min(.5, (m - (18 * 60 + 30)) / 90 * .5);
  return 0;
}

const LIGHTS = [
  { x: 22 * TS, y: 2 * TS, r: 70, c: "255,170,80", i: 1 },
  { x: 19.5 * TS, y: 2 * TS, r: 40, c: "255,120,200", i: .8 }, { x: 24.5 * TS, y: 2 * TS, r: 40, c: "120,160,255", i: .8 },
  { x: 22 * TS, y: 15 * TS, r: 60, c: "255,230,180", i: .7 }, { x: 22 * TS, y: 22 * TS, r: 60, c: "255,230,180", i: .7 },
  { x: 8 * TS, y: 14 * TS, r: 80, c: "170,110,255", i: .9 }, { x: 34 * TS, y: 16 * TS, r: 70, c: "255,230,180", i: .6 },
  { x: 32 * TS, y: 23 * TS, r: 50, c: "255,230,180", i: .6 }, { x: 40 * TS, y: 22 * TS, r: 40, c: "255,230,180", i: .6 },
  { x: 22 * TS, y: 30 * TS, r: 60, c: "140,180,255", i: .7 },
];
for (let x = 2; x <= 41; x += 3) { LIGHTS.push({ x: x * TS + 8, y: 4.6 * TS, r: 18, c: "255,210,120", i: .9 }); LIGHTS.push({ x: x * TS + 8, y: 9.6 * TS, r: 18, c: "255,210,120", i: .9 }); }

function hslToRgb(h) {
  const f = n => { const k = (n + h / 30) % 12; return Math.round(255 * (.5 - .5 * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return `${f(0)},${f(8)},${f(4)}`;
}

function render() {
  const cw = canvas.width, ch = canvas.height;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#040c30"; ctx.fillRect(0, 0, cw, ch);
  if (!s) return;
  const p = s.player;
  const target = { ...(s.camTarget || { x: p.x, y: p.y - 8 }) };
  // Bei offenem Dialog das Ziel ins obere Drittel schieben, damit der Dialog nichts verdeckt
  if (!$("dialog").hidden) target.y += ch * .2;
  const mw = W * TS, mh = H * TS;
  const k = s.mode === "title" ? 1 : .15;
  cam.x += (target.x - cw / 2 - cam.x) * k;
  cam.y += (target.y - ch / 2 - cam.y) * k;
  cam.x = mw < cw ? (mw - cw) / 2 : Math.max(0, Math.min(mw - cw, cam.x));
  cam.y = mh < ch ? (mh - ch) / 2 : Math.max(0, Math.min(mh - ch, cam.y));
  const cx = Math.round(cam.x), cy = Math.round(cam.y);

  ctx.save();
  ctx.translate(-cx, -cy);
  ctx.drawImage(mapCanvas, 0, 0);

  if (s.tapMark && s.t - s.tapMark.t < .5) {
    const r = 3 + (s.t - s.tapMark.t) * 10;
    ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(s.tapMark.x, s.tapMark.y, r, r * .5, 0, 0, Math.PI * 2); ctx.stroke();
  }

  const ents = s.mode === "title" ? [...s.npcs] : [...s.npcs, p];
  ents.sort((a, b) => a.y - b.y);
  for (const e of ents) {
    if (e.x < cx - 16 || e.x > cx + cw + 16 || e.y < cy - 8 || e.y > cy + ch + 24) continue;
    const bob = s.party && e.kind !== "player" ? -Math.abs(Math.round(Math.sin(s.t * 8 + e.x) * 2)) : 0;
    drawPerson(ctx, e.x, e.y, e.look, e.dir, e.frame, bob);
  }
  // Namensschilder
  ctx.font = "bold 6px sans-serif"; ctx.textAlign = "center";
  if (s.mode !== "title") for (const n of s.npcs) {
    if (!n.name || n.kind === "static" || s.party || s.mode === "scene") continue;
    const near = Math.hypot(n.x - p.x, n.y - p.y) < 44;
    if (!near && !n.task) continue;
    const w = Math.ceil(ctx.measureText(n.name).width) + 4;
    const yy = Math.round(n.y - (n.task ? 40 : 24));
    ctx.fillStyle = "rgba(7,22,80,.85)"; ctx.fillRect(Math.round(n.x - w / 2), yy - 6, w, 8);
    ctx.fillStyle = "#fff"; ctx.fillText(n.name, Math.round(n.x), yy);
  }
  for (const t of s.tasks) if (t.npc) drawBang(ctx, t.npc.x, t.npc.y, s.t, t.kind, t.deadline - s.min < 30);

  // Nacht und Lichter
  const a = nightAlpha();
  if (a > 0.01) {
    ctx.fillStyle = `rgba(6,10,45,${a})`; ctx.fillRect(cx, cy, cw, ch);
    ctx.globalCompositeOperation = "lighter";
    for (const L of LIGHTS) {
      if (L.x < cx - L.r || L.x > cx + cw + L.r || L.y < cy - L.r || L.y > cy + ch + L.r) continue;
      let col = L.c;
      if (s.party && L.y < 12 * TS) col = hslToRgb((s.t * 90 + L.x) % 360);
      const flick = s.party ? .6 + .4 * Math.sin(s.t * 10 + L.x) : 1;
      const g = ctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
      g.addColorStop(0, `rgba(${col},${a * L.i * .9 * flick})`); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.fillRect(L.x - L.r, L.y - L.r, L.r * 2, L.r * 2);
    }
    ctx.globalCompositeOperation = "source-over";
  }
  if (s.stageLights > 0) {
    ctx.globalCompositeOperation = "lighter";
    for (let k2 = 0; k2 < 3; k2++) {
      const lx = (3 + k2 * 4.5) * TS + Math.sin(s.t * 2 + k2) * 20, ly = 13.5 * TS;
      const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 46);
      g.addColorStop(0, `rgba(${["255,120,220", "120,170,255", "255,210,120"][k2]},${.35 * Math.min(1, s.stageLights)})`); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.fillRect(lx - 46, ly - 46, 92, 92);
    }
    ctx.globalCompositeOperation = "source-over";
  }
  ctx.restore();

  for (const c of s.confetti) { ctx.fillStyle = c.c; ctx.fillRect(Math.round(c.x + Math.sin(c.r) * 4), Math.round(c.y), 2, Math.sin(c.r) > 0 ? 3 : 1); }

  // Pfeil zur dringendsten Aufgabe, wenn sie außerhalb des Bildes ist
  if (s.mode === "play") {
    const t = s.tasks.filter(t => t.npc).sort((x, y) => x.deadline - y.deadline)[0];
    if (t) {
      const sx = t.npc.x - cx, sy = t.npc.y - 20 - cy;
      if (sx < 0 || sx > cw || sy < 0 || sy > ch) {
        const ang = Math.atan2(sy - ch / 2, sx - cw / 2);
        const sc = Math.min((cw / 2 - 12) / Math.abs(Math.cos(ang) || 1e-6), (ch / 2 - 12) / Math.abs(Math.sin(ang) || 1e-6));
        const ex = cw / 2 + Math.cos(ang) * sc, ey = ch / 2 + Math.sin(ang) * sc;
        const pulse = 1 + Math.sin(s.t * 6) * .15;
        ctx.save(); ctx.translate(Math.round(ex), Math.round(ey)); ctx.rotate(ang); ctx.scale(pulse, pulse);
        ctx.fillStyle = "#0b1640"; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-6, -7); ctx.lineTo(-6, 7); ctx.fill();
        ctx.fillStyle = t.kind === "mg" ? "#ffd166" : "#ffffff"; ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-4, -5); ctx.lineTo(-4, 5); ctx.fill();
        ctx.restore();
      }
    }
  }
}

// HUD-Elemente, die sich laufend ändern
let lastClock = "", lastTaskUpdate = 0, talkTarget = null;
function updateHud() {
  if (!s || s.mode === "title") return;
  const night = nightAlpha() > .2;
  const c = `${DAYS[s.day].title.toUpperCase()} · ${fmt(s.min)} ${night ? "🌙" : "☀️"}`;
  if (c !== lastClock) { $("clock").textContent = c; lastClock = c; }
  if (s.t - lastTaskUpdate > .5) {
    lastTaskUpdate = s.t; updateTaskBar();
    $("pausedot").hidden = !(understaffed().length || s.alloc.pause === 0);
    const pt = $("phtimer");
    if (pt && s.phoneChat) { const t = s.tasks.find(t => t.kind === "chat" && t.chat === s.phoneChat); if (t) pt.textContent = `⏰ ${Math.max(0, Math.ceil(t.deadline - s.min))} min`; }
  }
  let near = null;
  if (s.mode === "play" && !s.phoneOpen) {
    let best = 26;
    for (const t of s.tasks) if (t.npc) { const d = Math.hypot(t.npc.x - s.player.x, t.npc.y - s.player.y); if (d < best) { best = d; near = t.npc; } }
  }
  if (near !== talkTarget) {
    talkTarget = near;
    const b = $("talkbtn");
    b.hidden = !near;
    if (near) b.textContent = `💬 ${near.name}`;
  }
}

// ---------------- Eingabe ----------------
function resize() {
  const r = canvas.getBoundingClientRect();
  SCALE = Math.max(2, Math.round(r.width / 250));
  canvas.width = Math.max(1, Math.ceil(r.width / SCALE));
  canvas.height = Math.max(1, Math.ceil(r.height / SCALE));
}
window.addEventListener("resize", resize);

canvas.addEventListener("pointerdown", e => {
  if (!s || s.mode !== "play") return;
  const r = canvas.getBoundingClientRect();
  const wx = cam.x + (e.clientX - r.left) * canvas.width / r.width;
  const wy = cam.y + (e.clientY - r.top) * canvas.height / r.height;
  $("sheet").hidden = true;
  const hit = s.npcs.filter(n => n.task).find(n => Math.abs(wx - n.x) < 10 && wy > n.y - 36 && wy < n.y + 3);
  if (hit) { walkToNPC(hit); return; }
  s.pendingTalk = null;
  s.player.path = findPath(tileOf(s.player), [Math.floor(wx / TS), Math.floor((wy + 3) / TS)]);
  s.tapMark = { x: wx, y: wy, t: s.t };
});

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (dialogKeys) return dialogKeys(e);
  if (mgKeys) return mgKeys(e);
  if (screenKeys && !ov().hidden) return screenKeys(e);
  if (!s || s.mode !== "play") return;
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "tab"].includes(k)) e.preventDefault();
  if (k === "e" || k === " " || k === "enter") { if (talkTarget) openTaskDialog(talkTarget.task); return; }
  if (k === "p" || k === "tab") { s.phoneOpen ? closePhone() : openPhone(); return; }
  if (k === "escape") {
    if (s.phoneOpen) closePhone();
    else if (!$("sheet").hidden) $("sheet").hidden = true;
    else openPause();
    return;
  }
  if (!s.phoneOpen) keys.add(k);
});
document.addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
window.addEventListener("blur", () => keys.clear());

$("talkbtn").onclick = () => talkTarget && openTaskDialog(talkTarget.task);
$("phonebtn").onclick = () => { if (!s || !["play", "dialog"].includes(s.mode)) return; s.phoneOpen ? closePhone() : openPhone(); };
$("taskbtn").onclick = () => { if (!s || !["play", "dialog"].includes(s.mode)) return; $("sheet").hidden ? renderSheet() : ($("sheet").hidden = true); };
$("pausebtn").onclick = () => { if (s && s.mode === "pause") closePause(); else openPause(understaffed().length ? "erstis" : null); };

// ---------------- Start ----------------
let lastT = performance.now(), rafRunning = false;
function step() {
  const now = performance.now();
  const dt = Math.min(.05, (now - lastT) / 1000);
  lastT = now;
  update(dt); render(); updateHud();
}
requestAnimationFrame(function loop() { rafRunning = true; step(); requestAnimationFrame(loop); });
setInterval(() => { if (!rafRunning) step(); }, 16);

resize();
renderTitle();
</script>
</body>
</html>
