// ---------------- Dance-Off bei der Afterparty ----------------
function runDance(done) {
  if (SIM()) { applyFx({ team: 5, participants: 3 }, true); return done(); }
  setMusic("party");
  const bpm = TRACKS.party.bpm, beatS = 60 / bpm, LEN = 24;
  const notes = [];
  let last = -1;
  for (let b = 4; b < LEN / beatS - 2; b++) {
    if (Math.random() < .78) { let l; do { l = rand(0, 3); } while (l === last && Math.random() < .6); last = l; notes.push({ time: b * beatS, lane: l }); }
    if (b > 16 && Math.random() < .25) notes.push({ time: (b + .5) * beatS, lane: rand(0, 3) });
  }
  const d = { notes, time: -1.5, speed: 70, flash: [0, 0, 0, 0] };
  fpShow({ view: "dance", data: d, label: false });
  let combo = 0, best = 0, hits = 0, perfect = 0, ended = false, t0 = performance.now() + 1500;
  $("fpui").innerHTML = `<div class="fp-hud"><div class="fp-row"><span>🕺 DANCE-OFF IM SCHNECKENHOF</span><span id="dcombo">KOMBO 0</span></div></div>
    <div class="judge" id="judge">BEREIT?</div>
    <div class="lanes">${["◀", "▲", "▼", "▶"].map((a, k) => `<button class="lane" data-l="${k}">${a}</button>`).join("")}</div>`;
  const judge = (txt, col) => { const j = $("judge"); if (j) { j.textContent = txt; j.style.color = col; } };
  const press = lane => {
    if (ended) return;
    d.flash[lane] = fp.t + .1;
    const cand = notes.filter(n => !n.hit && !n.miss && n.lane === lane).sort((a, b) => Math.abs(a.time - d.time) - Math.abs(b.time - d.time))[0];
    const diff = cand ? Math.abs(cand.time - d.time) : 9;
    if (diff < .1) { cand.hit = true; combo++; hits++; perfect++; sfx.hit(); judge("PERFEKT!", "#ffd166"); }
    else if (diff < .18) { cand.hit = true; combo++; hits++; sfx.hit(); judge("GUT", "#6fb1ff"); }
    else { combo = 0; sfx.miss(); judge("DANEBEN", "#ff5d6c"); }
    best = Math.max(best, combo); $("dcombo").textContent = `KOMBO ${combo}`;
  };
  $("fpui").querySelectorAll(".lane").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); press(+b.dataset.l); }));
  const KEYMAP = { arrowleft: 0, a: 0, arrowup: 1, w: 1, arrowdown: 2, s: 2, arrowright: 3, d: 3 };
  speechKeys = e => { const l = KEYMAP[e.key.toLowerCase()]; if (l !== undefined) { e.preventDefault(); press(l); } };
  const iv = setInterval(() => {
    d.time = (performance.now() - t0) / 1000;
    if (d.time > -.5 && d.time < 0) judge("LOS!", "#3ecf8e");
    for (const n of notes) if (!n.hit && !n.miss && d.time - n.time > .2) { n.miss = true; combo = 0; const c = $("dcombo"); if (c) c.textContent = "KOMBO 0"; }
    if (d.time > LEN && !ended) { ended = true; clearInterval(iv); finish(); }
  }, 16);
  function finish() {
    speechKeys = null;
    const acc = hits / Math.max(1, notes.length);
    s.danceBest = best;
    if (best >= 25) unlock("tanz");
    const fx = acc >= .85 ? { team: 10, erstis: 5, participants: 5 } : acc >= .6 ? { team: 6, participants: 3 } : acc >= .35 ? { team: 2 } : { team: -3 };
    applyFx(fx, true); addLog("Du", `🕺 Dance-Off · ${Math.round(acc * 100)} % getroffen`, fx);
    const verdict = acc >= .85 ? ["🕺", "Dancefloor-Legende!"] : acc >= .6 ? ["💃", "Die Tanzfläche brennt"] : acc >= .35 ? ["🙂", "Solide Moves"] : ["🫠", "Du tanzt wie ein Chair nach zwei Tagen Q"];
    $("fpui").innerHTML = `<div class="speech frame" style="text-align:center"><div style="font-size:44px">${verdict[0]}</div><h2>${verdict[1]}</h2><p class="muted">${hits} von ${notes.length} getroffen · ${perfect} perfekt · beste Kombo ${best}</p><div class="fxlist">${fxChips(fx)}</div><button class="btn" id="ddone">Weiter ▶</button></div>`;
    $("ddone").onclick = () => { fpHide(); done(); };
  }
}

// ---------------- Management ----------------
function addLog(who, label, fx, late) {
  s.log.push({ day: s.day, min: s.min, who, label, fx, late });
}
function scoreNow() {
  const vals = Object.values(s.stats);
  return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length + Math.min(...vals) / 2);
}
function recordHist() {
  s.hist.push({ day: s.day, min: s.min, stats: { ...s.stats } });
}

// Bewertet eine Station: Wie viele Gruppen fehlen gerade?
function stationStatus(st) {
  const need = st.demand(s.day, s.min), have = s.alloc[st.id];
  return { need, have, missing: Math.max(0, need - have) };
}
function pauseEffect() {
  const p = s.alloc.pause;
  return p === 0 ? -3 : p === 1 ? 1 : 3;
}
function freeGroups() {
  return ERSTI_GROUPS - Object.values(s.alloc).reduce((a, b) => a + b, 0);
}
function understaffed() {
  return STATIONS.filter(st => stationStatus(st).missing > 0);
}

function shiftTick() {
  const fx = {};
  const add = (k, d) => { if (d) fx[k] = (fx[k] || 0) + d; };
  for (const st of STATIONS) add(st.stat, -2 * stationStatus(st).missing);
  for (const [k, v] of Object.entries(scaleFx(fx, "shift"))) fx[k] = v;
  add("erstis", pauseEffect());
  for (const m of activeMods()) if (m.shift) for (const [k, v] of Object.entries(m.shift)) add(k, v);
  for (const k of Object.keys(fx)) if (!fx[k]) delete fx[k];
  if (!Object.keys(fx).length) return;
  applyFx(fx, true);
  const bad = understaffed();
  if (bad.length) {
    addLog("Schichtplan", `Unterbesetzt: ${bad.map(st => st.name).join(", ")}`, fx);
    infoToast(`⚠️ Unterbesetzt: ${bad.map(st => st.icon).join(" ")} · ⏸ Schichtplan`);
  } else if (s.alloc.pause === 0) {
    addLog("Schichtplan", "Erstis ohne Pause", fx);
  }
  checkGameOver();
}

function openPause(tab) {
  if (!s || !["play", "dialog"].includes(s.mode)) return;
  if (s.mode === "dialog") { closeDialog(); fpHide(); }
  closePhone(); $("sheet").hidden = true; keys.clear();
  s.mode = "pause";

  renderPause();
}
function closePause() {

}

function sparkline(key) {
  const pts = s.hist.filter(h => h.day === s.day).map(h => h.stats[key]).concat(s.stats[key]);
  if (pts.length < 2) pts.unshift(pts[0]);
  const step = 100 / (pts.length - 1);
  const line = pts.map((v, i) => `${(i * step).toFixed(1)},${(28 - v / 100 * 26 - 1).toFixed(1)}`).join(" ");
  const col = s.stats[key] < 25 ? "#ff5d6c" : "#6fb1ff";
  return `<svg viewBox="0 0 100 28" preserveAspectRatio="none"><line x1="0" x2="100" y1="${28 - 25 / 100 * 26 - 1}" y2="${28 - 25 / 100 * 26 - 1}" stroke="#ff5d6c55" stroke-dasharray="2 2" stroke-width="1" vector-effect="non-scaling-stroke"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function trend(key) {
  const past = [...s.hist].reverse().find(h => h.day === s.day && s.min - h.min >= 55);
  if (!past) return `<span class="tr flat">·</span>`;
  const d = s.stats[key] - past.stats[key];
  return d > 0 ? `<span class="tr up">▲ ${d}</span>` : d < 0 ? `<span class="tr down">▼ ${-d}</span>` : `<span class="tr flat">± 0</span>`;
}

// ---------------- Bewegung ----------------
function moveAlong(ent, dt) {
  const [ti, tj] = ent.path[0];
  const [ci, cj] = tileOf(ent);
  if (Math.abs(ti - ci) + Math.abs(tj - cj) > 1 && PORTALS.get(pkey(ci, cj))?.[0] === ti && PORTALS.get(pkey(ci, cj))?.[1] === tj) {
    ent.x = ti * TS + 8; ent.y = tj * TS + 13; ent.path.shift();
    if (ent === s.player) floorChanged();
    return;
  }
  const tx = ti * TS + 8, ty = tj * TS + 13;
  const dx = tx - ent.x, dy = ty - ent.y, d = Math.hypot(dx, dy), step = ent.speed * dt;
  if (d <= step) { ent.x = tx; ent.y = ty; ent.path.shift(); }
  else { ent.x += dx / d * step; ent.y += dy / d * step; }
  if (d > .01) ent.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
  ent.walkT += step; ent.frame = Math.floor(ent.walkT / 5) % 2;
}
const OG_EDGE = 13.5 * TS; // alles darüber gehört zum 1. Obergeschoss
function floorChanged() {

function canStand(x, y) {
  for (const ox of [-3, 3]) if (!isWalk(Math.floor((x + ox) / TS), Math.floor((y - 1) / TS))) return false;
  return true;
}
function walkToNPC(npc) {
  s.pendingTalk = npc;
  s.player.path = findPath(tileOf(s.player), tileOf(npc));
}
const wantsTalk = n => n && (n.task || (n.kind === "speaker" && !s.met.has(n.sp.name)));
function talkTo(n) { if (n.task) openTaskDialog(n.task); else if (n.kind === "speaker") openSpeakerDialog(n); }

function updatePlayer(dt) {
  const p = s.player;
  p.speed = s.energy < 20 ? 58 : 82;
  let vx = 0, vy = 0;
  if (keys.has("arrowleft") || keys.has("a")) vx -= 1;
  if (keys.has("arrowright") || keys.has("d")) vx += 1;
  if (keys.has("arrowup") || keys.has("w")) vy -= 1;
  if (keys.has("arrowdown") || keys.has("s")) vy += 1;
  if (vx || vy) {
    p.path = []; s.pendingTalk = null;
    const l = Math.hypot(vx, vy), step = p.speed * dt;
    const nx = p.x + vx / l * step, ny = p.y + vy / l * step;
    if (canStand(nx, p.y)) p.x = nx;
    if (canStand(p.x, ny)) p.y = ny;
    p.dir = Math.abs(vx) > Math.abs(vy) ? (vx > 0 ? "right" : "left") : (vy > 0 ? "down" : "up");
    p.walkT += step; p.frame = Math.floor(p.walkT / 5) % 2;
    const [ci, cj] = tileOf(p), dest = PORTALS.get(pkey(ci, cj));
    if (dest && p.lastPortal !== pkey(ci, cj)) { placeAt(p, dest[0], dest[1]); p.dir = dest[1] < 20 ? "up" : "down"; floorChanged(); }
    p.lastPortal = PORTALS.has(pkey(...tileOf(p))) ? pkey(...tileOf(p)) : null;
  } else if (p.path.length) {
    moveAlong(p, dt);
  } else p.frame = 0;
  if (s.pendingTalk) {
    const n = s.pendingTalk;
    if (!wantsTalk(n)) s.pendingTalk = null;
    else if (Math.hypot(n.x - p.x, n.y - p.y) < 20) { p.path = []; s.pendingTalk = null; talkTo(n); }
    else if (!p.path.length) p.path = findPath(tileOf(p), tileOf(n));
  }
}

const ROAM = ["lounge", "so108", "innovillage", "hays", "innovillage", "hall", "kiosk", "speeddating", "workshops"];
function updateNPC(n, dt) {
  if (n.kind === "static") return;
  if (n.path.length) { moveAlong(n, dt); return; }
  n.frame = 0;
  if (n.task) { if (s.mode === "play") n.dir = facing(n, s.player); return; }
  const [ti, tj] = tileOf(n);
  if (grid[tj]?.[ti] === "s") n.dir = "up";
  n.wait -= dt;
  if (n.wait > 0) return;
  if (n.leaveAt && s.min > n.leaveAt) {
    if (n.kind === "speaker") {
      if (!n.leaving) { n.leaving = true; n.path = findPath([ti, tj], [31, 50]); return; }
      n.remove = true; return;
    }
    n.remove = true; return;
  }
  let target;
  if (n.kind === "team") target = randomNear(LOCS[n.home], 3);
  else if (n.kind === "speaker") target = randomNear(LOCS[pick(ROAM)], 2);
  else target = pick(ZONES[pickWeighted(crowdWeights())]);
  n.path = findPath([ti, tj], target);
  n.wait = n.kind === "speaker" ? 6 + Math.random() * 10 : 2 + Math.random() * 6;
}

function spawnSpeakers() {
  for (const p of s.speakerPlan) {
    if (p.done || s.min < p.at) continue;
    p.done = true;
    const sp = p.sp;
    const n = makeNPC({ kind: "speaker", name: sp.name, role: `${sp.role} · ${sp.org}`, sp, speed: 40, line: pick(SPEAKER_LINES), leaveAt: p.at + 200,
      look: lookFor(sp.name, { shirt: pick(["#2b2f3a", "#3d405b", "#ffffff", "#8d99ae", "#1b263b", "#6d597a"]), pants: "#1b1b24", suit: strHash(sp.name) % 2 === 0, lanyard: "#9b51e0" }) });
    placeAt(n, 31 + rand(-3, 3), 50);
    n.path = findPath(tileOf(n), [LOCS.lounge.x, LOCS.lounge.y]);
    s.npcs.push(n);
  }
}

function updatePigeons(dt) {
  const pl = s.player;
  for (const p of s.pigeons) {
    if (p.fly) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.gy += p.vy * .15 * dt; p.t += dt;
      if (p.t > 3.5) Object.assign(p, newPigeon(p.zone));
      continue;
    }
    p.hop -= dt;
    if (p.hop < 0) {
      p.hop = 1 + Math.random() * 3; p.dir = Math.random() < .5 ? -1 : 1;
      const nx = p.x + p.dir * rand(2, 6);
      if (isWalk(Math.floor(nx / TS), Math.floor(p.y / TS))) p.x = nx;
    }
    if (s.mode === "play" && !pl.hidden && Math.hypot(p.x - pl.x, p.y - pl.y) < 24) {
      p.fly = true; p.gy = p.y; p.t = 0;
      p.vx = (p.x >= pl.x ? 1 : -1) * (40 + Math.random() * 30); p.vy = -55 - Math.random() * 30;
      s.scared++; sfx.flap();
      if (s.scared >= 25) unlock("tauben");
    }
  }
}

function updateTram(dt) {
  const tr = s.tram;
  if (!tr) {
    s.nextTram -= dt;
    if (s.nextTram <= 0 && s.mode !== "scene" && !hasMod("noTram")) {
      s.nextTram = 40 + Math.random() * 35;
      const right = Math.random() < .5;
      s.tram = { x: right ? -8 * TS : W * TS + TS, vx: right ? 75 : -75, state: "pass", t: 0 };
      if (s.player && s.player.y > 44 * TS) sfx.ding();
    }
    return;
  }
  tr.t += dt;
  if (tr.state === "in") {
    const remain = tr.stopAt - tr.x;
    tr.x += Math.max(12, Math.min(tr.vx, remain * 1.6)) * dt;
    if (remain < 1) { tr.x = tr.stopAt; tr.state = "stop"; tr.t = 0; }
  } else if (tr.state === "stop") {
    if (tr.t > 1.2 && s.player.hidden) { s.player.hidden = false; s.player.dir = "up"; sfx.pick(); }
    if (tr.t > 2.4) { tr.state = "out"; tr.t = 0; tr.vx = 10; sfx.ding(); }
  } else if (tr.state === "out") {
    tr.vx = Math.min(110, tr.vx + 60 * dt); tr.x += tr.vx * dt;
    if (tr.x > W * TS + TS) s.tram = null;
  } else {
    tr.x += tr.vx * dt;
    if (tr.x > W * TS + 2 * TS || tr.x < -9 * TS) s.tram = null;
  }
}

function updateBarks(dt) {
  s.barks = s.barks.filter(b => b.until > s.t && !b.npc.remove);
  s.nextBark -= dt;
  if (s.nextBark > 0 || s.barks.length >= 2) return;
  s.nextBark = 2.5 + Math.random() * 3;
  const p = s.player;
  const cands = s.npcs.filter(n => (n.kind === "crowd" || n.kind === "team") && !n.task && Math.hypot(n.x - p.x, n.y - p.y) < 110 && !s.barks.some(b => b.npc === n));
  if (!cands.length) return;
  const n = pick(cands), m = s.min;

function updateWorldChecks(dt) {

    if (Math.hypot(i * TS + 8 - p.x, j * TS + 12 - p.y) < 26) {

// ---------------- Update-Schleife ----------------
function update(dt) {
  if (!s) return;
  s.t += dt;
  if (s.stageLights > 0) s.stageLights -= dt * .25;
  for (const c of s.confetti) { c.x += c.vx * dt; c.y += c.vy * dt; c.r += dt * 6; }
  s.confetti = s.confetti.filter(c => c.y < canvas.height + 10);

  if (s.mode === "title") {
    s.titleT += dt;
    s.camTarget = { x: 576 + Math.sin(s.titleT * .08) * 320, y: 590 + Math.cos(s.titleT * .06) * 230 };
    for (const n of s.npcs) updateNPC(n, dt);
    updatePigeons(dt); updateTram(dt);
    return;
  }
  if (s.mode === "play") {
    s.min += dt * 1000 / MS_PER_MIN;
    s.energy = Math.max(0, s.energy - dt * 1000 / MS_PER_MIN * ENERGY_DRAIN * modFactor("drain"));
    updatePlayer(dt);

    const phase = JSON.stringify(crowdWeights());
    if (phase !== s.phaseKey) { s.phaseKey = phase; for (const n of s.npcs) if (n.kind === "crowd") n.wait = Math.min(n.wait, Math.random() * 3); }

    const scene = SCENES.find(sc => sc.day === s.day && s.min >= sc.at && !s.scenesDone.has(sc.id));
    if (scene) { runScene(scene); return; }
    const q = MG_QUESTS.find(q => q.day === s.day && s.min >= q.at + (s.mgJit[q.id] || 0) && !s.mgDone.has(q.id));
    if (q) { s.mgDone.add(q.id); spawnMgQuest(q); }
    if (s.min >= s.nextSpawn) { s.nextSpawn = s.min + Math.round(rand(...MODE().spawn) * modFactor("spawn")); spawnEvent(); }
    s.nextAmbient -= dt;
    if (s.nextAmbient <= 0) { s.nextAmbient = 9 + Math.random() * 12; ambientTick(); }
    if (s.min >= s.nextHist) { s.nextHist = s.min + 15; recordHist(); }
    if (s.min >= s.nextShift) { s.nextShift = s.min + SHIFT_EVERY; shiftTick(); if (s.mode !== "play") return; }
    expireTasks();
    if (s.mode !== "play") return;
    spawnSpeakers();
    if (!SIM()) { updateWorldChecks(dt); updateBarks(dt); }
    if (s.day === 0 && s.min >= DAYS[0].end) { endDay(); return; }
    if (!SIM() && !s.party) setMusic(isNight() ? "night" : "day");
  }
  if (s.mode === "scene" && s.sceneWait && s.sceneWait()) { s.sceneWait = null; nextSceneStep(); }
  if (["play", "dialog", "scene"].includes(s.mode)) {
    if (s.mode === "scene" && s.player.path.length) moveAlong(s.player, dt);
    for (const n of s.npcs) updateNPC(n, dt);
    s.npcs = s.npcs.filter(n => !n.remove);
    if (!SIM()) { updatePigeons(dt); updateTram(dt); }
  }
}

function nightAlpha() {
  if (!s) return 0;
  if (s.mode === "title") return .55;
  const m = s.min;
  if (s.party) return .62;
  if (s.day === 0) {
    if (m < 8 * 60) return .2 * (8 * 60 - m) / 45;
    if (m > 18 * 60) return Math.min(.58, (m - 18 * 60) / 150 * .58);
  } else if (m > 19 * 60) return Math.min(.55, (m - 19 * 60) / 80 * .55);
  return 0;
}
function dayTint() {
  if (!s || s.mode === "title") return null;
  const m = s.min;
  if (m < 8 * 60 + 15) return `rgba(255,170,90,${.12 * clamp((8 * 60 + 15 - m) / 60, 0, 1)})`;
  if (m > 17 * 60 && m < 19 * 60 + 30) return `rgba(255,140,60,${.14 * Math.sin(Math.PI * (m - 17 * 60) / 150)})`;
  return null;
}

function hslToRgb(h) {
  const f = n => { const k = (n + h / 30) % 12; return Math.round(255 * (.5 - .5 * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return `${f(0)},${f(8)},${f(4)}`;
}

function drawDynamicMap(ctx, a) {

    const hue = (s.t * (s.party ? 120 : 40) + (i + j) * 30) % 360, on = s.party ? .55 + .45 * Math.sin(s.t * 8 + i * 1.3 + j) : .35;

// ---------------- Atmosphäre ----------------
// Wolkenschatten ziehen nur über Außenflächen, dazu Blütenblätter im Wind und eine leichte Vignette.
const INDOOR = new Set([":", ".", "_", "c", "s", "S", "#", "O", "E"]);
const outdoorMask = document.createElement("canvas");
outdoorMask.width = W * TS; outdoorMask.height = H * TS;
const OUT = new Uint8Array(W * H);
(function () {
  const g = outdoorMask.getContext("2d");
  g.fillStyle = "#000";
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const c = floor[j][i], gc = grid[j][i];
    if (INDOOR.has(c) || INDOOR.has(gc) || gc === "D") continue;
    OUT[j * W + i] = 1;
    g.fillRect(i * TS, j * TS, TS, TS);
  }
})();
const isOutdoorPx = (x, y) => { const i = Math.floor(x / TS), j = Math.floor(y / TS); return j >= 0 && j < H && i >= 0 && i < W && OUT[j * W + i] === 1; };
const CLOUDS = Array.from({ length: 7 }, (_, k) => ({ x: hash(k, 3) * W * TS, y: hash(3, k) * H * TS, r: 70 + hash(k, k) * 90, v: 5 + hash(k, 9) * 4 }));
const shadowCanvas = document.createElement("canvas");
const petals = [];
let vignette = null, vignetteKey = "";
function drawAtmosphere(ctx, cx, cy, cw, ch) {

  // Wolkenschatten
  if (day > .05) {
    if (shadowCanvas.width !== cw || shadowCanvas.height !== ch) { shadowCanvas.width = cw; shadowCanvas.height = ch; }
    const g = shadowCanvas.getContext("2d");
    g.globalCompositeOperation = "source-over"; g.clearRect(0, 0, cw, ch);
    g.drawImage(outdoorMask, cx, cy, cw, ch, 0, 0, cw, ch);
    g.globalCompositeOperation = "source-in";
    if (hasMod("rain")) { g.fillStyle = "rgba(20,30,70,1)"; g.fillRect(0, 0, cw, ch); }
    const span = W * TS + 400;
    for (const c of CLOUDS) {
      const x = ((c.x + s.t * c.v) % span) - 200 - cx, y = c.y - cy + Math.sin(s.t * .05 + c.r) * 20;
      if (x < -c.r * 1.6 || x > cw + c.r * 1.6 || y < -c.r || y > ch + c.r) continue;
      const gr = g.createRadialGradient(x, y, 0, x, y, c.r);
      gr.addColorStop(0, "rgba(20,30,70,1)"); gr.addColorStop(.6, "rgba(20,30,70,.55)"); gr.addColorStop(1, "rgba(20,30,70,0)");
      g.fillStyle = gr; g.save(); g.translate(x, y); g.scale(1.6, 1); g.translate(-x, -y); g.fillRect(x - c.r, y - c.r, c.r * 2, c.r * 2); g.restore();
    }
    ctx.globalAlpha = (hasMod("rain") ? .3 : .16) * day; ctx.drawImage(shadowCanvas, cx, cy); ctx.globalAlpha = 1;
  }
  // Regen: schräge Tropfen und kleine Spritzer, nur draußen
  if (hasMod("rain") && !s.party) {
    ctx.fillStyle = "rgba(190,215,255,.55)";
    for (let k = 0; k < 140; k++) {
      const sp = 200 + hash(k, 5) * 120, x = cx + hash(k, 7) * (cw + 60) - 30, y0 = cy + ((hash(k, 3) * (ch + 40) + s.t * sp) % (ch + 40)) - 20;
      const xx = Math.round(x - (y0 - cy) * .12), yy = Math.round(y0);
      if (!isOutdoorPx(xx, yy)) continue;
      ctx.fillRect(xx, yy, 1, 4); ctx.fillRect(xx - 1, yy + 4, 1, 2);
    }
    ctx.fillStyle = "rgba(220,235,255,.5)";
    for (let k = 0; k < 30; k++) {
      const ph = (s.t * 3 + hash(k, 11) * 10) % 1, x = Math.round(cx + hash(k, Math.floor(s.t * 3 + hash(k, 11) * 10)) * cw), y = Math.round(cy + hash(Math.floor(s.t * 3 + hash(k, 11) * 10), k) * ch);
      if (ph > .4 || !isOutdoorPx(x, y)) continue;
      const r = Math.round(ph * 6); ctx.fillRect(x - r, y, 1, 1); ctx.fillRect(x + r, y, 1, 1); ctx.fillRect(x, y - 1, 1, 1);
    }
  }
  if (hasMod("heat") && day > .3) { ctx.fillStyle = `rgba(255,170,80,${.07 * day})`; ctx.fillRect(cx, cy, cw, ch); }
  // Blütenblätter (April!) tagsüber, nachts ein paar Glühwürmchen im Schlossgarten
  if (petals.length < (s.party || hasMod("rain") ? 0 : 26) && Math.random() < .3) {
    const x = cx + Math.random() * cw, y = cy + Math.random() * ch;
    if (isOutdoorPx(x, y)) petals.push({ x, y, z: 10 + Math.random() * 20, vx: 6 + Math.random() * 8, ph: Math.random() * 6, life: 4 + Math.random() * 4, t: 0, c: day > .5 ? (Math.random() < .5 ? "#ffd1dc" : "#fff4f7") : "#fff3a0" });
  }
  for (let k = petals.length - 1; k >= 0; k--) {
    const q = petals[k]; q.t += 1 / 60;
    q.x += q.vx / 60; q.z -= 3 / 60; q.ph += .06;
    if (q.t > q.life || q.z < 0 || q.x < cx - 20 || q.x > cx + cw + 20) { petals.splice(k, 1); continue; }
    const al = Math.min(1, q.t * 2, (q.life - q.t) * 2);
    ctx.globalAlpha = al * (day > .5 ? .9 : .5 + .5 * Math.sin(q.ph * 3));
    px(ctx, Math.round(q.x + Math.sin(q.ph) * 3), Math.round(q.y - q.z), Math.sin(q.ph) > 0 ? 2 : 1, 1, q.c);
    if (day > .5 && al > .5) { ctx.globalAlpha = .15; px(ctx, Math.round(q.x), Math.round(q.y), 2, 1, "#000"); }
  }
  ctx.globalAlpha = 1;
  // Warmes Licht von links oben und Vignette
  const key = `${cw}x${ch}`;
  if (key !== vignetteKey) {
    vignetteKey = key; vignette = document.createElement("canvas"); vignette.width = cw; vignette.height = ch;
    const g = vignette.getContext("2d");
    const sun = g.createLinearGradient(0, 0, cw, ch);
    sun.addColorStop(0, "rgba(255,230,170,.10)"); sun.addColorStop(.5, "rgba(255,230,170,0)"); sun.addColorStop(1, "rgba(40,30,90,.08)");
    g.fillStyle = sun; g.fillRect(0, 0, cw, ch);
    const v = g.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * .35, cw / 2, ch / 2, Math.max(cw, ch) * .75);
    v.addColorStop(0, "rgba(4,8,40,0)"); v.addColorStop(1, "rgba(4,8,40,.32)");
    g.fillStyle = v; g.fillRect(0, 0, cw, ch);
  }
  ctx.drawImage(vignette, cx, cy);
}

// Scharfe Ebene in Bildschirmauflösung für Namen und Sprechblasen
const labelsQ = [];
const lc = $("labels"), lctx = lc.getContext("2d");
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function drawLabels(cx, cy) {
  const r = canvas.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W2 = Math.round(r.width * dpr), H2 = Math.round(r.height * dpr);
  if (lc.width !== W2 || lc.height !== H2) { lc.width = W2; lc.height = H2; }
  lctx.clearRect(0, 0, W2, H2);
  if (!labelsQ.length) return;
  const f = W2 / canvas.width, fs = Math.max(10, Math.min(15, SCALE * 2.6)) * dpr;
  lctx.textAlign = "center"; lctx.textBaseline = "middle";
  for (const L of labelsQ) {
    const x = (L.x - cx) * f, y = (L.y - cy) * f;
    if (L.k === "emoji") { lctx.font = `${fs * 1.3}px system-ui`; lctx.fillText(L.text, x, y); continue; }
    if (L.k === "name") {
      lctx.font = `700 ${fs * .85}px system-ui, -apple-system, sans-serif`;
      const w = lctx.measureText(L.text).width + fs * .9, h = fs * 1.35;
      roundRect(lctx, x - w / 2, y - h / 2, w, h, h / 2);
      lctx.fillStyle = L.sp ? "rgba(88,40,150,.92)" : L.team ? "rgba(31,79,216,.92)" : "rgba(7,22,80,.85)"; lctx.fill();
      lctx.lineWidth = dpr; lctx.strokeStyle = "rgba(255,255,255,.25)"; lctx.stroke();
      lctx.fillStyle = "#fff"; lctx.fillText(L.text, x, y + dpr * .5);
    } else {
      lctx.font = `600 ${fs}px system-ui, -apple-system, sans-serif`;
      const w = lctx.measureText(L.text).width + fs * 1.2, h = fs * 1.7;
      lctx.save(); lctx.shadowColor = "rgba(0,0,0,.3)"; lctx.shadowOffsetY = 2 * dpr; lctx.shadowBlur = 4 * dpr;
      roundRect(lctx, x - w / 2, y - h, w, h, fs * .5);
      lctx.fillStyle = "#fff"; lctx.fill();
      lctx.beginPath(); lctx.moveTo(x - fs * .35, y - 1); lctx.lineTo(x, y + fs * .5); lctx.lineTo(x + fs * .35, y - 1); lctx.fill();
      lctx.restore();
      lctx.fillStyle = "#0b1640"; lctx.fillText(L.text, x, y - h / 2 + dpr * .5);
    }
  }
}

function render() {
  const cw = canvas.width, ch = canvas.height;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#040c30"; ctx.fillRect(0, 0, cw, ch);
  if (!s) return;
  const p = s.player;
  if (s.camPan) {
    const pr = Math.min(1, (performance.now() - s.camPan.t0) / s.camPan.ms), pts = s.camPan.pts, segs = pts.length - 1;
    const f = pr * segs, k = Math.min(segs - 1, Math.floor(f)), u = f - k, e = u * u * (3 - 2 * u);
    s.camTarget = { x: pts[k][0] + (pts[k + 1][0] - pts[k][0]) * e, y: pts[k][1] + (pts[k + 1][1] - pts[k][1]) * e };
    if (pr >= 1) s.camPan = null;
  }
  const target = { ...(s.camTarget || { x: p.x, y: p.y - 8 }) };
  const mw = W * TS, mh = H * TS;
  const k = s.mode === "title" || s.camSnap ? 1 : s.camPan ? .5 : .15;
  s.camSnap = false;
  cam.x += (target.x - cw / 2 - cam.x) * k;
  cam.y += (target.y - ch / 2 - cam.y) * k;
  cam.x = mw < cw ? (mw - cw) / 2 : clamp(cam.x, 0, mw - cw);
  cam.y = mh < ch ? (mh - ch) / 2 : clamp(cam.y, 0, mh - ch);
  const cx = Math.round(cam.x), cy = Math.round(cam.y);
  const a = nightAlpha();

  ctx.save();
  ctx.translate(-cx, -cy);
  ctx.drawImage(mapCanvas, cx, cy, cw, ch, cx, cy, cw, ch);
  drawDynamicMap(ctx, a);
  if (s.tram) drawTram(ctx, s.tram);

  if (s.tapMark && s.t - s.tapMark.t < .5) {
    const r = 3 + (s.t - s.tapMark.t) * 10;
    ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(s.tapMark.x, s.tapMark.y, r, r * .5, 0, 0, Math.PI * 2); ctx.stroke();
  }

  const ents = s.mode === "title" ? [...s.npcs] : p.hidden ? [...s.npcs] : [...s.npcs, p];
  const drawList = ents.map(e => ({ y: e.y, e })).concat(s.pigeons.map(pg => ({ y: pg.fly ? pg.gy : pg.y, pg })));
  drawList.sort((a2, b2) => a2.y - b2.y);
  for (const d of drawList) {
    if (d.pg) { if (d.pg.x > cx - 10 && d.pg.x < cx + cw + 10 && d.pg.y > cy - 40 && d.pg.y < cy + ch + 10) drawPigeon(ctx, d.pg, s.t); continue; }
    const e = d.e;
    if (e.x < cx - 16 || e.x > cx + cw + 16 || e.y < cy - 8 || e.y > cy + ch + 28) continue;
    const bob = s.party && e.kind !== "player" ? -Math.abs(Math.round(Math.sin(s.t * 8 + e.x) * 2)) : 0;
    drawPerson(ctx, e.x, e.y, e.look, e.dir, e.frame, bob);
  }
  // Lichterketten über dem Schneckenhof
  ctx.strokeStyle = "rgba(20,20,30,.7)"; ctx.lineWidth = 1;
  for (const pts of STRINGS) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); }
  for (const [x, y] of BULBS) px(ctx, Math.round(x), Math.round(y), 2, 2, a > .2 ? "#ffe3a0" : "#efe3c0");

  // Namensschilder und Sprechblasen landen auf der scharfen Label-Ebene
  labelsQ.length = 0;
  const sameFloor = e => (e.y < OG_EDGE) === (p.y < OG_EDGE);
  if (s.mode !== "title" && s.mode !== "scene" && !s.party) {
    for (const n of s.npcs) {
      if (!n.name || n.kind === "static") continue;
      const near = Math.hypot(n.x - p.x, n.y - p.y) < 44;
      const sel = n.kind === "speaker" && !s.met.has(n.sp.name);
      if ((!near && !n.task && !sel) || !sameFloor(n)) continue;
      const label = n.kind === "speaker" ? (near ? `${n.name} · ${n.sp.org}` : n.sp.org) : n.name;
      labelsQ.push({ k: "name", x: n.x, y: n.y - (n.task || sel ? 40 : 25), text: label, sp: n.kind === "speaker", team: n.kind === "team" });
      if (sel && !n.task) drawBang(ctx, n.x, n.y, s.t, "selfie");
    }
    for (const b of s.barks) if (sameFloor(b.npc)) labelsQ.push({ k: "bark", x: b.npc.x, y: b.npc.y - 36, text: b.text });
  }
  for (const t of s.tasks) if (t.npc) drawBang(ctx, t.npc.x, t.npc.y, s.t, t.kind, t.deadline - s.min < 30);
  if (s.mode === "play" && s.energy < 20 && !p.hidden) labelsQ.push({ k: "emoji", x: p.x + 8, y: p.y - 24 + Math.sin(s.t * 3) * 2, text: "🥱" });
  drawAtmosphere(ctx, cx, cy, cw, ch);

  // Tageszeit und Nacht
  const tint = dayTint();
  if (tint) { ctx.fillStyle = tint; ctx.fillRect(cx, cy, cw, ch); }
  if (a > 0.01) {
    ctx.fillStyle = `rgba(6,10,45,${a})`; ctx.fillRect(cx, cy, cw, ch);
    ctx.globalCompositeOperation = "lighter";
    for (const [wx, wy, ww, wh] of WINDOWS) {
      if (wx < cx - 10 || wx > cx + cw || wy < cy - 10 || wy > cy + ch) continue;
      if (hash(wx, wy) < .35) continue;
      ctx.fillStyle = `rgba(255,190,100,${a * .9})`; ctx.fillRect(wx, wy, ww, wh);
    }
    const lights = LIGHTS.concat(GLOWS).concat(BULBS.map(([x, y]) => ({ x, y: y + 1, r: 8, c: "255,210,120", i: .7 })));
    for (const L of lights) {
      if (L.x < cx - L.r || L.x > cx + cw + L.r || L.y < cy - L.r || L.y > cy + ch + L.r) continue;
      let col = L.c;
      if (s.party && L.y < 33 * TS && L.y > 21 * TS && L.x > 10 * TS && L.x < 46 * TS) col = hslToRgb((s.t * 90 + L.x) % 360);
      const flick = s.party ? .6 + .4 * Math.sin(s.t * 10 + L.x) : 1;
      const g = ctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
      g.addColorStop(0, `rgba(${col},${a * L.i * .5 * flick})`); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.fillRect(L.x - L.r, L.y - L.r, L.r * 2, L.r * 2);
    }
    ctx.globalCompositeOperation = "source-over";
  }
  if (s.stageLights > 0) {
    ctx.globalCompositeOperation = "lighter";
    for (let k2 = 0; k2 < 3; k2++) {
      const lx = (9 + k2 * 3.5) * TS + Math.sin(s.t * 2 + k2) * 20, ly = 35 * TS;
      const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 50);
      g.addColorStop(0, `rgba(${["255,120,220", "120,170,255", "255,210,120"][k2]},${.35 * Math.min(1, s.stageLights)})`); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.fillRect(lx - 50, ly - 50, 100, 100);
    }
    ctx.globalCompositeOperation = "source-over";
  }
  // Die andere Etage ausblenden: Wer oben ist, sieht das Erdgeschoss nicht und umgekehrt
  if (s.mode !== "title") {
    const up = p.y < OG_EDGE;
    ctx.fillStyle = "#0a1030";
    if (up) ctx.fillRect(cx, OG_EDGE - 6, cw, cy + ch - OG_EDGE + 6);
    else if (cy < OG_EDGE) ctx.fillRect(cx, cy, cw, OG_EDGE - cy - 6);
  }
  ctx.restore();
  drawLabels(cx, cy);

  for (const c of s.confetti) { ctx.fillStyle = c.c; ctx.fillRect(Math.round(c.x + Math.sin(c.r) * 4), Math.round(c.y), 2, Math.sin(c.r) > 0 ? 3 : 1); }

  // Pfeil zur dringendsten Aufgabe, wenn sie außerhalb des Bildes ist
  if (s.mode === "play") {
    const t = s.tasks.filter(t => t.npc).sort((x, y) => x.deadline - y.deadline)[0];
    if (t) {
      const sx = t.npc.x - cx, sy = t.npc.y - 20 - cy;
      if (sx < 0 || sx > cw || sy < 0 || sy > ch) {
        const ang = Math.atan2(sy - ch / 2, sx - cw / 2);
        const sc = Math.min((cw / 2 - 14) / Math.abs(Math.cos(ang) || 1e-6), (ch / 2 - 30) / Math.abs(Math.sin(ang) || 1e-6));
        const ex = cw / 2 + Math.cos(ang) * sc, ey = ch / 2 + Math.sin(ang) * sc;
        const pulse = 1 + Math.sin(s.t * 6) * .15;
        ctx.save(); ctx.translate(Math.round(ex), Math.round(ey)); ctx.rotate(ang); ctx.scale(pulse, pulse);
        ctx.fillStyle = "#0b1640"; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-6, -7); ctx.lineTo(-6, 7); ctx.fill();
        ctx.fillStyle = t.kind === "mg" ? "#ffd166" : "#ffffff"; ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-4, -5); ctx.lineTo(-4, 5); ctx.fill();
        ctx.restore();
      }
    }
  }
}

// HUD-Elemente, die sich laufend ändern
let lastClock = "", lastTaskUpdate = 0, lastMini = 0, talkTarget = null;
function nextAgenda() {
  const items = AGENDA.filter(a => a[0] === s.day);
  return items.find(a => a[1] > s.min);
}
function updateHud() {
  if (!s || s.mode === "title") return;
  const night = nightAlpha() > .2;
  const c = `${DAYS[s.day].title.toUpperCase()} · ${fmt(s.min)}`;
  if (c !== lastClock) {
    $("clock").textContent = c; lastClock = c;
    $("sun").textContent = night ? "🌙" : s.min > 17 * 60 + 30 ? "🌇" : s.min < 8 * 60 + 30 ? "🌅" : "☀️";
    const d = DAYS[s.day]; $("dayfill").style.width = clamp((s.min - d.start) / (d.end - d.start), 0, 1) * 100 + "%";
    const nx = nextAgenda();
    $("nextup").innerHTML = nx ? `Als Nächstes: <b>${nx[2]}</b> · ${fmt(nx[1])} · ${nx[3]}` : "Gleich ist Schluss für heute";
    $("efill").style.width = s.energy + "%";
    $("energy").classList.toggle("low", s.energy < 20);
  }
  if (s.t - lastTaskUpdate > .5) {
    lastTaskUpdate = s.t; updateTaskBar();
    $("pausedot").hidden = !(understaffed().length || s.alloc.pause === 0);
    const pt = $("phtimer");
    if (pt && s.phoneChat) { const t = s.tasks.find(t => t.kind === "chat" && t.chat === s.phoneChat); if (t) pt.textContent = `⏰ ${Math.max(0, Math.ceil(t.deadline - s.min))} min`; }
  }
  if (s.t - lastMini > .25) { lastMini = s.t; renderMinimap(); }
  let near = null;
  if (s.mode === "play" && !s.phoneOpen) {
    let best = 26;
    for (const n of s.npcs) if (wantsTalk(n)) { const d = Math.hypot(n.x - s.player.x, n.y - s.player.y); if (d < best) { best = d; near = n; } }
  }
  if (near !== talkTarget) {
    talkTarget = near;
    const b = $("talkbtn");
    b.hidden = !near;
    if (near) b.innerHTML = `<span class="key">E</span>${near.kind === "speaker" && !near.task ? "📸" : "💬"} ${near.name}`;
  }
}

// ---------------- Eingabe ----------------
function resize() {
  const r = $("game").getBoundingClientRect();
  SCALE = Math.max(2, Math.round(Math.min(r.width / 300, r.height / 210)));
  canvas.width = Math.max(1, Math.ceil(r.width / SCALE));
  canvas.height = Math.max(1, Math.ceil(r.height / SCALE));
  fpResize();
}
window.addEventListener("resize", resize);

canvas.addEventListener("pointerdown", e => {
  if (!s || s.mode !== "play") return;
  const r = canvas.getBoundingClientRect();
  const wx = cam.x + (e.clientX - r.left) * canvas.width / r.width;
  const wy = cam.y + (e.clientY - r.top) * canvas.height / r.height;
  $("sheet").hidden = true;
  const hit = s.npcs.filter(wantsTalk).find(n => Math.abs(wx - n.x) < 10 && wy > n.y - 38 && wy < n.y + 3);
  if (hit) { walkToNPC(hit); return; }
  s.pendingTalk = null;
  s.player.path = findPath(tileOf(s.player), [Math.floor(wx / TS), Math.floor((wy + 3) / TS)]);
  s.tapMark = { x: wx, y: wy, t: s.t };
});

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (introKeys) return introKeys(e);
  if (coachKeys) return coachKeys(e);
  if (dialogKeys) return dialogKeys(e);
  if (speechKeys) return speechKeys(e);
  if (mgKeys) return mgKeys(e);
  if (screenKeys && !ov().hidden) return screenKeys(e);
  if (!s || s.mode !== "play") return;
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "tab"].includes(k)) e.preventDefault();
  if (k === "e" || k === " " || k === "enter") { if (talkTarget) talkTo(talkTarget); return; }
  if (k === "p" || k === "tab") { s.phoneOpen ? closePhone() : openPhone(); return; }
  if (k === "m" && !s.phoneOpen) { openMap(); return; }
  if (k === "escape") {
    if (s.phoneOpen) closePhone();
    else if (!$("sheet").hidden) $("sheet").hidden = true;
    else openPause();
    return;
  }
  if (!s.phoneOpen) keys.add(k);
});
document.addEventListener("keyup", e => { if (speechKeysUp) speechKeysUp(e); keys.delete(e.key.toLowerCase()); });
window.addEventListener("blur", () => keys.clear());

$("talkbtn").onclick = () => talkTarget && talkTo(talkTarget);
$("phonebtn").onclick = () => { if (!s || !["play", "dialog"].includes(s.mode)) return; s.phoneOpen ? closePhone() : openPhone(); };
$("taskbtn").onclick = () => { if (!s || !["play", "dialog"].includes(s.mode)) return; $("sheet").hidden ? renderSheet() : ($("sheet").hidden = true); };
$("pausebtn").onclick = () => { if (s && s.mode === "pause") closePause(); else openPause(understaffed().length ? "erstis" : null); };
$("mapbtn").onclick = openMap;
$("minimap").onclick = openMap;

// ---------------- Start ----------------
let lastT = performance.now();
function step() {
  const now = performance.now();
  const dt = Math.min(.05, (now - lastT) / 1000);
  lastT = now;
  update(dt); render(); updateHud(); fpRender(dt);
}
// Fallback, falls requestAnimationFrame pausiert (z. B. im Hintergrund-Tab)
requestAnimationFrame(function loop() { step(); requestAnimationFrame(loop); });
setInterval(() => { if (performance.now() - lastT > 60) step(); }, 30);

resize();
renderTitle();
</script>
</body>
