<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071650">
<title>Q-Summit: Feel the Q Spirit</title>
<style>
  :root {
    --bg: #071650;
    --card: #0f2470;
    --card-2: #1a3389;
    --card-3: #22409e;
    --text: #ffffff;
    --muted: #a9b8e8;
    --fill: #6fb1ff;
    --good: #3ecf8e;
    --bad: #ff5d6c;
    --warn: #ffd166;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  #app {
    width: 100%; max-width: 480px; min-height: 100%;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 14px;
  }
  h1 { font-size: 30px; margin: 0; line-height: 1.15; }
  h2 { font-size: 22px; margin: 0; }
  p { line-height: 1.5; margin: 0; }
  .muted { color: var(--muted); }
  .btn {
    appearance: none; border: 0; border-radius: 14px; cursor: pointer;
    background: #fff; color: var(--bg); font: inherit; font-weight: 700; font-size: 17px;
    padding: 16px 18px; width: 100%;
    transition: transform .08s;
  }
  .btn:active { transform: scale(.98); }
  .btn.secondary { background: var(--card-2); color: var(--text); }

  /* Startscreen */
  .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  .qlogo {
    width: 72px; height: 72px; border-radius: 22px; background: #fff; color: var(--bg);
    display: grid; place-items: center; font-weight: 900; font-size: 44px;
  }
  .tagline { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .rules { background: var(--card); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
  .rules .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .rules .grid2 div { display: flex; gap: 8px; align-items: center; }

  /* HUD */
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .stat .icon { font-size: 20px; }
  .stat .bar { width: 100%; height: 44px; background: var(--card); border-radius: 8px; overflow: hidden; position: relative; }
  .stat .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--fill); transition: height .45s ease, background .3s; }
  .stat.low .fill { background: var(--bad); }
  .stat .val { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stat.flash-up .bar { box-shadow: 0 0 0 2px var(--good); }
  .stat.flash-down .bar { box-shadow: 0 0 0 2px var(--bad); }
  .clock { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
  .clock .time { font-weight: 700; font-size: 17px; white-space: nowrap; }
  .clock .track { flex: 1; height: 6px; background: var(--card); border-radius: 3px; overflow: hidden; }
  .clock .progress { height: 100%; background: var(--warn); transition: width .45s; }

  /* Eventkarte */
  .card {
    background: var(--card); border-radius: 20px; padding: 20px;
    display: flex; flex-direction: column; gap: 14px; flex: 1;
    animation: cardIn .3s ease;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .who { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--card-2); display: grid; place-items: center; font-size: 28px; flex-shrink: 0; }
  .who .name { font-weight: 700; }
  .who .role { font-size: 14px; color: var(--muted); }
  .card .text { font-size: 19px; line-height: 1.45; flex: 1; }
  .options { display: grid; gap: 10px; }
  .opt {
    appearance: none; border: 0; cursor: pointer; text-align: left; font: inherit; color: var(--text);
    background: var(--card-2); border-radius: 14px; padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    transition: transform .08s, background .15s;
  }
  .opt:hover { background: var(--card-3); }
  .opt:active { transform: scale(.98); }
  .opt .label { font-weight: 600; font-size: 16px; line-height: 1.35; }
  .opt .hint { font-size: 13px; opacity: .75; white-space: nowrap; letter-spacing: 1px; }

  /* Toasts */
  .toasts { position: fixed; left: 50%; top: 170px; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: none; z-index: 10; flex-wrap: wrap; justify-content: center; width: 90%; max-width: 440px; }
  .toast { padding: 6px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; animation: toast 1.4s ease forwards; }
  .toast.up { background: var(--good); color: #062b1b; }
  .toast.down { background: var(--bad); color: #2b0609; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(8px); } 15% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }

  /* Minigames */
  .mg { display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .mg-hud { display: flex; justify-content: space-between; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cell {
    appearance: none; border: 0; border-radius: 16px; background: var(--card);
    cursor: pointer; transition: background .15s, transform .08s; color: inherit; font: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    aspect-ratio: 1; padding: 6px;
  }
  .cell .e { font-size: 34px; }
  .cell .l { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.2; }
  .cell:active { transform: scale(.95); }
  .cell.hit { background: var(--good); }
  .cell.miss { background: var(--bad); }
  .cell.done { opacity: .25; pointer-events: none; }
  .checklist { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .checklist span { background: var(--card); padding: 6px 10px; border-radius: 999px; font-size: 14px; }
  .checklist span.ok { background: var(--good); color: #062b1b; }
  .meter { position: relative; height: 56px; background: var(--card); border-radius: 14px; overflow: hidden; }
  .zone { position: absolute; top: 0; bottom: 0; background: rgba(62, 207, 142, .35); border-left: 2px solid var(--good); border-right: 2px solid var(--good); }
  .marker { position: absolute; top: 4px; bottom: 4px; width: 6px; margin-left: -3px; background: #fff; border-radius: 3px; }
  .rounds { display: flex; gap: 8px; justify-content: center; font-size: 28px; }
  .result { background: var(--card); border-radius: 20px; padding: 20px; display: grid; gap: 12px; text-align: center; }
  .result .big { font-size: 48px; }
  .fxlist { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .fx { padding: 6px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; }
  .fx.up { background: rgba(62, 207, 142, .2); color: var(--good); }
  .fx.down { background: rgba(255, 93, 108, .2); color: var(--bad); }

  /* Badge-Ausgabe */
  .guest { background: var(--card); border-radius: 20px; padding: 18px; text-align: center; display: grid; gap: 6px; }
  .guest .face { font-size: 44px; }
  .guest .gname { font-size: 22px; font-weight: 700; }
  .guest .grole { font-size: 15px; color: var(--muted); }
  .badges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .badge {
    appearance: none; border: 0; cursor: pointer; font: inherit; color: #0b1640;
    background: #fff; border-radius: 12px; overflow: hidden; padding: 0; text-align: center;
    transition: transform .08s;
  }
  .badge:active { transform: scale(.96); }
  .badge .stripe { color: #fff; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 6px 4px; }
  .badge .bq { font-size: 11px; color: #5a6aa0; padding-top: 8px; font-weight: 700; }
  .badge .bname { font-weight: 700; font-size: 16px; padding: 2px 6px 12px; }
  .badge.wrong { animation: shake .3s; outline: 3px solid var(--bad); }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  /* Tageswechsel / Ende */
  .end { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  .summary { background: var(--card); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
  .summary .row { display: grid; grid-template-columns: 28px 1fr 40px; align-items: center; gap: 10px; }
  .summary .track { height: 8px; background: var(--card-2); border-radius: 4px; overflow: hidden; }
  .summary .track div { height: 100%; background: var(--fill); }
  .summary .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
</style>
</head>

const app = document.getElementById("app");
const toasts = document.getElementById("toasts");
let s; // Spielzustand
let keyHandler = null;

function newState() {
  const stats = {};
  STATS.forEach(st => stats[st.key] = 55);
  return { stats, day: 0, time: DAYS[0].start, used: new Set(), flags: new Set(), mgDone: new Set(), decisions: 0 };
}

const fmt = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const statByKey = k => STATS.find(st => st.key === k);
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const fxChips = fx => Object.entries(fx).map(([k, d]) =>
  `<span class="fx ${d > 0 ? "up" : "down"}">${statByKey(k).icon} ${d > 0 ? "+" : ""}${d}</span>`).join("");

function bestScore() {
  try { return Number(localStorage.getItem("qs_best") || 0); } catch { return 0; }
}
function saveBest(v) {
  try { if (v > bestScore()) localStorage.setItem("qs_best", String(v)); } catch {}
}

function setKeys(fn) {
  if (keyHandler) document.removeEventListener("keydown", keyHandler);
  keyHandler = fn;
  if (fn) document.addEventListener("keydown", fn);
}

function startGame() {
  s = newState();

}

function renderDayIntro() {
  const d = DAYS[s.day];
  setKeys(e => { if (e.key === "Enter") next(); });
  app.innerHTML = `
    <div class="end">
      <div class="tagline">Q-Summit · ${d.title}</div>
      <h1>${s.day === 0 ? "Die Türen öffnen gleich." : "Guten Morgen, Chair."}</h1>
      <p class="muted">${d.sub}. Von ${fmt(d.start)} bis ${fmt(d.end)} Uhr.</p>
      ${s.day > 0 ? `<p>${OVERNIGHT.text}</p><div class="fxlist" style="justify-content:flex-start">${fxChips(OVERNIGHT.fx)}</div>${summary()}` : ""}
      <button class="btn" id="go">${d.title} starten</button>
    </div>`;
  document.getElementById("go").onclick = () => next();
}

// ---------- HUD ----------
function hud(flash = {}) {
  const d = DAYS[s.day];
  const pct = Math.min(100, ((s.time - d.start) / (d.end - d.start)) * 100);
  return `
    <div class="stats">
      ${STATS.map(st => {
        const v = s.stats[st.key];
        const cls = [v < 25 ? "low" : "", flash[st.key] > 0 ? "flash-up" : flash[st.key] < 0 ? "flash-down" : ""].join(" ");
        return `<div class="stat ${cls}" title="${st.name}">
          <div class="icon">${st.icon}</div>
          <div class="bar"><div class="fill" style="height:${v}%"></div></div>
          <div class="val">${v}</div>
        </div>`;
      }).join("")}
    </div>
    <div class="clock">
      <span class="time">${d.title} · ${fmt(s.time)}</span>
      <div class="track"><div class="progress" style="width:${pct}%"></div></div>
      <span class="muted">${fmt(d.end)}</span>
    </div>`;
}

// ---------- Ablauf ----------
function next(flash = {}) {
  if (s.time >= DAYS[s.day].end) {
    if (s.day < DAYS.length - 1) {
      s.day++;
      s.time = DAYS[s.day].start;
      for (const [k, d] of Object.entries(OVERNIGHT.fx)) s.stats[k] = Math.min(100, s.stats[k] + d);
      return renderDayIntro();
    }
    return renderEnd();
  }
  const mg = MINIGAMES.find(m => m.day === s.day && s.time >= m.at && !s.mgDone.has(m.id));
  if (mg) {
    s.mgDone.add(mg.id);
    return mg.play();
  }
  const ev = pickEvent();
  if (!ev) { s.time = DAYS[s.day].end; return next(flash); }
  renderEvent(ev, flash);
}

function pickEvent() {
  const h = s.time / 60;
  const today = e => !e.day || e.day === s.day + 1;
  const ok = e => !s.used.has(e.id) && today(e) && (!e.requires || s.flags.has(e.requires));
  const followUps = EVENTS.filter(e => ok(e) && e.requires);
  if (followUps.length && Math.random() < 0.5) return followUps[0];
  let pool = EVENTS.filter(e => ok(e) && !e.requires && (e.from ?? 0) <= h && h < (e.to ?? 24));
  if (!pool.length) pool = EVENTS.filter(e => ok(e) && !e.requires && (e.from ?? 0) <= h);
  return pool.length ? pick(pool) : null;
}

function renderEvent(ev, flash) {
  const hint = opt => Object.keys(opt.fx).map(k => statByKey(k).icon).join(" ");
  app.innerHTML = `
    ${hud(flash)}
    <div class="card">
      <div class="who">
        <div class="avatar">${ev.avatar}</div>
        <div><div class="name">${ev.who}</div><div class="role">${ev.role}</div></div>
      </div>
      <div class="text">${ev.text}</div>
      <div class="options">
        <button class="opt" data-o="a"><span class="label">${ev.a.label}</span><span class="hint">${hint(ev.a)}</span></button>
        <button class="opt" data-o="b"><span class="label">${ev.b.label}</span><span class="hint">${hint(ev.b)}</span></button>
      </div>
    </div>`;
  app.querySelectorAll(".opt").forEach(btn => btn.onclick = () => choose(ev, ev[btn.dataset.o]));
  setKeys(e => {
    if (e.key === "1" || e.key === "ArrowLeft") choose(ev, ev.a);
    if (e.key === "2" || e.key === "ArrowRight") choose(ev, ev.b);
  });
}

function applyFx(fx) {
  for (const [k, d] of Object.entries(fx)) {
    s.stats[k] = Math.max(0, Math.min(100, s.stats[k] + d));
  }
  showToasts(fx);
}

function choose(ev, opt) {
  setKeys(null);
  s.used.add(ev.id);
  s.decisions++;
  if (opt.sets) s.flags.add(opt.sets);
  applyFx(opt.fx);
  s.time += rand(30, 45);
  const dead = STATS.find(st => s.stats[st.key] <= 0);
  if (dead) return renderGameOver(dead);
  next(opt.fx);
}

function showToasts(fx) {
  toasts.innerHTML = Object.entries(fx).map(([k, d]) =>
    `<span class="toast ${d > 0 ? "up" : "down"}">${statByKey(k).icon} ${d > 0 ? "+" : ""}${d}</span>`).join("");
}

// ---------- Minigame-Rahmen ----------
function mgIntro(title, text, start) {
  toasts.innerHTML = "";
  setKeys(e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); start(); } });
  app.innerHTML = `
    ${hud()}
    <div class="mg">
      <div class="result">
        <div class="big">🎮</div>
        <h2>${title}</h2>
        <p class="muted">${text}</p>
        <button class="btn" id="go">Los!</button>
      </div>
    </div>`;
  document.getElementById("go").onclick = start;
}

function mgResult(emoji, title, text, fx) {
  applyFx(fx);
  toasts.innerHTML = ""; // Effekte stehen hier schon als Chips auf der Karte
  s.time += 20;
  const dead = STATS.find(st => s.stats[st.key] <= 0);
  const cont = () => dead ? renderGameOver(dead) : next(fx);
  setKeys(e => { if (e.key === "Enter") cont(); });
  app.innerHTML = `
    ${hud(fx)}
    <div class="mg">
      <div class="result">
        <div class="big">${emoji}</div>
        <h2>${title}</h2>
        <p class="muted">${text}</p>
        <div class="fxlist">${fxChips(fx)}</div>
        <button class="btn" id="cont">Weiter</button>
      </div>
    </div>`;
  document.getElementById("cont").onclick = cont;
}

function countdown(ms, el, onEnd) {
  const t0 = performance.now();
  const iv = setInterval(() => {
    const left = Math.max(0, ms - (performance.now() - t0));
    el.textContent = `${(left / 1000).toFixed(1)} s`;
    if (left <= 0) { clearInterval(iv); onEnd(); }
  }, 100);
  return { penalty: sec => { ms -= sec * 1000; } };
}

// ---------- Minigame: Goodie Bags packen ----------
function playGoodies() {
  mgIntro("Goodie Bags packen", "Bevor der Einlass öffnet, müssen oben am Treppenabsatz noch Goodie Bags gepackt werden. Tippe die Sachen von der Liste an. Falsche Sachen kosten 2 Sekunden.", runGoodies);
}

function runGoodies() {
  setKeys(null);
  let bags = 0, ended = false, need;
  app.innerHTML = `
    ${hud()}
    <div class="mg">
      <div class="mg-hud"><span id="t">25.0 s</span><span id="sc">0 Bags</span></div>
      <div class="checklist" id="list"></div>
      <div class="grid" id="grid"></div>
    </div>`;
  const grid = document.getElementById("grid"), list = document.getElementById("list");
  const timer = countdown(25000, document.getElementById("t"), finish);

  function newBag() {
    need = shuffle(GOODIES_OK).slice(0, 4);
    const items = shuffle([...need.map(x => [...x, true]), ...shuffle(GOODIES_WRONG).slice(0, 5).map(x => [...x, false])]);
    list.innerHTML = need.map(([e, l]) => `<span data-l="${l}">${e} ${l}</span>`).join("");
    grid.innerHTML = items.map(([e, l, good]) =>
      `<button class="cell" data-l="${l}" data-good="${good}"><span class="e">${e}</span><span class="l">${l}</span></button>`).join("");
    grid.querySelectorAll(".cell").forEach(c => c.onclick = () => tap(c));
  }
  function tap(c) {
    if (ended) return;
    if (c.dataset.good === "true") {
      c.classList.add("hit", "done");
      list.querySelector(`[data-l="${c.dataset.l}"]`).classList.add("ok");
      if (!list.querySelector("span:not(.ok)")) {
        bags++;
        document.getElementById("sc").textContent = `${bags} Bags`;
        setTimeout(() => !ended && newBag(), 150);
      }
    } else {
      timer.penalty(2);
      c.classList.add("miss");
      setTimeout(() => c.classList.remove("miss"), 250);
    }
  }
  function finish() {
    ended = true;
    if (bags >= 7) mgResult("🛍️", `${bags} Goodie Bags gepackt!`, "Der Treppenabsatz ist voll mit Bags. Die Participants können kommen.", { participants: 10, erstis: 5 });
    else if (bags >= 4) mgResult("👍", `${bags} Goodie Bags`, "Reicht erstmal, den Rest packen die Erstis zwischendurch.", { erstis: -5 });
    else mgResult("😬", `Nur ${bags} Goodie Bags`, "Die ersten Participants bekommen ihre Socken lose in die Hand gedrückt.", { participants: -10, erstis: -5 });
  }
  newBag();
}

// ---------- Minigame: Badge-Ausgabe ----------
function playBadges() {
  mgIntro("Badge-Ausgabe", "Der Check-in links am Haupteingang ist offen! Gib jeder Person das richtige Badge. Achte auf den Namen und die Rolle.", runBadges);
}

function runBadges() {
  setKeys(null);
  let score = 0, wrong = 0, ended = false;
  app.innerHTML = `
    ${hud()}
    <div class="mg">
      <div class="mg-hud"><span id="t">20.0 s</span><span id="sc">0 Badges</span></div>
      <div class="guest" id="guest"></div>
      <div class="badges" id="badges"></div>
    </div>`;
  const guestEl = document.getElementById("guest"), badgesEl = document.getElementById("badges");
  countdown(20000, document.getElementById("t"), finish);

  function person() {
    const pair = pick(LAST_PAIRS);
    return { first: pick(FIRST_NAMES), last: pick(pair), pair, role: pick(BADGE_ROLES) };
  }
  const key = p => `${p.first}|${p.last}|${p.role.k}`;

  function round() {
    const t = person();
    const other = t.pair.find(n => n !== t.last);
    const cands = [
      { ...t, last: other },                                                // ähnlicher Nachname
      { ...t, role: pick(BADGE_ROLES.filter(r => r !== t.role)) },          // gleiche Person, falsche Rolle
      { ...t, last: other, role: pick(BADGE_ROLES.filter(r => r !== t.role)) },
      person(), person(),
    ];
    const opts = [t];
    for (const c of cands) if (opts.length < 4 && !opts.some(o => key(o) === key(c))) opts.push(c);
    guestEl.innerHTML = `<div class="face">${pick(["🧑", "👩", "👨", "🧑‍💼", "👩‍💼", "👨‍💼"])}</div>
      <div class="gname">${t.first} ${t.last}</div><div class="grole">${t.role.k}</div>`;
    badgesEl.innerHTML = shuffle(opts).map(o => `
      <button class="badge" data-ok="${key(o) === key(t)}">
        <div class="stripe" style="background:${o.role.c}">${o.role.k}</div>
        <div class="bq">Q-SUMMIT</div>
        <div class="bname">${o.first} ${o.last}</div>
      </button>`).join("");
    badgesEl.querySelectorAll(".badge").forEach(b => b.onclick = () => {
      if (ended) return;
      if (b.dataset.ok === "true") {
        score++;
        document.getElementById("sc").textContent = `${score} Badges`;
        round();
      } else {
        wrong++;
        b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
      }
    });
  }
  function finish() {
    ended = true;
    const net = score - wrong;
    if (net >= 11) mgResult("🏆", `${score} Badges ausgegeben!`, `Nur ${wrong} Verwechslungen. Der Check-in läuft wie geschmiert, keine Schlange vor dem Schloss.`, { participants: 15, erstis: 5 });
    else if (net >= 6) mgResult("👍", `${score} Badges ausgegeben`, `${wrong} Verwechslungen. Ein bisschen Schlange, aber alle sind drin.`, { participants: 5 });
    else mgResult("🐌", `Nur ${score} Badges`, `${wrong} Verwechslungen. Ein Investor läuft jetzt als „Participant: Jonas Werner“ herum.`, { participants: -10, partner: -5 });
  }
  round();
}

// ---------- Minigame: Mic-Check ----------
function playMic(title, text, baseSpeed) {
  mgIntro(title, text, () => runMic(baseSpeed));
}

function runMic(baseSpeed) {
  const ROUNDS = 3;
  let round = 0, hits = 0, pos = 0, dir = 1, speed = baseSpeed, zone, timer, last, locked = false;
  const results = [];

  app.innerHTML = `
    ${hud()}
    <div class="mg">
      <div class="mg-hud"><span id="r">Mikro 1/3</span><span id="h">0 Treffer</span></div>
      <div class="rounds" id="rounds">🎤 🎤 🎤</div>
      <div class="meter"><div class="zone" id="zone"></div><div class="marker" id="marker"></div></div>
      <button class="btn" id="stop">Stopp!</button>
    </div>`;
  const zEl = document.getElementById("zone"), mEl = document.getElementById("marker");

  function newZone() {
    const w = 16 - round * 2;
    zone = { start: rand(10, 90 - w), w };
    zEl.style.left = zone.start + "%";
    zEl.style.width = zone.w + "%";
  }
  function loop() {
    const t = performance.now();
    const dt = last ? (t - last) / 1000 : 0;
    last = t;
    pos += dir * speed * dt;
    if (pos >= 100) { pos = 100; dir = -1; }
    if (pos <= 0) { pos = 0; dir = 1; }
    mEl.style.left = pos + "%";
  }
  function stop() {
    if (locked) return;
    locked = true;
    clearInterval(timer);
    const hit = pos >= zone.start && pos <= zone.start + zone.w;
    if (hit) hits++;
    results.push(hit ? "✅" : "❌");
    document.getElementById("rounds").textContent = results.concat(Array(ROUNDS - results.length).fill("🎤")).join(" ");
    document.getElementById("h").textContent = `${hits} Treffer`;
    round++;
    setTimeout(() => {
      if (round >= ROUNDS) return finish();
      document.getElementById("r").textContent = `Mikro ${round + 1}/3`;
      speed *= 1.45; last = null; locked = false;
      newZone(); timer = setInterval(loop, 16);
    }, 600);
  }
  function finish() {
    setKeys(null);
    if (hits === 3) mgResult("🎙️", "Perfekter Sound!", "Alle Mikros laufen, SO108 bebt.", { speaker: 15 });
    else if (hits === 2) mgResult("🔊", "Läuft größtenteils", "Ein Mikro rauscht ein bisschen, aber passt schon.", { speaker: 5 });
    else if (hits === 1) mgResult("📢", "Fiepen im Saal", "Rückkopplung. Ganz SO108 hält sich die Ohren zu.", { speaker: -5, participants: -5 });
    else mgResult("🔇", "Totalausfall", "Auf der Mainstage wird ein einziges Handmikro herumgereicht.", { speaker: -15, participants: -5 });
  }

  document.getElementById("stop").onclick = stop;
  setKeys(e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); stop(); } });
  newZone();
  timer = setInterval(loop, 16);
}

// ---------- Enden ----------
function summary() {
  return `<div class="summary">${STATS.map(st => `
    <div class="row"><span>${st.icon}</span>
      <div class="track"><div style="width:${s.stats[st.key]}%"></div></div>
      <span class="num">${s.stats[st.key]}</span></div>`).join("")}</div>`;
}

function renderGameOver(stat) {
  setKeys(e => { if (e.key === "Enter") startGame(); });
  app.innerHTML = `
    <div class="end">
      <div style="font-size:56px">${stat.icon}</div>
      <h1>Game over · ${DAYS[s.day].title}, ${fmt(s.time)}</h1>
      <p>${GAME_OVER[stat.key]}</p>
      ${summary()}
      <p class="muted">${s.decisions} Entscheidungen getroffen</p>
      <button class="btn" id="again">Nochmal versuchen</button>
      <button class="btn secondary" id="menu">Zum Start</button>
    </div>`;
  document.getElementById("again").onclick = startGame;
  document.getElementById("menu").onclick = renderStart;
}

function renderEnd() {
  const vals = Object.values(s.stats);
  const score = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length + Math.min(...vals) / 2);
  const prevBest = bestScore();
  saveBest(score);
  const [emoji, title, text] =
    score >= 85 ? ["🪩", "Legendäre Q", "Konfetti, DJ und ein komplett erschöpftes, glückliches Team auf der Afterparty. Über diese Q wird noch in fünf Jahren geredet."] :
    score >= 75 ? ["🥂", "Starke Q", "Ein paar Pannen, aber Partner, Speaker und Team feiern zusammen auf der Afterparty. Der Stress fällt endlich ab."] :
    score >= 62 ? ["😮‍💨", "Überlebt", "Es war chaotisch, aber die Q hat stattgefunden. Auf der Afterparty schläft das halbe Board im Stehen."] :
                  ["🫠", "Knapp vorbei am Desaster", "Formal hat die Q stattgefunden. Die Feedback-Umfrage öffnest du lieber nicht."];
  setKeys(e => { if (e.key === "Enter") startGame(); });
  app.innerHTML = `
    <div class="end">
      <div style="font-size:56px">${emoji}</div>
      <h1>${title}</h1>
      <p>${text}</p>
      ${summary()}
      <p><b>Score: ${score}</b> ${score > prevBest ? "· Neuer Rekord! 🎉" : `<span class="muted">· Rekord: ${Math.max(prevBest, score)}</span>`}</p>
      <p class="tagline" style="text-align:center">Feel the Q Spirit 💙</p>
      <button class="btn" id="again">Nochmal spielen</button>
    </div>`;
  document.getElementById("again").onclick = startGame;
}

renderStart();
</script>
